# ---------------------------------------------------------------- the Y ball nut chain

[[dim]]
sym = "BK12_STANDOFF_ASBUILT"
value = 5
provenance = "measured"
note = "BK12/BF12 mounted 5 above the extrusion, AS BUILT. 🔴 DO NOT DELETE because the standoff no longer exists in the design - that is exactly why this is here. NUT_FACE_BELOW_BEAM_ASBUILT was measured WITH the standoff, so converting that measurement to the design has to take the 5 back off before adding the interposer. Removing this symbol would silently resize the X end plate: it feeds XEP_H, which is the 242.5."

[[dim]]
sym = "NUT_FACE_BELOW_BEAM_ASBUILT"
value = 58
provenance = "measured"
note = "Beam underside to the ball nut's downward mounting face, as built with the 5 mm standoff. \U0001F534 SUPERSEDED 2026-10-10 AND NOTHING DERIVES FROM IT NOW. It used to feed NUT_FACE_BELOW_BEAM, which now runs on the screw axis instead. Kept rather than deleted because it records a disagreement worth remembering: taken with the 5 standoff, a nut h of 20 puts the as-built screw axis 38 below the beam, where that machine's own supports - 5 of standoff plus a 25 bore - put it at 30. It was 8 out against its own geometry before anyone tried to convert it, which is what finally condemned it."
source = "measured 2026-10-02"

[[dim]]
sym = "NUT_FACE_BELOW_BEAM"
expr = "Y_SCREW_BELOW_BEAM + NUT_AXIS_TO_FACE"
note = "55 - the ball nut's downward bolting face below the Y beam. \U0001F534 IT WAS 63 UNTIL 2026-10-10 and it is now built the other way round. It used to start from NUT_FACE_BELOW_BEAM_ASBUILT, a 58 calipered on the machine as it was built with the 5 mm standoff, and convert that to the design. It now starts from where the screw actually runs: Y_SCREW_BELOW_BEAM, which is his 35, plus the nut's own h. The old route disagreed with the supports by 8 and the supports won - BF12 and the casting are both spec parts and the 58 was one reading of a machine that no longer exists in that form. \u26a0 THIS MOVES XEP_H, so the X gantry end plate on Sheet 2a gets 8 shorter. It moves no hole against the beam - the rail and block figures are beam-local underneath and only their coordinates from the plate edge change. \u2705 CONFIRMED INDEPENDENTLY by him on 2026-10-10: the nut face stands 55 off the beam, below on Y and above on X, both being the same 10 of interposer plus 25 to the bore plus 20 of nut. That is also footnote 3.8's X chain, which already added those three to put the X doubler's top edge at 222 - so the 55 was in the prose before it was in this symbol."
[[dim]]
sym = "XEP_H"
expr = "XEP_TOP_ABOVE_BEAM + BEAM_H + NUT_FACE_BELOW_BEAM"
note = "235 - the MINIMUM height the X end plate has to reach, its bottom level with the ball nut's mounting face so the doubler and sole bracket can get to it. \U0001F534 IT IS A FLOOR AND NOT THE CUT, which is XEP_CUT. Those were the same symbol until 2026-10-10 and the conflation hid two drifts at once: T_INTERPOSER went 9.525 to 10 and took this from 242.525 to 243 without Sheet 2a hearing about it, and then NUT_FACE_BELOW_BEAM came down 8. Running a cut off a floor means every time the floor moves, a plate silently wants recutting. \u2705 The 242.5 cut clears this by 7.5 and that is spare metal, nothing more - his, 2026-10-10: no hole moves because of XEP_H."

[[dim]]
sym = "XEP_BOTTOM"
expr = "0 - (BEAM_H + NUT_FACE_BELOW_BEAM)"
note = "Plate bottom, measured from the Y beam top. Negative is down."

[[dim]]
sym = "SCREW_AXIS_X"
expr = "T_X_ENDPLATE + RAIL_STACK + (EXT_W / 2)"
note = "Y screw centreline, from the X end plate's INNER face. The (EXT_W / 2) term is BY CONSTRUCTION, not an assumption: the BK12 and BF12 support blocks are 60 wide and the BF12 tongue is cut 60 wide to match, so the screw is centred in 60 by the parts themselves. Reconciled against a measurement 2026-10-03: it leaves 21.81 of air past the doubler, which meets the 20 minimum."

[[dim]]
sym = "NUT_FACE_X"
value = 52
provenance = "vendor"
note = "Ball nut housing across the long way - B on the DSG1605 page, 52. Parallel with the X beam. \u2705 It had been carried since 2026-10-02 with a date and no source; the page turned up 2026-10-09 and confirms it."
source = "Vevor DSG1605 page, printed manual with the ball screw kit"

[[dim]]
sym = "NUT_FACE_Y"
value = 40
provenance = "vendor"
note = "Ball nut housing's mounting flat along the screw axis - L on the DSG1605 page, 40. With NUT_FACE_X's B of 52 this is the flat the sole plate lands on, 52 x 40. \u26a0 IT IS L, NOT H, AND I FIRST WROTE H: the page carries BOTH at 40, so nothing numeric moves, but they are different dimensions and conflating them would mislead the next reader. H is the housing's width in the face view and it is the one NUT_AXIS_TO_FACE is half of; L is the length along the screw and it is the one C1 and C2 divide up. \u2705 The check that settles which: NUT_INSET_Y comes out at 8, which is C1 - and C1 is an inset along L."
source = "Vevor DSG1605 page, printed manual with the ball screw kit"

[[dim]]
sym = "NUT_PATTERN_X"
value = 40
provenance = "vendor"
note = "40 - the pattern ACROSS the housing's mounting flat, P on the DSG1605 page, and the span a sole plate's clearance holes have to match. 4 x M5 THREADED INTO THE HOUSING, not through-holes. \u2705 CLOSED 2026-10-09 AFTER A FALSE ALARM WORTH RECORDING: the page is also labelled 6-Y, six M5 on a \u00f8W 38 circle, and 38 cannot be the spacing of four holes pitched 40, so the two looked irreconcilable. They are different interfaces. THE SIX ARE NUT_SFU_PATTERN - the housing bolting to the SFU ball nut's own flange, internal to the screw assembly and nothing to do with the machine. THE FOUR ON THE FLAT ARE THE MACHINE INTERFACE, and they are the ones in the LEFT view. \u2705 The four-hole reading is confirmed by arithmetic the page closes on itself: C1 + C2 + C1 = 8 + 24 + 8 = 40 = L, and NUT_INSET_Y had already derived to exactly that 8 before anyone had seen the page."

[[dim]]
sym = "NUT_PATTERN_Y"
value = 24
provenance = "vendor"
note = "24 - the nut\u2019s bolt pattern along its 40 mm face, the short axis of the four tapped M5. \u2705 CHALLENGED AND HELD, 2026-10-10. A caliper reading of 22 was taken off the part and then withdrawn as sloppy; the spec sheet\u2019s 24 is the one. It is recorded because the 2 mm was not harmless: these four are THREADED INTO THE NUT and have no float, so the sole plate\u2019s clearance holes have to match them exactly, and a 22 would have moved Sheet 4\u2019s N1-N4 to X 29 and 51, Sheet 11\u2019s to Y 66 and 88, and Sheet 5\u2019s to plus or minus 11. \u26a0 THIS NOTE USED TO READ \u201cPattern along Y\u201d AND NOTHING ELSE, which is why the symbol drew suspicion the moment a second figure appeared - every other number in this group cites the DSG1605 page and this one cited nothing. A thin note is not evidence of a thin number, but it is what makes a good number impossible to defend."

[[dim]]
sym = "NUT_AXIS_TO_FACE"
value = 20
provenance = "vendor"
note = "20 - the screw axis above the ball nut housing\u2019s mounting face, h on the DSG1605 page. \U0001F534 IT DISAGREES WITH THE SUPPORT BLOCKS BY 8, AND ONE OF THE TWO IS WRONG. The Y screw axis can be reached two ways and they do not meet. Via the blocks: BF12 sits upside down with its base level with the interposer's underside, so the axis is Y_BEAM_UNDERSIDE - T_INTERPOSER - SCREW_AXIS_H = 182 - 10 - 25 = 147. Via the nut: the face is NUT_FACE_BELOW_BEAM under the beam and the axis NUT_AXIS_TO_FACE above it, so 182 - 63 + 20 = 139. Those are the two ends of ONE screw. The same 8 is in the as-built pair as well, which points at a constant being wrong rather than a slip. SCREW_AXIS_H's 25 is confirmed off the BF/BK12 spec - his, 2026-10-10 - so the error is on the nut side: either NUT_FACE_BELOW_BEAM is 8 too big or NUT_AXIS_TO_FACE is 8 too small. \u26a0 NOTHING HERE HAS BEEN CHANGED TO MAKE IT CLOSE. THE MEASUREMENT THAT SETTLES IT: the nut housing's H, across the mounting face - if it is 40 then h is 20 and NUT_FACE_BELOW_BEAM moves to 55; if it is 56 then h is 28 and the nut chain was right all along. Measuring the built machine's beam underside down to the nut's mounting face does it just as well. WHAT IT WOULD ACTUALLY MOVE, and it is less than it looks. dims.py deps lists 14 dependents including all four BLOCK_*_COL, and reading that as \u201cthe sixteen bearing block holes move\u201d is WRONG - his correction, 2026-10-10. RAIL_LOW_Z and RAIL_HIGH_Z are beam-local, measured off the beam\u2019s bottom face; RAIL_LOW_XEP and the BLOCK_*_COL only re-express those same holes as coordinates from the PLATE\u2019S BOTTOM EDGE. Move that edge and the numbers change while every hole stays exactly where it was against the beam. The only thing genuinely at stake is XEP_H - how far the X end plate runs down - and running 8 longer than it needs to is spare metal, not a fault. So this is worth getting right, but it is not a reason to hold up Sheet 2a. The half-of-H reasoning below is the part most likely to be the fault: it assumes the page\u2019s H is 40 and that the bore is centred across it, and his 2026-10-10 figure for the nut across is 52, not 40. If H is really 56 this symbol is 28. \u2705 THE CONVENTION IS THE SAME ONE BK-12 AND BF-12 USE for their h of 25, which is what lets these numbers be added up the way they are. It checks against the page\u2019s own H of 40: the bore sits centred across that width, so h is half of it. This is the last term in the height chain at both ends of the machine - on Y the nut hangs and the face points down, on X the screw runs on top of the beam and the face points up."
source = "Vevor DSG1605 page, printed manual with the ball screw kit"

[[dim]]
sym = "CASTING_AXIS_ABOVE_FOOT"
value = 25
provenance = "part"
note = "25 - the cast stepper frame\u2019s screw axis above its own foot, measured 2026-10-02. \u26a0 IT EXISTED ONLY IN y-beam-support.md PROSE UNTIL 2026-10-09 and now feeds the X nut height, which is why it is a symbol. The casting inherits BK12\u2019s bearing geometry, so this is the same 25 as BK-12 and BF-12\u2019s h - worth knowing as a cross-check, not a derivation, since nothing guarantees a casting copies a support block\u2019s axis height."

[[dim]]
sym = "X_BEAM_TOP_XC"
expr = "X_BLOCK_UPPER_CENTRE + (BEAM_H - RAIL_HIGH_Z)"
note = "151 - the X beam’s top face above the BOTTOM of the X carriage plate. 🔴 IT WAS 167 AND CARRIED AS MEASURED UNTIL 2026-10-10, AND IT CANNOT EVER HAVE BEEN MEASURED: the X carriage plate has never been on the beam, so there was no such distance to put a rule across. His, 2026-10-10. It is DERIVED now and the chain is his: Sheet 3a puts the upper block row X4/8/12/16 at 152 up the plate, the Vevor block page puts 6 from a hole centre to the block’s side, so that side is at 158 - and the block stands 7 proud of the beam top, which is BLOCK_W/2 less the rail’s 15 from the beam’s top face. 158 less 7 is 151. The expression reaches the same point more directly, through the block CENTRE, which is the rail centre: X_BLOCK_UPPER_CENTRE plus the beam’s own 15 above that rail. ✅ THE LOWER ROW AGREES: X1/5/9/13 at 30 and X2/6/10/14 at 62 centre the lower block at 46, less the same 15 puts the beam’s BOTTOM at 31, and 31 plus BEAM_H is 151. ⚠ THE 16 IT TOOK OFF MOVES REAL HOLES - X_NUT_FACE_Z, X_DOUBLER_BOTTOM and X_DOUBLER_BOLT_XC all come down with it, so Sheet 3a’s back-face holes are 16 lower than they were drawn. IT IS REFERENCED TO THE CARRIAGE PLATE, NOT TO THE TORSION BOX, and that is deliberate: everything bolted to the carriage plate is laid out from that plate’s own bottom edge, so a height taken from the box would have to be converted every time and would go stale the moment the gantry moved. X_BEAM_TOP_Z is the box-referenced figure and the two are not interchangeable."
source = "his, 2026-10-10"
[[dim]]
sym = "X_BLOCK_UPPER_CENTRE"
value = 136
provenance = "derived"
note = "136 - the upper pair of X-axis bearing blocks, centred between Sheet 3a's X1-X16 columns at 120 and 152. ⚠ THOSE TWO ARE 32 APART, WHICH IS BLOCK_PITCH_X, THE ACROSS-RAIL PITCH - not the along-rail 36. The X carriage plate hangs with its 407 VERTICAL, so the X beam's rails run along the plate's Y and each block extends BLOCK_W along the plate's X. Getting that backwards makes the block look 77 long up the plate instead of 44 wide, and it is an easy mistake: the Y values on that same sheet really are on the 36."

[[dim]]
sym = "X_DOUBLER_BLOCK_CLEAR"
expr = "X_DOUBLER_BOTTOM - X_BLOCK_UPPER_CENTRE - (BLOCK_W / 2)"
note = "3 - the gap up the plate between the upper X bearing blocks and the bottom of the nut doubler. They share the plate's REAR face, and nothing had checked they clear until the doubler was drawn on Sheet 3a on 2026-10-09. ✅ THE REASON THEY CLEAR IS STRUCTURAL, NOT ARITHMETIC - his, 2026-10-09: the doubler sits ABOVE THE TOP OF THE X BEAM, and the blocks ride the beam, so they cannot reach it. X_DOUBLER_BOTTOM less X_BEAM_TOP_XC is exactly T_INTERPOSER, 10, because the nut height is built up from the beam top through that interposer. The 3 is the slack that follows - it was 19 until X_BEAM_TOP_XC came down 16 on 2026-10-10, and 3 is tight enough to be worth knowing even though nothing depends on it. It is the number to re-read if the nut height ever changes - but the ordering is guaranteed by the chain, not by this value staying positive."

[[dim]]
sym = "X_SCREW_AXIS"
expr = "RAIL_STACK + (EXT_W / 2)"
note = "60 - the X screw axis out from the X carriage plate's REAR face, the face the doubler bolts to. ✅ THE PLATE'S OWN THICKNESS IS NOT IN THIS CHAIN and that is the whole difference from Y. SCREW_AXIS_X on the Y side is 72.19 because it measures from the X end plate's INNER face and so carries the plate's 12.19; here the root sits on the rear face and the 12.19 drops out. That is why every X number on Sheet 11 is round where Sheet 5's are not, and it also means T_X_CARRIAGE_PLATE - a nominal 12.7 still flagged to caliper - cannot move any of them."

[[dim]]
sym = "X_SOLE_BRACKET_L"
expr = "X_SCREW_AXIS + (NUT_FACE_X / 2)"
note = "86 - the X nut sole plate's root to tip, which is Sheet 5's 98.19 less the 12.19 that the end plate contributed. ✅ IT CLOSES ON THE NUT: 86 less X_NUT_BOLT_FAR's 80 is 6, which is NUT_INSET_X, so the plate's tip finishes flush with the nut face's edge rather than at a number someone chose."

[[dim]]
sym = "X_SOLE_ROOT_ROW"
expr = "T_DOUBLER / 2"
note = "6.095 - the X sole plate's single root row, centred in the doubler's thickness. ⚠ IT IS THE SAME 6.095 SHEET 5 PUTS ITS *OTHER* ROW AT, and the coincidence is worth naming so nobody reads one as the other: on Y, 6.095 is centred in the END PLATE and 18.285 is centred in the doubler behind it. Here there is no end plate, the doubler is the first thing at the root, and 6.095 is the doubler's own mid-thickness."

[[dim]]
sym = "X_NUT_BOLT_NEAR"
expr = "X_SCREW_AXIS - (NUT_PATTERN_X / 2)"
note = "40 - the inboard of the two nut rows on the X sole plate."

[[dim]]
sym = "X_NUT_BOLT_FAR"
expr = "X_SCREW_AXIS + (NUT_PATTERN_X / 2)"
note = "80 - the outboard nut row. 🔴 THESE TWO BOLT INTO THE NUT'S OWN THREADS, so unlike the root row a ø5.5 clearance hole does not rescue a wrong position - the nut has no float at all."

[[dim]]
sym = "X_DOUBLER_BOLT_XC"
expr = "X_DOUBLER_BOTTOM + DOUBLER_BOLT_X"
note = "186 - the X doubler's bolt column where it lands ON THE X CARRIAGE PLATE, measured from that plate's bottom edge, which is Sheet 3a's X 0. It is the doubler's own DOUBLER_BOLT_X of 25 carried up to where the block sits. 🔴 SHEET 3a HAS TO GAIN FOUR HOLES FOR IT - the carriage plate exists, dyed and undrilled, and nothing in its schedule put a doubler on it until 2026-10-09. The Y side has the same column at the same 25 within the block, which is why DOUBLER_BOLT_X is shared rather than duplicated."

[[dim]]
sym = "X_NUT_FACE_Z"
expr = "X_BEAM_TOP_XC + T_INTERPOSER + CASTING_AXIS_ABOVE_FOOT + NUT_AXIS_TO_FACE"
note = "206 - the X ball nut\u2019s mounting face, above the bottom of the X carriage plate. The chain is the beam top, the interposer the casting sits on, the casting\u2019s own axis height, then the nut\u2019s h. \u2705 EVERY TERM COMES FROM A PART OR A PAGE: 151 from Sheet 3a\u2019s own block rows, 10 the interposer he bought, 25 measured off the casting, 20 the DSG1605 page. \u26a0 IT WAS 222 UNTIL 2026-10-10, on an X_BEAM_TOP_XC of 167 that could never have been measured. On X the face points UP because the screw runs on top of the beam - the mirror of Y, where the nut hangs and its face points down."

[[dim]]
sym = "X_DOUBLER_BOTTOM"
expr = "X_NUT_FACE_Z - DOUBLER_H"
note = "161 - where the X doubler\u2019s BOTTOM edge sits on the back of the X carriage plate. Its TOP edge is X_NUT_FACE_Z, carrying four M5 tapped into that top edge for the X nut sole plate, the way Sheet 2d\u2019s R1-R4 tap into that block\u2019s end face. \U0001f534 THE BOTTOM EDGE IS WHAT GETS DIMENSIONED AND THE TOP IS WHERE THE WORK IS - read them the wrong way round and the part sits DOUBLER_H low with the sole plate missing the nut entirely. \u2705 His reason for putting the sole plate on top: the bolts then come from ABOVE, where they stay reachable during assembly. The same instinct that inverted the Y nut."

[[dim]]
sym = "NUT_SFU_PATTERN"
value = 38
provenance = "vendor"
note = "\u00f838 - the bolt circle of the SIX M5 that hold the DSG housing to the SFU ball nut\u2019s own flange. \U0001f534 IT IS INTERNAL TO THE SCREW ASSEMBLY AND NOTHING ON THIS MACHINE BOLTS TO IT. The symbol exists only so the next person does not re-open the question that cost a round trip on 2026-10-09: the DSG1605 page shows 6-Y on this \u00f838 in its middle view AND a four-hole P 40 by C2 24 pattern on the flat in its left view, and the two look contradictory until you see they are different joints. The machine interface is the four - NUT_PATTERN_X and NUT_PATTERN_Y."
source = "Vevor DSG1605 page, printed manual with the ball screw kit"

[[dim]]
sym = "NUT_INSET_X"
expr = "(NUT_FACE_X - NUT_PATTERN_X) / 2"
note = "Closes exactly at 6, which is how the centred pattern was confirmed"

[[dim]]
sym = "NUT_INSET_Y"
expr = "(NUT_FACE_Y - NUT_PATTERN_Y) / 2"
note = "Closes exactly at 8. A 7 was given first and corrected. \u2705 Still 8 after NUT_PATTERN_Y was challenged with a 22 on 2026-10-10 and held at 24 - a 22 would have made this 9 and moved every hole that bolts into the nut."

[[dim]]
sym = "NUT_BOLT_X_NEAR"
expr = "SCREW_AXIS_X - (NUT_PATTERN_X / 2)"
note = "Inboard M5 column, from the end plate's inner face"

[[dim]]
sym = "NUT_BOLT_X_FAR"
expr = "SCREW_AXIS_X + (NUT_PATTERN_X / 2)"
note = "Outboard M5 column"

[[dim]]
sym = "SOLE_REACH"
expr = "(SCREW_AXIS_X + (NUT_FACE_X / 2)) - (T_X_ENDPLATE + T_DOUBLER)"
note = "Free span of the sole bracket, doubler's outer face to the nut face's outboard edge"

[[dim]]
sym = "NUT_AIR_MIN"
value = 20
provenance = "part"
note = "REQUIRED minimum clear air between the doubler's outer face and the ball nut's side. His number, 2026-10-03, off the Y beam build."

[[dim]]
sym = "NUT_AIR_CLEAR"
expr = "(SCREW_AXIS_X - (NUT_FACE_X / 2)) - (T_X_ENDPLATE + T_DOUBLER)"
note = "Actual clear air, doubler's outer face to the nut's near edge. Comes out 21.81, so it clears NUT_AIR_MIN by 1.81. If this ever drops below NUT_AIR_MIN the stack has moved."

[[dim]]
sym = "SOLE_BRACKET_L"
expr = "SCREW_AXIS_X + (NUT_FACE_X / 2)"
note = "Sole bracket root to tip, from the plate's INNER face - the root covers the stacked plate and doubler end faces, so the 24.38 seating is INSIDE this length, not added to it. Comes out 98.19, flush with the nut's outboard edge. A 107.4 drawn 2026-10-02 added the seating twice."

[[dim]]
sym = "ROOT_BOLT_X_ENDPLATE"
expr = "T_X_ENDPLATE / 2"
note = "Sole bracket's R5-R8 row, from the plate's INNER face. Centred in the end plate's own thickness - FORCED, not chosen: a row off its plate's mid-thickness breaks out of it. Spotted at home through the bracket, so this is for drawing it, not for setting a mill."

[[dim]]
sym = "ROOT_BOLT_X_DOUBLER"
expr = "T_X_ENDPLATE + (T_DOUBLER / 2)"
note = "Sole bracket's R1-R4 row, from the plate's INNER face. Centred in the doubler's own thickness, same reasoning as ROOT_BOLT_X_ENDPLATE. These are the only edge holes that need the mill - Sheet 2 carries them as B1-B4."

[[dim]]
sym = "ROOT_BOLT_Y_FIRST"
value = 32
provenance = "derived"
note = "First of four Y stations across the 154 root, settled 2026-10-03. D1-D4, R1-R4 and R5-R8 all sit on the same stations, so one spread serves the doubler bolts and both sole-bracket rows."

[[dim]]
sym = "ROOT_BOLT_Y_PITCH"
value = 30
provenance = "derived"
note = "Pitch of those four stations: 32, 62, 92, 122. Leaves 32 of edge at each end of the 154."

[[dim]]
sym = "THRUST_ARM"
expr = "SCREW_AXIS_X - T_X_ENDPLATE"
note = "Drive thrust outboard of the plate's OUTER face. This is what the doubler and the two bolt rows are for."

[[dim]]
sym = "DOUBLER_SEATING"
expr = "T_X_ENDPLATE + T_DOUBLER"
note = "Seating width at the plate's bottom with the doubler on"

[[dim]]
sym = "DOUBLER_H"
value = 45
provenance = "derived"
note = "Doubler height. 45, so it can come out of OFFCUTS - his reason, and the only one it needs: nothing requires a particular height here. THE CONSTRAINT IS AN UPPER BOUND, NOT A FIT: the doubler shares a face with the LOWER Y BEARING BLOCK ROW, whose bottom edge lands at 55.5 (the lower rail at 77.5 less half the block's measured 44), so anything under that clears. 45 clears by 10.5; the earlier 50 cleared by 5.5; 60 overlapped by 4.5 and is what the bound was found for. NOT gated on the Y beam underside - the doubler sits ~17 inboard of the beam's inside face. An earlier note rounded the 55.5 to 56 and the clearance to 6; the 55.5 is the computed figure and is the one to use. dims.py deps: nothing derives from this, so changing it is local - but see DOUBLER_BOLT_X, which STOPPED being the midpoint when this moved."

# ---------------------------------------------------------------- the front fin

[[dim]]
sym = "FIN_STOCK"
expr = "PLATE_H"
note = "Each front fin's stock height, 301.625 - PLATE_H, because the fin stands as high as the other four plates and is dimensioned off the same bottom edge. It is 11 7/8in, his piece 2026-10-07; it had been carried as a measured 302 and it is not 302, nor the nominal 12in it was already corrected away from once. \u26a0 THE NAME SAYS SQUARE AND IT IS NO LONGER ONE: both fins came out of a SINGLE 301.625 square on one diagonal cut until 2026-10-08, when he put each fin on its OWN piece of 10 mm plate. That is what released FIN_TOP_W back to a chosen 100 and retired FIN_KERF - top plus base plus kerf no longer has to close on anything. Kept under this name because every sheet and both documents refer to it."

[[dim]]
sym = "FIN_KERF"
value = 2
provenance = "nominal"
note = "\U0001f534 RETIRED 2026-10-08 AND NOTHING DERIVES FROM IT. It was the bandsaw kerf of the single diagonal cut that nested both fins out of one 301.625 square. He put each fin on its own piece of plate instead, so there is no cut to allow for and FIN_TOP_W stopped being forced by it. Kept rather than deleted because it is the reason FIN_TOP_W reads 100 again rather than 99.625, and a bare deletion would leave that reversal with no record."

[[dim]]
sym = "FIN_BASE_W"
value = 200
provenance = "part"
note = "THE BASE IS THE REFERENCE, his call 2026-10-07 - so it is a fixed 200 and the top absorbs whatever the square leaves. The base is the end that bolts down and bears, which is why it gets to be the round number. It was the other way round until the square turned out to be 301.625 rather than 302, and then the shortfall was landing on the bearing end."

[[dim]]
sym = "FIN_TOP_W"
value = 100
provenance = "part"
note = "100, his choice, and it is CHOSEN AGAIN rather than derived - 2026-10-08. It was forced to 99.625 for as long as both fins nested out of one 301.625 square, because top plus base plus kerf had to close on the square or the two halves did not fit. Each fin is its own piece of plate now, so nothing couples the top width to the base width and the round number comes back. FIN_BASE_W stays the reference end at 200 for the reason it always was: it is the end that bolts down and bears."

[[dim]]
sym = "FIN_COL_OUTB"
value = 35
provenance = "derived"
note = "Outboard M8 column from the fin's outboard factory edge. CORRECTED from 20 - the 1.8 mm proud figure was computed off that dead value."

[[dim]]
sym = "FIN_COL_INB"
expr = "FIN_COL_OUTB + (EXT_W / 2)"
note = "Inboard M8 column. 65."

[[dim]]
sym = "FIN_OVERHANG"
expr = "FIN_COL_OUTB - EXT_BORE_INSET"
note = "Fin overhanging the Y beam's outboard face"

[[dim]]
sym = "FIN_PROUD"
expr = "FIN_OVERHANG - T_SIDE_PLATE"
note = "Fin proud of the side plate's outer face. WAS RECORDED AS 1.8 off the dead FIN_COL_OUTB of 20. The side TONGUE must terminate short of the riser's station - it would otherwise be held out by this 16.825 rather than seating on the side plate. The word 'curb' is retired as of 2026-10-04: it implied a face the plate drops in against, and there is no channel - the plate stands on the top skin and the tongue laps it from outboard."

[[dim]]
sym = "WINDOW_W"
value = 60.5
provenance = "derived"
note = "Clearance window for the cast stepper frame, in each front fin. 60.5 OVER A 60 CASTING - half a millimetre total, a slip fit and deliberately little, because the window's loose axis is its HEIGHT, not its width. Corrected from 62 on 2026-10-03 by tools/audit-prose.py: nine places in the prose said 60.5 and gave the reasoning, the registry said 62 with a one-line note and no source, and nothing had ever compared them."
source = "machine/lateral-stiffness.md; machine/y-beam-support.md"

[[dim]]
sym = "WINDOW_H"
value = 50
provenance = "derived"
note = "Window height. This is the loose axis - it is what the casting's clearance actually consumes - which is why the width is allowed to be a 0.5 slip fit."

[[dim]]
sym = "WINDOW_OUTB"
value = 19
provenance = "measured"
note = "Window's outboard edge from the fin's factory edge. Measured off the MDF template; the fear had been 7."

# ---------------------------------------------------------------- Z carriage

[[dim]]
sym = "SPACER_SKIM"
value = 1.0
provenance = "derived"
note = "1.0, THE AMOUNT ACTUALLY CUT - and it is deliberately LESS than the 1.3 step it is closing. 🔴 THE SKIM HAS TWO JOBS AND ONLY ONE OF THEM NEEDS A SKIM. Facing both spacers IN ONE SETUP is the only way to make the pair coplanar and flat, and that is what this cut is for. Closing the gap to the ball nut is the other job, and a shim does it better - see NUT_SHIM. It used to be 1.0 described as the whole step, which made a one-shot cut on the mill trip carry a number measured to about two tenths."

[[dim]]
sym = "SPACER_T"
value = 15.2
provenance = "OPEN"
note = "🔴 THE ONLY SPACER THICKNESS THIS FILE CARRIES, and it is the thickness AFTER FACING - his call 2026-10-08. The two as-found symbols are gone: both bars are faced in one setup, so the starting thickness feeds nothing and recording it only invited the wrong number to be used. ⚠ 15.2 IS A PLACEHOLDER so the arithmetic resolves - it is the previous bar's micrometer reading less the skim, and the new 160 x 50 stock is a different bar. MIC THE FACED PAIR AND PUT THAT NUMBER HERE, with provenance measured. It feeds Z_BOLT_ENGAGE, which is bounded at both ends by the block's 8 mm tapped depth, and SPINDLE_OFFSET - so both are provisional until it is real. This part has been wrong twice already, once as a fraction (5/8in, 15.875) and once by instrument (16.41 on calipers against 16.22 on a micrometer), which is why it is not being guessed a third time."

[[dim]]
sym = "T_Z_PLATE"
value = 12.7
provenance = "nominal"
note = "1/2in 6061. CALIPER IT - the X end plate's half-inch stock measured 12.19, so a nominal 12.7 is not safe on this machine. Whether this plate is the same stock is unestablished."

[[dim]]
sym = "CLAMP_BORE_OFFSET"
value = 50
provenance = "vendor"
note = "Clamp mounting face to the 80 bore centre - half of the clamp's 100"

[[dim]]
sym = "SPINDLE_OFFSET"
expr = "RAIL_STACK + SPACER_T + T_Z_PLATE + CLAMP_BORE_OFFSET"
note = "X carriage plate face to the spindle centreline. Was recorded as 109 before the skim."

[[dim]]
sym = "T_X_CARRIAGE_PLATE"
value = 12.7
provenance = "nominal"
note = "1/2in 6061. CALIPER IT - same reason as T_Z_PLATE: the end plate's half-inch stock came in at 12.19."

[[dim]]
sym = "GANTRY_ARM"
expr = "SPINDLE_OFFSET + RAIL_STACK + T_X_CARRIAGE_PLATE + 35"
note = "X beam NEUTRAL AXIS to the spindle centreline - the arm for gantry bending. The 35 is the beam face to neutral axis, recorded in the prose as approximate."

