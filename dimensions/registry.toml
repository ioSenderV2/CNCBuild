provenance = "derived"
note = "1.0, THE AMOUNT ACTUALLY CUT - and it is deliberately LESS than the 1.3 step it is closing. 🔴 THE SKIM HAS TWO JOBS AND ONLY ONE OF THEM NEEDS A SKIM. Facing both spacers IN ONE SETUP is the only way to make the pair coplanar and flat, and that is what this cut is for. Closing the gap to the ball nut is the other job, and a shim does it better - see NUT_SHIM. It used to be 1.0 described as the whole step, which made a one-shot cut on the mill trip carry a number measured to about two tenths."

[[dim]]
