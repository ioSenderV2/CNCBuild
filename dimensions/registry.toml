value = 116
provenance = "measured"
note = "Across the clamp from CLAMP_STEP_OUT upward, the shoulders included - his calipers, 2026-10-10, against a first reading of 115. \u2705 THE SECOND READING IS THE TIDIER NUMBER FOR A REASON: at 116 each shoulder is exactly 18 wide beside the 80 middle, where 115 gave 17.5."

[[dim]]
sym = "CLAMP_STEP_OUT"
value = 25.4
provenance = "measured"
note = "1in out from the Z plate's face, where the clamp narrows from CLAMP_W to CLAMP_SHOULDER_W - his calipers, 2026-10-10. It is well below the slit at CLAMP_GAP_START, so the step is in solid metal and has nothing to do with the jaw."

[[dim]]
sym = "CLAMP_MID_W"
value = 80
provenance = "part"
note = "Across the raised middle section, which is also the gap between the two shoulders. With CLAMP_SHOULDER_W it makes each shoulder CLAMP_SHOULDER_EACH wide."

[[dim]]
sym = "CLAMP_SHOULDER_EACH"
expr = "(CLAMP_SHOULDER_W - CLAMP_MID_W) / 2"
note = "17.5 of shoulder each side of the middle. \u26a0 THE BOLT IS NOT CENTRED IN IT - the pattern is CLAMP_BOLT_PITCH_W, 100, centred on the clamp, which puts each bolt 50 out where the shoulder's own centre is 48.75. Eyeballing the offset off the shoulder is what put the pattern 2.5 wrong; the rounded edges make it hard to read off the part at all."

[[dim]]
sym = "CLAMP_TOP_W"
value = 38.1
provenance = "part"
note = "1.5in across the FACE at the clamp's tallest point. From there each side falls away to the shoulder - he calls it 45 degrees, and the model draws it landing on CLAMP_MID_W at CLAMP_SHOULDER_OUT, which comes out at 42.3 rather than 45. \u26a0 THE TWO WIDTHS ARE KEPT AND THE ANGLE IS NOT: 19.05 plus a true 45 over the 23 of drop would land at 84.1 across, 4 wider than the 80 gap between the shoulders he also gave. Nothing is built to this - it is a bought clamp - so the slope is drawn to the dimensions that can be measured."

[[dim]]
sym = "CLAMP_MID_OUT"
value = 103
provenance = "part"
note = "How far the middle section stands OUT from the Z plate's face - the clamp's highest point. It covers the barrel: CLAMP_BORE_OFFSET puts the bore centre 50 out and the \u00f880 barrel's front face at 90, so 13 of metal stands beyond it."

[[dim]]
sym = "CLAMP_SHOULDER_OUT"
value = 80
provenance = "part"
note = "How far the shoulders stand out from the Z plate's face. It is the length of bolt buried in the clamp, and with BOLT_SPINDLE_CLAMP it is what leaves CLAMP_BOLT_ENGAGE in the plate."

[[dim]]
sym = "CLAMP_GAP_START"
value = 55
provenance = "part"
note = "Where the clamping gap starts, measured OUT from the Z plate's face - his, 2026-10-10. It splits the clamp into a piece against the plate and a piece carrying the shoulders, and the four M8 cross it: tightening them pulls the outer piece down and closes the gap on the barrel."

[[dim]]
sym = "CLAMP_GAP_W"
value = 2
provenance = "part"
note = "The gap, open, with the bolts slack. It is what the bolts take up, so it is also the travel available to grip the barrel - the clamp is not bottomed out when it is tight."

[[dim]]
sym = "CLAMP_BOLT_PITCH_W"
value = 100
provenance = "part"
note = "Across between the two bolt columns, centred on the clamp - Sheet 4's M1-M8 at Y 32 and 132 on the 164 plate. \u2705 CHALLENGED AND HELD 2026-10-10: reading the bolts as centred in the 17.5 shoulders gives 97.5, and the sheet's 100 is the one. The shoulder reading was taken off rounded edges."

[[dim]]
sym = "CLAMP_BOLT_PITCH_AXIAL"
value = 25
provenance = "part"
note = "Between the two bolts in one shoulder, along the spindle axis - Sheet 4's M1-M8 pairs at X 17/42 and 133/158."

[[dim]]
sym = "CLAMP_BOLT_EDGE"
expr = "(CLAMP_AXIAL - CLAMP_BOLT_PITCH_AXIAL) / 2"
note = "15 in from each end of the clamp's 55. DERIVED AND NOT MEASURED, his 2026-10-10, for the reason the part cannot be read: the edges are rounded, so an offset taken from them is a guess. 55 less 25 leaves 30 to share. A direct reading of 14 is what it replaces."

[[dim]]
sym = "BOLT_SPINDLE_CLAMP"
value = 90
provenance = "part"
note = "M8 x 90 socket head cap, four to a clamp, eight in all. It crosses CLAMP_SHOULDER_OUT of clamp and threads CLAMP_BOLT_ENGAGE into the Z plate, which Sheet 4 taps M8 x 1.25."

[[dim]]
sym = "CLAMP_BOLT_ENGAGE"
expr = "BOLT_SPINDLE_CLAMP - CLAMP_SHOULDER_OUT"
note = "10 mm of thread in the Z plate, out of its T_Z_PLATE. His figure and the model's agree by construction - if the clamp or the bolt ever changes, this moves instead of staying a stale 10."

[[dim]]
sym = "M8_HEAD_D"
value = 13
provenance = "nominal"
note = "\u00f813, a socket head cap M8 across the head. \u26a0 CATALOGUE AND NOT HIS - the standard ISO 4762 figure, carried so the model can draw the clamp bolts. Caliper one before anything is cut to it. It is NOT FLANGE_HEAD_D, which is the flanged button head used on the beams."

[[dim]]
sym = "M8_HEAD_H"
value = 8
provenance = "nominal"
note = "Socket head cap M8 head height, the same catalogue source and the same caveat as M8_HEAD_D."

[[dim]]
sym = "CLAMP_PAIR_SPAN"
expr = "CLAMP_CENTRES + CLAMP_AXIAL"
note = "Fits inside SPINDLE_BODY_L, which closed at 213 on 2026-10-03. It used to be written as fitting on either the 199 or the 213 reading, because the body length was disputed; it is not any more."

# ---------------------------------------------------------------- the shelf
#
#  THE CAUTIONARY TALE OF THIS REGISTRY. These four holes were dimensioned from the
#  BEAM FRONT. The beam moved back to flush on 2026-10-02, and the rear horizontal -
#  "60 from the beam front" - silently became Y 0, off the edge of the plate. Nothing
#  linked the hole to the face it was measured from. They are keyed to the plate's own
#  back edge now, and SHELF_* depends on nothing that can move.

[[dim]]
sym = "SHELF_BAR_W"
value = 25.4
provenance = "nominal"
note = "1in, across the bar"

[[dim]]
sym = "SHELF_BAR_H"
value = 50.8
provenance = "derived"
note = "2in. Was 1in. The height exists to separate the two horizontal bolts in Z."

[[dim]]
sym = "SHELF_BAR_L"
expr = "EXT_W"
note = "60 - exactly the beam's footprint. Was 76.2 (3in), which reached back under the back joining plate; with the beam flush there is nothing back there, and the overhang carried the only route by which a proud joining plate could become the gantry's bearing point."

[[dim]]
sym = "SHELF_VERT_REAR"
value = 15
provenance = "part"
note = "Vertical M8 into the extrusion's underside slot, Y from the PLATE'S BACK EDGE. Pinned by the 30-6060 slot centrelines."

[[dim]]
sym = "SHELF_VERT_FRONT"
value = 45
provenance = "part"
note = "The second underside slot"

[[dim]]
sym = "SHELF_HORIZ_Y"
expr = "(SHELF_VERT_REAR + SHELF_VERT_FRONT) / 2"
note = "BOTH horizontal bolts. The only free Y station - two M8 need ~12 between centres and the verticals occupy 15 and 45, leaving Y 27-33."

[[dim]]
sym = "SHELF_HORIZ_Z_LOW"
value = 15
provenance = "derived"
note = "Z from the bar's underside. BLIND-TAPPED: through-drilling would break out where the lower Y bearing block sits."

[[dim]]
sym = "SHELF_HORIZ_Z_HIGH"
value = 35
provenance = "derived"
note = "15.8 to the bar's top"

[[dim]]
sym = "SHELF_Z_COUPLE"
expr = "SHELF_HORIZ_Z_HIGH - SHELF_HORIZ_Z_LOW"
note = "The lever resisting the bar's nose-down pitch about X. This is what the 2in bar buys."

[[dim]]
sym = "SHELF_BAR_TOP"
value = -60
provenance = "derived"
note = "Z from the Y beam top - the underside of the X beam's bottom extrusion"

[[dim]]
sym = "SHELF_BAR_BOTTOM"
expr = "SHELF_BAR_TOP - SHELF_BAR_H"

[[dim]]
sym = "SHELF_BOLT_LOW_Z"
expr = "SHELF_BAR_BOTTOM + SHELF_HORIZ_Z_LOW"
note = "Machine Z of the lower bolt. Near the lower bearing block row - hence the blind tap."

[[dim]]
sym = "SHELF_SHIM_W"
expr = "SHELF_BAR_W"
note = "The 1in shim strip on hand is exactly the bar's width, so a strip cut to SHELF_BAR_L is a full-face shim. Slot it open at Y 15 and Y 45 to clear the vertical M8."

[[dim]]
sym = "BEAM_BOLT_CLEARANCE"
value = 9
provenance = "derived"
note = "9 mm clearance on M8 where a plate meets extrusion - the repo's deliberate figure, the joint working by friction"

[[dim]]
sym = "ROLL_RANGE"
expr = "(BEAM_BOLT_CLEARANCE - 8) / 2"
note = "Vertical float of the beam in its own bolt holes, and therefore the CEILING on shim-based roll - about 0.5. Caps the adjustment; the shim stack does not."

[[dim]]
sym = "BEAM_LEN"
value = 1000
provenance = "part"
note = "Span between the two shelves, so the lever the roll shim works over"

[[dim]]
sym = "ROLL_RANGE_PER_100"
expr = "ROLL_RANGE / BEAM_LEN * 100"
note = "Correctable tram error at a 100 mm circle. A 0.03 shim, the finest on hand, is worth 0.003 at the same circle."


# ------------------------------------------------------------- the 1210.73 rear plate

[[dim]]
sym = "Y_BEAM_GAP"
expr = "BEAM_LEN + (2 * (RAIL_STACK + T_X_ENDPLATE))"
note = "Y beam INBOARD face to inboard face - the gap the X gantry spans. His chain, 2026-10-03: the X beam plus, each side, an end plate and a rail-and-block stack, which lands on the Y extrusion's inner face. Same 1084.38 that lateral-stiffness.md's length table already carried."

[[dim]]
sym = "Y_BEAM_ASSY_W"
expr = "EXT_W + T_SIDE_PLATE"
note = "One Y beam as assembled, across the machine: the extrusion plus its outboard side plate. His number, 2026-10-03 - he gave it as 60 + 1/8in."

[[dim]]
sym = "REAR_PLATE_L_ORDERED"
value = 1210.47
provenance = "part"
note = "1210.47, the length the back plate was actually BOUGHT at - 47 21/32in, sheared, one piece, and \u2705 SINCE 2026-10-10 IT IS THE ONLY LENGTH THE PLATE HAS. Nothing is derived from it and it derives nothing: the plate is placed by its left edge on the Y1 extrusion's outboard face and its far end falls where this puts it. It was ordered to the nearest 1/32in under the flush envelope as REAR_PLATE_L then stood (1210.73 at a 1/8in side plate), which cost 0.26. The side plate then turned out to be 10 gauge rather than 1/8in, the envelope grew 0.508, and the shortfall is now 0.77. See REAR_PLATE_L."
source = "Specialty Metals Corp sales order W053768, 2026-10-08"

[[dim]]
sym = "MACHINE_OUTER_W"
expr = "Y_BEAM_GAP + 2 * Y_BEAM_ASSY_W"
note = "1211.238 - the machine across its OUTER FACES, side plate to side plate. \U0001f534 IT WAS CALLED REAR_PLATE_L AND THAT NAME IS RETIRED - his, 2026-10-10. It was never the rear plate once the plate was bought: it is the flush ENVELOPE, and the delivered piece is REAR_PLATE_L_ORDERED at 1210.47, 0.77 short of it. Carrying the envelope under the plate's name is what let Sheet 7 hang the Y2 beam station off a sheared edge. The plate is now placed by its LEFT EDGE on the Y1 extrusion's outboard face and its length feeds nothing. \u2705 WHAT THE NUMBER STILL MEANS: it is the width BOX_W takes, and it is the ceiling lateral-stiffness.md names - past the outboard plates' outer faces the rear plate becomes the proud member at the corner, the one direction the side tongue's face bearing cannot take. The delivered plate sits inside that, so the ceiling is no longer in play."
[[dim]]
sym = "Y1_EXT_FACE_X"
expr = "T_SIDE_PLATE"
note = "Y1 extrusion's outboard face in the MACHINE frame, whose X 0 is the side plates' outer face. \U0001f534 IT IS NO LONGER SHEET 7'S X 0. Sheet 7's X 0 is the plate's LEFT EDGE, and that edge is set flush with the Y1 extrusion's OUTBOARD FACE - his call, 2026-10-10, and the side plate is NOT in it. The side plate therefore stands proud of the plate's end by its own thickness, and the plate's far end falls wherever the delivered length puts it. So Sheet 7's X is the machine X less this, and every RP_A_COL and RP_F_COL below is a SHEET coordinate - make-3d adds this term back to place them."

[[dim]]
sym = "Y2_EXT_FACE_X"
expr = "Y_BEAM_GAP + 2 * EXT_W"
note = "1204.38 - Y2 extrusion's outboard face in SHEET 7 coordinates, measured from Y1's outboard face. \U0001f534 IT USED TO READ REAR_PLATE_L LESS A SIDE PLATE and it must not go back to that: the plate's length is what it was bought at, and hanging the Y2 station off it put the whole beam spacing at the mercy of a sheared edge. It is the beams that set this - the gap the gantry spans plus one extrusion at each end. \u26a0 THE Y2-END HOLES THAT FOLLOW ARE PROVISIONAL: measure the built beam spacing before drilling that end, which is his call, 2026-10-10. The delivered plate reaches 1210.47 from the same edge, so there is about 6 past this face to play with."

[[dim]]
sym = "BEAM_SPAN"
expr = "Y2_EXT_FACE_X - Y1_EXT_FACE_X"
note = "Y1's outboard EXTRUSION face to Y2's, 1204.38 - the figure lateral-stiffness.md's table calls outboard face to outboard face. It was 1200 until 2026-10-03, when his stackup replaced the round number; the plate is 6.35 longer than this because it also covers the two side plates."

[[dim]]
sym = "BF12_BASE_TO_ROW1"
value = 7
provenance = "part"
note = "7, the BF12 casting's own offset from its base face to the first mounting hole. His, 2026-10-08. BF12 IS MOUNTED UPSIDE DOWN on the rear plate's inside face, so the base face is the upper surface of the installed part and this 7 runs DOWNWARD from it."

[[dim]]
sym = "BF12_ROW1_BARE"
value = 127
provenance = "derived"
note = "🔴 SUPERSEDED 2026-10-08 AND NOTHING DERIVES FROM IT. It was the first BF12 row measured DOWN from the plate's installed TOP edge - his number 2026-10-03, given when the plate was a nominal 304.8. Kept rather than deleted because the prose quotes it and because it records the shape of the mistake: a ball screw's mounting height referenced to a bought plate edge, which moved 3.175 the moment the plate was ordered at 11 7/8. BF12_ROW1_Y now runs on Y_BEAM_UNDERSIDE - T_INTERPOSER - BF12_BASE_TO_ROW1 instead. For the record the two land within 0.475 of each other, which is why the error survived three readings."

[[dim]]
sym = "BF12_ROW_PITCH"
value = 18
provenance = "part"
note = "BF12 face-mount row spacing. Columns are 7 and 53 - the same columns measured on the cast stepper frame, see open-items.md."

[[dim]]
sym = "BF12_ROW1_Y"
expr = "Y_BEAM_UNDERSIDE - T_INTERPOSER - BF12_BASE_TO_ROW1"
note = "165, and 🔴 IT IS BEAM-REFERENCED NOW rather than converted from a plate edge - his chain, 2026-10-08, and it closes the open item that two earlier commits could not. BF12 sits upside down with its base face LEVEL WITH THE UNDERSIDE OF THE INTERPOSER PLATE, because at the far end of the beam the stepper frame / BK12 casting hangs below that same interposer, and the interposer bolts to the Y beam's underside. So the screw's two ends are set by one surface and the row is Y_BEAM_UNDERSIDE less the interposer less the casting's own 7. ⚠ It used to read REAR_PLATE_W - BF12_ROW1_BARE - T_INTERPOSER, which hung the ball screw's far end off a BOUGHT plate edge: the plate going 304.8 to 301.625 moved it 3.175 while the near end on the cast frame did not move, and over a 1000 mm screw that is parallelism. Nothing about the delivered plate can move it now."

[[dim]]
sym = "BF12_ROW2_Y"
expr = "BF12_ROW1_Y - BF12_ROW_PITCH"
note = "147, the second BF12 row, same four columns. It SUBTRACTS the pitch: Sheet 7 reads from the plate's bottom edge, so the second row is the lower of the two and therefore the smaller Y."

[[dim]]
sym = "XBOX_PITCH"
value = 150
provenance = "derived"
note = "Torsion-box bolt pitch along the rear plate, settled 2026-10-03. The side plates use 100 over 1000 - different plates, both correct."

[[dim]]
sym = "XBOX_X_FIRST"
value = 50
provenance = "part"
note = "50 - first of eight torsion-box bolts, then XBOX_PITCH. Stations: 50, 200, 350, 500, 650, 800, 950, 1100. \U0001f534 IT IS NOT CENTRED ON THE PLATE AND MUST NOT GO BACK TO BEING - his, 2026-10-10. It used to read (REAR_PLATE_L less seven pitches) / 2, which put the first at 80.365 and tied all eight to a sheared plate edge and to an envelope figure that is not the delivered plate. \u2705 IT MATCHES THE OTHER BOLT-ON PLATES: footnote 8.3 already has 50 then 150 on all three, and this plate now does the same. The eight span 50 to 1100, leaving about 110 to the far end. Note 7.8 is why the exact stations cost nothing anyway - these are drill-guide holes with no mating pattern to miss."
source = "his, 2026-10-10"

# ---------------------------------------------------------------- the BF12 tongue, Sheet 2b

[[dim]]
sym = "XEP_STOCK_L"
value = 300
provenance = "measured"
note = "The 1/2in plate stock for the X end plates: 200 x 300, his. THE LENGTH THE RIGHT-HAND PLATE ENDS AT, because its far end is not cut - see TONGUE_TOP. \U0001f534 WAS RECORDED AS 304.5 AND THAT WAS WRONG: a 304.5 x 154 piece was written down as the stock, the tongue was built on it, and the real stock is 200 x 300. Every number on Sheet 2b past X 242.5 moved when it was corrected. It is the repo's own README warning twice over - a stock dimension taken from the conversation rather than from the part, and then derived from."

[[dim]]
sym = "XEP_STOCK_W"
value = 200
provenance = "measured"
note = "Width of the same stock. The plate is XEP_W (154) wide, so cutting one out leaves a 45 strip - and THAT is where DOUBLER_H's 45 comes from. The doubler is the offcut, which is the whole reason it is 45 rather than the 50 it used to be."

[[dim]]
sym = "TONGUE_TOP"
expr = "XEP_STOCK_L"
note = "Far end of the RIGHT-HAND plate - the stock's own end, uncut, so it is XEP_STOCK_L and not a chosen length. His reason was 'one less cut': leave the far end alone and let the corner cut make the tongue. The left-hand plate still stops at XEP_H, which is the single thing making the pair non-interchangeable."


[[dim]]
sym = "TONGUE_H"
expr = "TONGUE_TOP - XEP_CUT"
note = "BF12 tongue length past the 2a outline - 65, DERIVED from the stock rather than chosen, and it only has to beat TONGUE_MIN. It has been 40, then 50, then briefly 61.975 on a stock length that turned out to be wrong, then 57.475, and it is now whatever XEP_STOCK_L leaves above XEP_CUT. \u2705 IT IS A ROUND 65 AND THAT IS NOT A ROUNDING: 300 less 235, both exact. The old warning here said never to print a round number for it, because '60 x 60' had once been printed while the real figure was 61.975 - that warning was about a rounded figure, not about this one. The sheet dimensions the stock length and the corner cut; the tongue has no cut-to length of its own. THE BF12 ROWS NEVER MOVED FOR ANY OF IT - their X is TONGUE_BF12_ROW1/ROW2, set by the beam top plus the interposer, so this symbol follows them and never the reverse."



[[dim]]
sym = "TONGUE_BF12_ROW1_BARE"
expr = "XEP_CUT + BF12_BASE_TO_ROW1"
note = "First tongue BF12 row BEFORE the interposer: 242, which is 7 above the TOP OF THE X BEAM, matching Sheet 7's own pre-interposer offset. \u26a0 IT WAS A FLAT 249.5 AND IS AN EXPRESSION NOW, because the beam top sits at XEP_CUT up this plate and that moved to 235 on 2026-10-10 - the row has to follow the cut or the sheet and the registry drift apart again. The reference is the beam top, not the plate end - XEP_TOP_ABOVE_BEAM makes those the same point on this plate, which is easy to read as a coincidence and is not one."

[[dim]]
sym = "TONGUE_BF12_ROW1"
expr = "TONGUE_BF12_ROW1_BARE + T_INTERPOSER"
note = "THE INTERPOSER GOES UNDER THE CAST STEPPER FRAME - beam top, interposer, casting - so the frame and the screw it carries both stand 9.525 above the beam top, and these holes must be drilled where the screw ACTUALLY ends up rather than where a casting sitting straight on the beam would put it. The X stepper end has one too - there are three, Y1, Y2 and X. The X tongue is ABOVE its beam where the Y frames hang BELOW theirs, so the interposer lifts this end rather than dropping it; on each sheet's own frame that is still an addition. Same correction as BF12_ROW1_Y on Sheet 7."

[[dim]]
sym = "TONGUE_BF12_ROW2"
expr = "TONGUE_BF12_ROW1 + BF12_ROW_PITCH"
note = "Second tongue row, same two columns at Y 7 and 53."

[[dim]]
sym = "TONGUE_EDGE_MARGIN"
expr = "TONGUE_TOP - TONGUE_BF12_ROW2"
note = "Far BF12 row to the tongue's end - 30 on the 300 stock. Must stay well clear of an M5; 5.5 at the original 40 was not, which drove the tongue to 50 and then to the full piece. DERIVED, so it moves when the stock does and never sets anything."


[[dim]]
sym = "CORNER_CUT_Y"
expr = "EXT_W"
note = "Where the corner cut starts up the far end of both X end plates - 60, and it is EXT_W because that is the beam's footprint off the back edge. Below it the plate must stay full width to cover the upper extrusion's end; above it there is nothing but plate. His cut, 2026-10-04."

[[dim]]
sym = "CORNER_CUT_X_END"
value = 188
provenance = "derived"
note = "Where the corner cut lands on the plate's FRONT edge, at Y = XEP_W. The same number on BOTH plates - 2a cuts from (XEP_CUT, 60) and 2b from (XEP_STOCK_L, 60), and they meet here. ON 2B THE CUT REPLACES THE STEP rather than following it: one diagonal instead of cutting along X 242.5 and then across Y 60, which is the 'one less cut' that let the far end stay uncut. WAS 185.5 BRIEFLY, moved to 188 so the cut stops crowding the bearing block. CHECKED, computed not measured: the nearest feature is the far-upper bearing block M5 at (176, 133.5), and the perpendicular distance to the cut is 19.9 mm on 2a and 23.4 on 2b, so a ~10 mm counterbore leaves about 15 mm of material on the tighter of the two. \u2705 BOTH GREW BY ABOUT 5 ON 2026-10-10 and nothing was done to them: the block came down 7.5 with XEP_CUT while this end stayed at 188, because 188 is measured from the plate's bottom edge and the block is measured from the beam. At the block's old (183.5, 133.5) they were 14.2 and 18.6, and at a 185.5 cut end before that, 12.3 and 17.3."


[[dim]]
sym = "BF12_H"
value = 43
provenance = "part"
note = "43 - the height of BF12\u2019s CENTRE SECTION, the part that holds the bearing. \U0001F534 IT IS NOT THE HEIGHT OF THE WHOLE BLOCK and it used to be described as if it were, which is what gave the tongue a floor 13 too high. His, 2026-10-10: BF12 is a tall centre boss with a LOW WING either side, and the four mounting holes are in the wings, which are BF12_WING_H at 30. So the part that has to be backed by anything is 30 tall; the 43 boss stands above it carrying the bearing and touches nothing. See TONGUE_MIN, which now runs on the wings."

[[dim]]
sym = "TONGUE_MIN"
expr = "T_INTERPOSER + BF12_WING_H"
note = "\U0001F534 THE TONGUE\u2019S LOWER BOUND, and it came down from 53 to 40 on 2026-10-10. It used to read BF12_H + T_INTERPOSER on the reasoning that the tongue must back the WHOLE of BF12. His correction: it only has to reach both rows of mounting bolts, which is BF12_WING_H\u2019s 30 - the two low side wings the bolts actually go into - not the 43 of the centre boss, which carries the bearing and touches nothing. The block can stand proud of the tongue above its top row and nothing cares. \u2705 That takes TONGUE_CLEAR from 4 to 17, so the tongue stops being a tight constraint - and the old 53 was the number that made an 8 mm change elsewhere look like it would break this."
[[dim]]
sym = "TONGUE_CLEAR"
expr = "TONGUE_H - TONGUE_MIN"
note = "How much tongue there is past the floor BF12 needs - 25 on the 200 x 300 stock, which went from a nervous 4.95 to this when TONGUE_MIN came down to 40 and XEP_CUT to 235. THE CHECK TO RUN BEFORE SUBSTITUTING A DIFFERENT PIECE OF PLATE: any stock whose length leaves this positive will do, so the minimum usable plate is XEP_H + TONGUE_MIN, about 295. The 300 in hand clears by about 5."
# ---------------------------------------------------------------- the torsion box

[[dim]]
sym = "T_BB_SKIN_TOP"
value = 25
provenance = "nominal"
note = "25 - the TOP skin, and the thicker of the two. \u2705 HIS CALL 2026-10-11, and torsion-box.md had already named it the one place 25 earns its place: the top skin takes the riser feet, the Y plate bolt line and the five standing plates' bottom edges IN BEARING. \U0001F534 IT IS NOT FOR STIFFNESS - 25 on both skins buys +46% against +100% for 19 skins on 150 ribs, and most of that 46% is only the box getting deeper. ASYMMETRIC SKINS ARE FINE IN A TORSION BOX, which is what lets the material go where the bearing is. \u26A0 NOMINAL ON PURPOSE - torsion-box.md warns that sheet sold at a nominal commonly runs under, and that the rib notches must be cut to the measured thickness of the sheet in hand, not to this. \U0001F4CC THE UNDERSIDE OF THE TOP SKIN DOES NOT MOVE: it is set by the post ledge, the bottom skin and the cavity, so this only makes the box 6 thicker and stands the machine 6 higher off the floor. Z 0 is the top skin, so nothing above the box moves at all."

[[dim]]
sym = "T_BB_SKIN_BOT"
value = 19
provenance = "nominal"
note = "19 - the BOTTOM skin, unchanged when the top went to 25 on 2026-10-11. Nothing bears on it: it rests on the post ledges and works purely as the lower flange, where separation squared does the work rather than thickness. \u26A0 NOMINAL ON PURPOSE, same warning as T_BB_SKIN_TOP - cut the rib notches to the sheet in hand."

[[dim]]
sym = "BOX_RIB_H"
value = 100
provenance = "derived"
note = "Egg-crate rib height between the skins. His, 2026-10-03."

[[dim]]
sym = "BOX_THK"
