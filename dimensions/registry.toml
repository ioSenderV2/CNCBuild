[[dim]]
sym = "Z_STOP_OUT"
value = 45
provenance = "part"
note = "45, how far the block stands OUT from the carriage plate's front face. The two M5 run in through this, and the counterbore takes 6 of it, which is what leaves 39 of block and puts an M5 x 50 eleven millimetres into the plate."
source = "machine/drawings/shop-pack.html, Sheet 3c"

[[dim]]
sym = "Z_STOP_FACE_X"
value = 310
provenance = "derived"
note = "310, where the block's LOWER face sits up the carriage plate - and that face is the stop: it is what the Z ball nut lands on. The block runs from here up through Z_STOP_T."
source = "machine/drawings/shop-pack.html, Sheets 3a and 3c"

[[dim]]
sym = "Z_STOP_BORE_D"
value = 22
provenance = "derived"
note = "\u00f822, the bore the Z screw runs on through, on the screw centreline. \U0001f534 NOT \u00f827: a 27 bore reaches 11.5 out from the axis and an M5 clearance hole 10 from the end sits 15 off it, so a 27 would cut into the hole. At 22 the bore wall is 14 out and the \u00f86 clears it by 1.0."
source = "machine/drawings/shop-pack.html, Sheet 3c"

[[dim]]
sym = "Z_STOP_BORE_OUT"
value = 25
provenance = "derived"
note = "25, the bore axis out from the carriage plate's face. It is the middle of the 50 across, but NOT the middle of the 45 out - 25 of 45 leaves 20 beyond it, and it has to: the bore then runs 14 to 36 out from the plate, which is the span the \u00f86 clearance holes are argued against. It lands on the screw axis, which the model reaches independently through SCREW_AXIS_H, also 25."
source = "machine/drawings/shop-pack.html, Sheet 3c"

[[dim]]
sym = "Z_STOP_BOLT_INSET"
value = 10
provenance = "derived"
note = "TS1 and TS2 are 10 in from each end of the 50, so 10 and 40 across it. On the carriage plate that lands them at Y 62 and 92 either side of the screw at 77, which is how Sheet 3a has them."
source = "machine/drawings/shop-pack.html, Sheets 3a and 3c"

[[dim]]
sym = "Z_STOP_BOLT_Z"
value = 12.7
provenance = "derived"
note = "The two M5 run in halfway up the 25.4. With the stop face at Z_STOP_FACE_X that puts the tapped pair at X 322.7 on the carriage plate, which is what Sheet 3a drills."
source = "machine/drawings/shop-pack.html, Sheets 3a and 3c"

[[dim]]
sym = "Z_STOP_HOLE_D"
value = 6
provenance = "derived"
note = "\u00f86 clearance for the two M5, drilled through the 45. It leaves 1.0 of wall to the \u00f822 bore, so it gets drilled straight."
source = "machine/drawings/shop-pack.html, Sheet 3c"

[[dim]]
sym = "Z_STOP_CBORE_DEPTH"
value = 6
provenance = "derived"
note = "6 deep, counterbored from the block's outer face. It is what sets the engagement: 45 less 6 leaves 39 of block, so an M5 x 50 reaches 11 into the carriage plate."
source = "machine/drawings/shop-pack.html, Sheet 3c"

[[dim]]
sym = "BOLT_Z_STOP"
value = 50
provenance = "derived"
note = "M5 x 50, two of them, holding the stop block to the carriage plate. \u26a0 THESE AND THE BLOCK ARE SACRIFICIAL - they fire only if the soft limit and the proximity sensor have both already failed, so do not size them by strength. If one is ever used, replace the block and the bolts."
source = "machine/drawings/shop-pack.html, Sheet 3c; machine/z-carriage.md"

[[dim]]
sym = "Z_NUT_X_1"
expr = "T_BF12_BLOCK + NUT_INSET_Y"
note = "28. First of the two rows of M5 clearance holes that bolt the Z plate to its ball nut, X from the plate's INSTALLED BOTTOM. 🔴 THESE FOUR HOLES WERE MISSING FROM SHEET 4 ENTIRELY - his catch, 2026-10-08. The plate had sixteen holes to its bearing blocks and none to the nut that drives it. The chain is his: at full down travel the nut bottoms on BF12's face, BF12 is T_BF12_BLOCK thick, so the nut's 40 mm face spans 20 to 60 and the pattern's NUT_INSET_Y of 8 at each end puts the rows at 28 and 52. It self-checks - 8 + 24 + 8 = 40 closes the face, and 28 + NUT_PATTERN_Y = 52 from the other direction. ⚠ Row 1 shares X 28 with C-hole row 1; the nearest pair is 21.5 apart in Y, so they do not foul, but see them on the drawing before the mill."

[[dim]]
sym = "Z_NUT_X_2"
expr = "Z_NUT_X_1 + NUT_PATTERN_Y"
note = "52. The second nut row. NUT_PATTERN_Y is 24 and it is the pattern pitch ACROSS the nut's 40 mm face - on the Z plate that face's short axis runs up the plate, which is why the 24 is the X pitch here and the 40 is the Y span."

[[dim]]
sym = "Z_NUT_Y_1"
expr = "(Z_PLATE_W / 2) - (NUT_PATTERN_X / 2)"
note = "62.5. First nut column, the 40 mm pattern centred across the plate because the nut is centred on the screw and the screw is on the plate's centreline. Half-millimetre, and that is the price of the odd width - see Z_PLATE_W. These are 5.5 clearance on M5, so it is inside their float."

[[dim]]
sym = "Z_NUT_Y_2"
expr = "(Z_PLATE_W / 2) + (NUT_PATTERN_X / 2)"
note = "102.5. Second nut column."

# ---------------------------------------------------- consistency, settled 2026-10-03

[[dim]]
sym = "FRONT_STRIP_W"
value = 50.8
provenance = "part"
note = "The front joining strip across the seam, identical on X, Y1 and Y2, and also the magnetic tape surface. 50.8 - 2in flat bar, 6061, bought 4ft long and cut to 1000. \U0001f534 IT IS WIDER THAN THE GAP BETWEEN THE BEARING BLOCK ROWS, ON PURPOSE, AND THAT IS THE CHANGE. It used to be 45, chosen as BLOCK_ROW_GAP so the strip sat BETWEEN the block rows with about half a millimetre either side. At 50.8 it runs 2.4 UNDER each block instead, which a thin strip may do: he proved it with 60 x 60 x 4 test pieces that clear with 7.0 of overlap a side. \u2705 THE Y TOLERANCE GOES FROM ABOUT NOTHING TO ABOUT TEN MILLIMETRES - the next thing in the strip's way is the RAIL, 9.6 from the strip edge - which retires the clash this part used to be gated by. \u26a0 2in STOCK MAY ARRIVE AT 50, NOT 50.8: metric and SAE intermix unpredictably on this supplier's aluminium. It does not matter PROVIDED Sheet 8's two rows are dimensioned symmetric about the strip's own centreline, 30 apart, rather than off an edge - then a narrower strip still self-centres on the seam. Dimension it off an edge and the stock's width tolerance lands straight in the hole positions."
source = "his, 2026-10-09"

[[dim]]
sym = "BOX_TONGUE_PROUD"
value = 60
provenance = "derived"
note = "How far the box's laminated tongue stands proud of the top skin, on the back and both sides. The plates sit FLAT ON THE SKIN and the tongue laps them from OUTBOARD, so this is a simple bolted lap - there is no channel and nothing is captured. WAS 61 until 2026-10-03, changed by him for consistency, which makes the bolt line exactly central: BOX_TONGUE_BOLT_Y is 30 above the plate's bottom edge and now also 30 below the tongue's top. Named BOX_TONGUE to keep it clear of TONGUE_H and friends, which are the X end plate's BF12 tongue and a different part entirely."

[[dim]]
sym = "BOX_TONGUE_BOLT_Y"
expr = "BOX_TONGUE_PROUD / 2"
note = "The one bolt line at 30 above each plate's bottom edge - side plates and back plate into the box tongues, front fin into its L-brackets. With BOX_TONGUE_PROUD at 60 it is the tongue's mid-height rather than 31 down from a 61. The fin keeps the SAME height even though the part it bolts to changed on 2026-10-03: Sheet 1's T1 and T2 were repurposed from tongue bolts to bracket bolts and did not move, which keeps their 145 mm couple intact. See BOX_FRONT_OVERHANG."

# ------------------------------------------------ the bolt-on plates, settled 2026-10-03

[[dim]]
sym = "TSLOT_X_FIRST"
value = 50
provenance = "derived"
note = "First bolt station along the 1000 on every bolt-on plate - Sheets 8, 9 and 10. His, 2026-10-03. With TSLOT_X_PITCH it gives seven per row at 50 to 950, symmetric with 50 clear at each end. The pitch had been written down for weeks; where the first one sat never had been."

[[dim]]
sym = "TSLOT_X_PITCH"
value = 150
provenance = "derived"
note = "Bolt pitch along the 1000 on Sheets 8, 9 and 10. NOT the same number as XBOX_PITCH, which is also 150 but is the rear plate's torsion-box row on a different part - they agree by choice, not by derivation."

[[dim]]
sym = "TSLOT_X_COUNT"
expr = "((1000 - (2 * TSLOT_X_FIRST)) / TSLOT_X_PITCH) + 1"
note = "Seven per row. Written as an expr so that if the first station or the pitch is ever revisited, the count moves with it instead of being a stale 7 in the prose."

[[dim]]
sym = "SLOT_GRID"
value = 30
provenance = "part"
note = "The 30 series' module. Corner bores and T-slot centres both sit on it, which is why EXT_BORE_INSET and RAIL_SLOT_INSET are both 15 and why a 120 beam has four rows at 15 / 45 / 75 / 105."

[[dim]]
sym = "PLATE_H"
value = 301.625
provenance = "part"
note = "11 7/8in, THE ONE ORDERED HEIGHT - and his rule 2026-10-08: the two side plates, the back plate and the two front fins ALL stand this high, every hole on them is measured from the BOTTOM edge, and a part that does not measure 301.625 is misordered or mismade and goes back. 🔴 THAT MAKES IT AN ACCEPTANCE CRITERION, NOT A NOMINAL TO DESIGN AROUND, which is why SIDE_PLATE_H, REAR_PLATE_W and FIN_STOCK all derive from it rather than each carrying their own 301.625 - they are one bought size and they cannot be allowed to drift apart in this file. The bottom edge is the reference on all five because it is the edge that bears on the torsion box's top skin, so a common height plus a common reference edge is what makes the beam line up without any part knowing about any other. Check all five against each other on arrival, not just against this number - two parts both wrong by the same amount would still assemble."

[[dim]]
sym = "SIDE_PLATE_L"
value = 998.54
provenance = "part"
note = "998.54, the ORDERED length of each side plate - 39 5/16in, sheared, two pieces. \u26a0 THE BEAM IS 1000 AND THE PLATE IS 1.46 SHORT OF IT, which is a choice the shear size made rather than a derivation: BEAM_LEN is a part at 1000 and nothing on Sheets 8, 9 or 10 needs the plate to reach the beam's ends. The seven T-slot stations run 50 to 950 on TSLOT_X_PITCH, so the shortfall sits in the 48.54 of margin past the last hole rather than anywhere load-bearing. Which END the 1.46 comes off is NOT decided here - Sheet 9's X 0 is the plate's left edge and the stations are absolute from it, so if the plate is laid out from the left the slack all lands at the right."
source = "Specialty Metals Corp sales order W053768, 2026-10-08"

[[dim]]
sym = "SIDE_PLATE_H"
expr = "PLATE_H"
note = "The full-height outboard plate's height, 301.625 - PLATE_H, because it is the same ordered size as the back plate and the fin square. Ordered 11 7/8in x 39 5/16in - the sales order, not the 39 3/8in this note carried until 2026-10-08, which was 1.59 long. Still a BOUGHT size and not a derived one, which is exactly why Sheet 9 dimensions off the bottom edge; that convention is now load-bearing rather than merely tidy, because the plate no longer reaches the beam top."

[[dim]]
sym = "SIDE_TSLOT_ROW_1"
expr = "Y_BEAM_UNDERSIDE + RAIL_SLOT_INSET"
note = "Lowest of Sheet 9's four T-slot rows, measured from the plate's BOTTOM edge - 197. \U0001f534 WAS 199.8 AND WAS WRONG. I had written it as SIDE_PLATE_H - BEAM_H + RAIL_SLOT_INSET, which assumes the side plate's bought 304.8 finishes flush with the beam top. It does not and it does not need to: he settled 2026-10-03 that the side plate is measured from its BOTTOM edge throughout, so the bought top edge has NO effect on the beam's height - which is what made the drop to an ordered 301.625 cost nothing on this sheet. The beam's height comes from the fin instead. The error was 2.8 and the 3D model's interference check is what surfaced it, by fouling the interposer against the fin above the window. Rows 2-4 follow on SLOT_GRID."

[[dim]]
sym = "SIDE_TSLOT_ROW_4"
expr = "SIDE_TSLOT_ROW_1 + (3 * SLOT_GRID)"
note = "Highest of the four, 287 from the bottom edge. 🔴 THIS NOTE SAID 289.8 AND A 15 mm CHECK AND BOTH WERE STALE - left behind when SIDE_TSLOT_ROW_1 was corrected from 199.8 to 197 on 2026-10-03. The label was updated and this note was not. Against the ordered 301.625 top edge the row now sits 14.625 below it, which is within 0.375 of the beam's own 15 slot inset - and that 0.375 is the fin square's own shortfall, arriving here from a different direction."

[[dim]]
sym = "STRIP_ROW_LOW"
expr = "(FRONT_STRIP_W / 2) - RAIL_SLOT_INSET"
note = "Sheet 8's lower bolt row, 7.5 from the strip's edge. Forced, not chosen: the strip is centred on the beam's seam because the block gap it passes through is, and the two slots flanking the seam sit RAIL_SLOT_INSET either side of it."

[[dim]]
sym = "STRIP_ROW_HIGH"
expr = "(FRONT_STRIP_W / 2) + RAIL_SLOT_INSET"
note = "Sheet 8's upper bolt row, 37.5. Same derivation as STRIP_ROW_LOW, the other side of the seam."

[[dim]]
sym = "BOX_FRONT_OVERHANG"
value = 140
provenance = "derived"
note = "How far the box's top skin runs PAST the front fins. His, 2026-10-03. The front is the one side with no tongue: rather than capture the fins, the box simply extends under and beyond them and FOUR L-BRACKETS BEHIND EACH FIN tie the fin down to the top skin. That is why BOX_FORE_AFT grew rather than shrank, and why Sheet 1's two tongue bolts need re-purposing or deleting."

[[dim]]
sym = "SIDE_TONGUE_START"
expr = "T_REAR_PLATE"
note = "Where the side tongue begins, from the box's BACK edge - 6.35, his 1/4in offset 2026-10-03. The back tongue laps the rear plate's outer face, so the rear plate occupies the first 6.35 of the box's fore-aft run and the side tongue starts just clear of it."

[[dim]]
sym = "SIDE_TONGUE_L"
expr = "BEAM_LEN"
note = "Side tongue length, 1000 - his, 2026-10-03, and it is the Y beam's own length because the side plate it laps is too."

[[dim]]
sym = "SIDE_TONGUE_END"
expr = "SIDE_TONGUE_START + SIDE_TONGUE_L"
note = "1006.35 from the box's back edge. THIS IS THE NUMBER THAT CLOSES THE FIN CLASH: the Y beam runs 6.35 to 1006.35 and the front fin caps it from 1006.35 forward, so the tongue ends exactly where the fin begins. The fin stands FIN_PROUD = 16.825 outboard of the side plate, which is also the tongue's inner face, so a tongue running any further forward would be held off the plate by the fin along the plate's whole length. It does not run further forward."

[[dim]]
sym = "BOX_FRONT_BARE"
expr = "BOX_FORE_AFT - SIDE_TONGUE_END"
note = "Bare top skin ahead of the side tongue, 150. The front fin occupies the first T_FIN of it and the remaining BOX_FRONT_OVERHANG is clear deck, which is where the four L-brackets per fin land."

[[dim]]
sym = "T_BOX_TONGUE"
value = 25
provenance = "derived"
note = "25 - the box tongue, ONE lamination and NOT the two-lamination 38 the old walls had, because with no channel there is nothing for a second one to form. \U0001F534 IT IS NOT A SEPARATE PART FROM THE OUTER WALL - torsion-box.md: 'inner web between the skins, outer lamination 180 mm tall standing on the bottom skin and 60 mm proud'. The tongue IS that outer lamination, so its thickness and the outer wall's are ONE DECISION and cannot be set apart. \u2705 25 SINCE 2026-10-11, up from 19, AND THE ARGUMENT IS BOLT BEARING RATHER THAN STIFFNESS: the standing plates bolt THROUGH this in a lap, M8 in a 9 hole, so bearing area is hole x thickness - 171 mm2 at 19 against 225 at 25, up 32%. lateral-stiffness.md makes those two through-bolts THE lateral load path, as a 145 mm couple, and plywood crushing under a bolt is a real limit where plywood shearing in a rib is not. \u2705 GEOMETRICALLY FREE: MACHINE_OUTER_W is plate to plate and the tongue laps the plates from OUTBOARD, so this only grows the box's outer envelope and nothing inside the machine moves. \u26A0 NOMINAL - caliper the sheet in hand, same warning as the skins."

[[dim]]
sym = "FIN_COVERS_TONGUE_END"
expr = "FIN_PROUD - T_BOX_TONGUE"
note = "Shortfall in the fin's cover of the side tongue's front END GRAIN, -8.429 since the tongue went to 25 on 2026-10-11 - it was -2.175 on a 19 tongue and a 3.175 side plate, and both numbers have moved since. HE IS CHAMFERING THE EXPOSED END GRAIN, his call 2026-10-11, so the four-fold increase costs nothing and there is still nothing to change. ✅ RESOLVED 2026-10-03 and the answer is: leave it. He first said the fin runs 19 past the side plate, which would cover a 19 tongue exactly; the repo computes FIN_PROUD = 16.825 (FIN_OVERHANG 20 less the 3.175 side plate). Asked which was right he confirmed THE REPO IS CORRECT and that a partial overlap is fine - so the fin covers 16.825 of the 19 and 2.175 of end grain stays exposed, deliberately. NOTHING TO CHANGE. This symbol exists so the next person finds the answer instead of the discrepancy."

[[dim]]
sym = "FIN_BRACKETS"
value = 2
provenance = "derived"
note = "L-brackets behind each front fin, tying it down to the box's top skin - four across the machine. His, 2026-10-03, replacing the deleted front tongue. They land on Sheet 1's T1 and T2, which were the tongue bolts and were repurposed rather than re-picked, so the 145 mm couple that provides the moment restraint survives the change."

[[dim]]
sym = "REAR_PLATE_W"
expr = "PLATE_H"
note = "The rear plate's height, 301.625 - PLATE_H, the same ordered size as the side plates and the fin square. Ordered 11 7/8in x 47 21/32in. Sheet 7 is referenced to the plate's BOTTOM edge, so this is the top edge's Y."

[[dim]]
sym = "RP_BEAM_ROW_1"
expr = "Y_BEAM_UNDERSIDE + EXT_BORE_INSET"
note = "197. Lowest of Sheet 7's four beam-bore rows, A1-A16, from the plate's BOTTOM edge - the SAME formula and the same number as SIDE_TSLOT_ROW_1, and the same 197 / 227 / 257 / 287 Sheet 1 already carries for the fin's beam-end bores. 🔴 IT DOES NOT DEPEND ON THE BOUGHT PLATE HEIGHT, and the first version of this symbol said it did: it was written as REAR_PLATE_W - BEAM_H + EXT_BORE_INSET, which assumes the beam's top face is flush with the plate's top edge. It is not, and the registry already said so - Y_BEAM_UNDERSIDE comes from the FIN's window, the riser that actually carries the beam, settled 2026-10-03 after the side plate was ruled out as the reference. Every plate standing on the box's top skin therefore sees these bores at the same height, whatever height that plate was bought at. ⚠ Still the rows gated by whether the Laguna can hold one height reference across 1210.73 mm."

[[dim]]
sym = "RP_BEAM_ROW_2"
expr = "RP_BEAM_ROW_1 + SLOT_GRID"
note = "227. The 30 series' module is the bore pitch up a stacked pair, so rows 2-4 follow on SLOT_GRID."

[[dim]]
sym = "RP_BEAM_ROW_3"
expr = "RP_BEAM_ROW_1 + (2 * SLOT_GRID)"
note = "257."

[[dim]]
sym = "RP_BEAM_ROW_4"
expr = "RP_BEAM_ROW_1 + (3 * SLOT_GRID)"
note = "287, the highest. It sits EXT_BORE_INSET below the beam's top face, and that face is 0.375 ABOVE this plate's own top edge - so the highest bore is 14.625 below the plate edge, the same 14.625 as SIDE_TSLOT_ROW_4 on the side plate. Both are the fin square's 0.375 shortfall arriving from a different direction."

[[dim]]
sym = "XBOX_ROW_Y"
expr = "BOX_TONGUE_BOLT_Y"
note = "Sheet 7's X1-X8 torsion-box row: a flat 30, because the sheet is now referenced to the plate's BOTTOM edge (his call 2026-10-07) and this row has always been 30 up from it. It IS BOX_TONGUE_BOLT_Y - the one bolt line shared with the side plates and the front fin - so the symbol survives only as the name Sheet 7 uses for it. In the old inverted frame it read 271.625 and moved with the bought plate height; now it does not, and the sixteen beam bores do instead. It was a flat 270 until 2026-10-03, given as a round number when Sheet 7 was first reframed upside down; that put it 34.8 up, 4.8 off every other plate, and a note had rationalised the gap as deliberate when nobody had decided it."

[[dim]]
sym = "RAIL_W"
value = 20
provenance = "part"
note = "HGR20 rail width - the 20 in the designation. For the 3D model he settled 2026-10-03 that the rail may be drawn as 20 mm SQUARE ROD, so this doubles as its section height. That is an approximation he chose, not one the model invented: the real HGR20 profile is shorter than it is wide and shaped, and nothing downstream of a drawing depends on the difference."

[[dim]]
sym = "X_CARRIAGE_W"
value = 154
provenance = "part"
note = "154, the X carriage plate across - same width as the X end plates, and Sheet 3a's Y axis."

[[dim]]
sym = "Z_RAIL_INSET"
value = 20
provenance = "derived"
note = "20, each Z rail's centreline in from the carriage plate's long edge - Sheet 3a's R1 at Y 20 and R2 at Y 134. It is set at assembly with a 10 mm stop against the plate edge, the rail being RAIL_W wide, so the stop is the thing that makes this repeatable rather than a measurement."

[[dim]]
sym = "Z_RAIL_COL"
expr = "(X_CARRIAGE_W / 2) - Z_RAIL_INSET"
note = "57, the Z rail centrelines either side of the carriage plate's centre, so a pitch of 114. 🔴 IT WAS CARRIED AS A MEASURED 57.5 AND SHEET 3a HAS ALWAYS DRAWN 57. The sheet puts R1a-g on Y 20 and R2a-g on Y 134 of a 154 plate - inset 20 from each long edge, which is 57 from the centre - and nobody had noticed the registry disagreeing by half a millimetre. The sheet wins: 20 from the edge is a design intent set with a stop block, where 57.5 was a reading off a carriage. That half millimetre is not cosmetic - it is what decides whether the block bolt columns land on whole numbers, and therefore the whole plate."

[[dim]]
sym = "SPACER_L"
value = 160
provenance = "part"
note = "160, NEW STOCK ordered 2026-10-08 - the existing pair at 150.5 and 151.6 cannot span the spread blocks. It carries the four clearance holes at 18.5 / 54.5 / 105.5 / 141.5 and the driver access hole at its centre. ⚠ 160 puts a symmetric hole pattern on half millimetres; a 161 bar would read 19 / 55 / 106 / 142. Sheet 3b."

[[dim]]
sym = "SPACER_W"
value = 50
provenance = "part"
note = "50, the new bar across - metric, replacing the 2in (50.8) of the existing pair. His, 2026-10-08. It leaves 9 mm either side of the block's own 32 mm bolt pitch, and the 0.8 it gives up against 2in is what keeps the BF12 side clearance where it was once the rails came in to a 114 pitch - see BF12_SIDE_CLEAR."

[[dim]]
sym = "CLAMP_W"
value = 122
provenance = "measured"
note = "Clamp footprint across the Z plate, where it lands on the face - HIS CALIPERS, 2026-10-10. \u2705 THE VENDOR 122 WAS RIGHT: a first reading gave 120, the second reading gives 122, and Sheets 3 and 4 had drawn 122 all along, so nothing downstream moves. It holds the 122 for CLAMP_STEP_OUT and then steps in to CLAMP_SHOULDER_W. Pairs with CLAMP_AXIAL. It is what leaves 2 mm of relief at each end of the 164 plate once the 100 x 25 bolt pattern is centred in it."

[[dim]]
sym = "WINDOW_Z_LOW"
value = 132
provenance = "derived"
note = "Window's lower edge, from the fin's BOTTOM edge - Sheet 1's X 132. The casting occupies 132 to 172.5 of it; the rest is clearance."

[[dim]]
sym = "WINDOW_OUTB_DRAWN"
value = 20
provenance = "derived"
note = "Window's outboard edge from the fin's outboard factory edge, AS DRAWN on Sheet 1 (Y 20). \u26a0 WINDOW_OUTB says 19, measured off the MDF template 2026-10-02, and open-items.md closed the strip widths at 19. The two disagree by 1. The 20 is almost certainly right and the 19 stale: at 20 the window's outboard edge lands on X 3.175 and 1207.555 in machine coordinates, which ARE the two Y beams' outer faces - exactly what Sheet 1's own note says it is aligned to. The 3D model uses 20. SETTLE IT before the fins are cut."

[[dim]]
sym = "INTERPOSER_L"
value = 150
provenance = "derived"
note = "Sheet 6's bar length. Its outboard end protrudes 30 past the fin's outer face, so measuring along the beam from the beam's end face it runs -40 to +110."

[[dim]]
sym = "INTERPOSER_W"
expr = "EXT_W"
note = "60 across, the beam's own footprint, because it sits under the beam."

[[dim]]
sym = "BF12_BEARING_L"
value = 10
provenance = "measured"
note = "10 - the bearing inside BF12 along the screw, CENTRED in the block's T_BF12_BLOCK of 20. His, 2026-10-10. It is what decides where the screw ends: the journal has to straddle the bearing, not reach it."
source = "his, 2026-10-10"

[[dim]]
sym = "SCREW_END_IN_BF12"
expr = "(T_BF12_BLOCK + BF12_BEARING_L) / 2 - SCREW_JOURNAL_BF"
note = "4 - how far the screw's end stops SHORT of BF12's mounting face. \U0001f534 THE SCREW DOES NOT BUTT THE PLATE. The bearing is BF12_BEARING_L centred in the block, so it spans 5 to 15 through it; the thread stops on the bearing's near face at 15 and SCREW_JOURNAL_BF runs back 11 from there, ending at 4. \u2705 THE 1 THAT LEAVES PAST THE BEARING IS THE RETENTION - his, 2026-10-10: a spring clip over the end of the shaft holds it, and 1 is simply what 11 of journal less 10 of bearing gives. Drawn with the screw's end against the plate instead, the journal sat in the block's plate-side 11 and 4 of the bearing was running on THREAD. \u2705 It applies at all three BF12 ends - the rear plate on Y, the tongue on X, the carriage plate on Z - and it pushes each screw that far along, which is why INTERPOSER_PROUD carries it."

[[dim]]
sym = "INTERPOSER_BOLT_ROW_1"
value = 105
provenance = "derived"
note = "105 - the first of the interposer bar's two T-nut rows, from the bar's OUTBOARD end, Sheet 6's T1 and T3. \U0001f534 IT WAS DRAWING-ONLY until 2026-10-10, the same gap SHELF_BOLT_LOW_X records: the number lived on one sheet and nowhere else, so nothing could check it. The pair used to be 82 / 110 / 138 and there used to be three: the bar slid back to meet the screw and the casting came back at 77 rather than 72.5, so 82 fouls its face outright and the other two moved in to 105 and 135."
source = "shop-pack Sheet 6"

[[dim]]
sym = "INTERPOSER_BOLT_ROW_2"
value = 135
provenance = "derived"
note = "135 - the second T-nut row, Sheet 6's T2 and T4. \u2705 It leaves 15 to the bar's inboard end against the roughly 9 half-head of an M8 flange bolt, which is why there are no counterbores on this part. The first column clears the casting's face by 28, so its head clears by 19."
source = "shop-pack Sheet 6"

[[dim]]
sym = "INTERPOSER_PROUD"
expr = "T_REAR_PLATE + SCREW_END_IN_BF12 + SCREW_OAL_LONG - SCREW_JOURNAL_CAST + CASTING_FOOTPRINT_L - SIDE_TONGUE_END - T_FIN"
note = "8 - how far the interposer's outboard end stands past the fin's outer face, so the casting and bar protrude through the window together. \U0001f534 IT WAS A CHOSEN 30 AND IS DERIVED NOW - his, 2026-10-10. THE BAR FOLLOWS THE SCREW, which is the whole reason it exists besides giving K1-K6 something solid to land in: the casting has to sit where its bearing contains the journal, and the bar slides back to meet it. Place the bar first and the screw ends up with 22 of bare shaft between its thread and the casting. \u2705 THE EXPRESSION IS JUST THAT SENTENCE: the screw starts on the rear plate's inner face, runs SCREW_OAL_LONG, its bore takes the inner end of the long journal, and the footprint ends CASTING_FOOTPRINT_L later - measured past the fin's outer face, that is 8. y-beam-support.md's 30 is superseded."

[[dim]]
sym = "Y_BEAM_UNDERSIDE"
expr = "WINDOW_Z_LOW + WINDOW_H"
note = "The Y beam's underside above the torsion box's top skin, 182 - and it comes from the FIN, which is the riser that actually carries the beam. It is the top edge of the fin's window: the casting and interposer fill the window up to the beam, so the window's top IS the beam's underside. Settled 2026-10-03 after the side plate was ruled out as the reference."

[[dim]]
sym = "Y_BEAM_TOP_Z"
expr = "Y_BEAM_UNDERSIDE + BEAM_H"
note = "302 above the box's top skin. THIS IS THE CROSS-CHECK THAT THE CHAIN IS RIGHT: it lands on exactly FIN_STOCK, the measured 302 of the fin square, from a completely separate direction - the window's drawn position. The fin is flush with the beam top; the side plate is not, and does not need to be."

[[dim]]
sym = "X_BEAM_TOP_Z"
expr = "Y_BEAM_TOP_Z + XEP_TOP_ABOVE_BEAM"
note = "362 above the torsion box's top skin. The X end plate stops at the top of the X beam's upper extrusion, which is XEP_TOP_ABOVE_BEAM = 60 above the Y beam's top - so this is where the gantry's top face lands."

[[dim]]
sym = "X_BEAM_UNDERSIDE"
expr = "X_BEAM_TOP_Z - BEAM_H"
note = "242 above the torsion box's top skin. 🔴 IT IS NOT PLATE_H MINUS 60. That arithmetic gives 241.625 and it was tried on 2026-10-08; it uses the standing plates' top edge as a stand-in for the Y beam's top, and the two differ by 0.375 because the plates are bought at 301.625 while the beam top is at 302. The gantry's height is set by the Y RAILS, which are set by the Y beam, which the FIN'S WINDOW puts at Y_BEAM_UNDERSIDE = 182 - no plate edge is in that chain. THIRD TIME IN ONE DAY for the same substitution: RP_BEAM_ROW_1 was written off REAR_PLATE_W and corrected, BF12_ROW1_BARE still converts from a plate edge and is open, and then this. Independent cross-check: 242 is also the Y beam's own seam, 182 + EXT_W - a coincidence of the 60 series and worth knowing as a check, but do NOT derive from it, because nothing makes the gantry underside and the Y seam the same thing."

[[dim]]
sym = "SIDE_PLATE_PROUD"
expr = "SIDE_PLATE_H - Y_BEAM_TOP_Z"
note = "The side plate's top edge against the Y beam's top. NOW NEGATIVE at -0.375: the plate finishes just BELOW the beam top rather than 2.8 above it, because the ordered height came down to 11 7/8. The name says proud and the number no longer is - kept rather than renamed because every sheet and both documents refer to it. Harmless either way, and it is the reason Sheet 9 is dimensioned off the bottom edge: a bought plate was never going to land on the beam top by luck."

[[dim]]
sym = "FLANGE_HEAD_D"
value = 17.3
provenance = "measured"
note = "M8 flange head across the flange, THE BEAM-END BOLT - 17.3, measured on the bench 2026-09-29. The flange is why these bolts need no counterbore and no washer: it spreads the load itself. \U0001f534 THIS IS THE BOLT THAT GOES INTO A BEAM'S END, i.e. into the extrusion's lengthwise corner bores, and his rule 2026-10-08 is that THESE STAY THE OLD STYLE. Three places, all the same 8-per-beam-end pattern: the back plate and the two front fins onto the Y beam ends, and the two X end plates onto the X beam ends, eight bolts each. \u26a0 DO NOT CONFUSE IT WITH FLANGE_STRIP_D: the bolts that go into T-SLOTS on the beam's front face went to a smaller 13.8 head on 2026-10-08 so the encoder puck would fit, and for a few hours this symbol wrongly carried that 13.8 and took the beam-end bolt with it. Two fasteners, two symbols."
source = "measured on the bench 2026-09-29; scope confirmed by him 2026-10-08"

[[dim]]
sym = "FLANGE_HEAD_H"
value = 4
provenance = "measured"
note = "TOTAL height the BEAM-END M8 head stands proud of the face, at its centre - 4 on the 17.3 bolt, his 2026-10-08. THESE ARE FLANGED BUTTON HEADS WITH A HEX SOCKET IN THE MIDDLE OF THE DOME, not hex-head flange bolts: there is NOTHING above this. \u26a0 THIS SYMBOL HAS NOW CARRIED FOUR FIGURES FOR ONE PART: 5, then 2.5 on 2026-10-03, then briefly 3 on 2026-10-08 when the strip bolt's height was wrongly written here, and now 4. The 5 came from believing a hex head sat on top of the dome and is simply wrong; 2.5 and 4 are both his own readings of the same 17.3 bolt five days apart and they have never been reconciled. \u2705 Nothing derives from it - dims.py deps returns nothing - so it is a recorded fact rather than a load-bearing one, and the clearances that matter around these heads are all lateral. The strip bolt's height is FLANGE_STRIP_H."
source = "his calipers and his choice, 2026-10-08"

[[dim]]
sym = "FLANGE_RIM_H"
value = 1
provenance = "measured"
note = "Flange thickness at the rim - he gives it as UNDER 1, so this is an upper bound rather than a figure. It is the number that matters for anything sliding past a bolted joint, which is why it is worth writing down separately from the centre. \u26a0 IT WAS READ ON THE 17.3 BEAM-END HEAD, which is still in service, and has NEVER been read on the 13.8 strip head. Its only consumer is STRIP_STACK, which is about the STRIP bolt - so the one value this symbol feeds is taken from the wrong bolt. It does not currently matter, because STRIP_HEAD_REACH stops 0.6 inside the strip's edge and nothing slides past anything; a 13.8 head's rim will also be thinner than a 17.3 one's, so the bound is conservative in the safe direction. Re-measure on the strip bolt if a joint ever turns up where its rim has to pass under something."

[[dim]]
sym = "FLANGE_M5_D"
value = 13.4
provenance = "measured"
note = "M5 flange head across the flange. His, 2026-10-03. \U0001f534 THE REPO HAD 11.8 FOR THIS - y-beam-support.md records it as the figure a since-corrected edge-distance check leaned on. 13.4 is 1.6 bigger, and the half-head that edge distance actually turns on goes 5.9 to 6.7."

[[dim]]
sym = "FLANGE_M5_H"
value = 2.4
provenance = "measured"
note = "TOTAL height the M5 head stands proud, at its centre - domed, hex-socketed, nothing above it. Only 0.1 under FLANGE_HEAD_H's 2.5, which is worth knowing: the two sizes stand off a face by effectively the same amount, so a clearance that works for one works for the other."

[[dim]]
sym = "FLANGE_M5_HALF"
expr = "FLANGE_M5_D / 2"
note = "6.7. The number edge distance is really asking for - a radius, not a diameter. y-beam-support.md raised a false alarm once by comparing a head DIAMETER against an edge DISTANCE, and this symbol exists so that cannot happen twice."

[[dim]]
sym = "FLANGE_STRIP_D"
value = 13.8
provenance = "measured"
note = "M8 flange head across the flange, THE T-SLOT BOLT ON THE FRONT JOINING STRIP - 13.8, his choice 2026-10-08, superseding the 17.3 of FLANGE_HEAD_D on this joint only. \U0001f534 IT IS NOT A COSMETIC CHANGE AND THAT IS THE POINT: the AS5311 puck needs SENSOR_KEEPOUT_W of 15 mm centred over the tape, and the strip\u2019s bolt rows CANNOT move - they sit at 7.5 and 37.5 because the extrusion\u2019s T-slots are RAIL_SLOT_INSET either side of the seam. At a 17.3 head the clear channel between the two head rims is 12.7 and the puck DOES NOT FIT, short by 1.15 a side; at 13.8 the channel is 16.2 and it fits by 0.6. The head diameter was the only variable in that sum. \u26a0 THE BEAM-END BOLTS ARE NOT THIS BOLT - they stay at 17.3, see FLANGE_HEAD_D. \u26a0 OPEN: whether the OTHER T-slot joints (the Y back plates, the X back plate, the casting interposer bars) also take this head or keep the 17.3. Only the front strip is FORCED by the encoder; the rest is a buy-one-bolt question and has not been asked."
source = "his calipers and his choice, 2026-10-08"

[[dim]]
sym = "FLANGE_STRIP_H"
value = 3
provenance = "measured"
note = "TOTAL height the strip bolt\u2019s head stands proud of the face, at its centre - 3 on the 13.8 head, his 2026-10-08. Flanged button head, hex socket in the dome, nothing above it. \u2705 It is 0.8 to 1.1 ABOVE the chip\u2019s plane - tape 1.6 plus the AS5311\u2019s 0.3-0.6 air gap puts the chip face at 1.9-2.2 - so the head IS taller than the sensor rides. That decides nothing, because the heads are outside the lane laterally; see SENSOR_KEEPOUT_SLACK. If the puck ever has to cross a head, this is the number it has to clear."
source = "his calipers and his choice, 2026-10-08"

[[dim]]
sym = "SENSOR_KEEPOUT_W"
value = 15
provenance = "part"
note = "15 mm, the width the AS5311 puck needs kept clear, CENTRED OVER THE TAPE - his figure 2026-10-08, and it covers the PCB plus its mounting points rather than the chip alone. The chip itself is tiny and was never the constraint. This is the number that chose the strip bolt: see FLANGE_HEAD_D."
source = "his, 2026-10-08"

[[dim]]
sym = "STRIP_CHANNEL_W"
expr = "STRIP_ROW_HIGH - STRIP_ROW_LOW - FLANGE_STRIP_D"
note = "16.2 - the clear lane down the middle of the front strip, between the facing rims of the two bolt head rows. It is what the sensor puck has to fit inside. \U0001f534 THE BOLT ROWS ARE NOT A FREE CHOICE: STRIP_ROW_LOW and STRIP_ROW_HIGH come straight off the extrusion\u2019s T-slots at RAIL_SLOT_INSET either side of the seam, so the ONLY way to widen this lane is a smaller flange head, which is exactly what happened on 2026-10-08. It was 12.7 at the old 17.3 head."

[[dim]]
sym = "SENSOR_KEEPOUT_SLACK"
expr = "(STRIP_CHANNEL_W - SENSOR_KEEPOUT_W) / 2"
note = "0.6 per side, and \u26a0 THAT IS THE WHOLE MARGIN ON THE ENCODER LANE. It was NEGATIVE (-1.15) at the old 17.3 head, which is to say the puck did not fit at all. \U0001f534 THE o9 CLEARANCE HOLES CAN EAT IT: S1-S14 are \u00f89 on M8 into SLIDING T-nuts, so nothing centres a bolt in its hole and \u00b10.5 is available. Both rows drifting inboard leaves 0.10 a side. BIAS THE STRIP BOLTS OUTBOARD WHEN TIGHTENING - it costs nothing and it is not a thing to discover after 3 m of one-shot PSA tape is down."

[[dim]]
sym = "CARRIAGE_TRAVEL"
value = 820
provenance = "measured"
note = "820 mm, THE TRAVEL ON ALL THREE LONG AXES - X, Y1 and Y2 - his measurement 2026-10-09, and it closes an open item the encoder doc had been carrying with stale Mega V XL numbers. \U0001f534 THE METHOD IS THE PART WORTH KEEPING, because it is not obvious and a future session would otherwise re-derive it badly: put ONE bearing block at each end of the same rail, each pushed until its grease zerk touches the end plate, and measure the INSIDE distance between them. That gap is (rail span) less TWO block bodies - and the real carriage IS two butted blocks, BLOCK_BUTTED, so the gap you measure is exactly the real carriage\u2019s travel rather than a proxy for it. The zerks are necessarily on the blocks\u2019 OUTER ends, since otherwise a pair could not butt, so the test reproduces the real stop geometry at both ends. \u2705 One figure serves all three beams: butted blocks set the carriage width on X and Y alike and every beam is BEAM_LEN, so there is one carriage length and one rail length. The stops are the X end plates meeting the back plate or a front fin."
source = "his calipers, 2026-10-09"

[[dim]]
sym = "TRAVEL_RAIL_LIMITED"
expr = "BEAM_LEN - BLOCK_BUTTED"
note = "845.82 - what the travel WOULD be if the rail ends alone stopped the carriage. \u2705 IT IS A CROSS-CHECK, NOT THE FIGURE TO USE: CARRIAGE_TRAVEL is measured at 820 and that is what sizes the tape. The two agree to 25.82, which is TRAVEL_LOST_TO_STOPS - the end plates standing inboard of the rail ends plus the zerks\u2019 own protrusion. \u26a0 It takes BEAM_LEN as a stand-in for rail length; the rails are 17 x M5 at 60 pitch, so about a metre, not exactly it. Close enough to confirm the measurement is the right size and nowhere near good enough to replace it."

[[dim]]
sym = "TRAVEL_LOST_TO_STOPS"
expr = "TRAVEL_RAIL_LIMITED - CARRIAGE_TRAVEL"
note = "25.82 - what the end plates take off the rail-limited travel, about 13 a side. Recorded because it is the number that moves if a stop face ever changes: the fin gets thicker, the back plate moves, or a zerk is swapped for a flush fitting. Nothing derives from it today."

[[dim]]
sym = "TAPE_STOCK"
value = 3000
provenance = "part"
note = "3 m of 10 mm magnetic strip on a steel band with 3M PSA, in stock - the figure design-can-position-feedback.md has carried since 2026-08-25. \U0001f534 IT IS THE BINDING CONSTRAINT ON THE WHOLE ENCODER LAYOUT and it is a ONE-SHOT consumable: the PSA does not survive a second lay. See TAPE_REMAINING, which is what is left after four axes."

[[dim]]
sym = "CARRIER_SECTION_L"
value = 220
provenance = "part"
note = "220 mm, the printed tape carrier\u2019s section length - his 2026-10-09, set by the Bambu P1S\u2019s 256 x 256 bed with four laid side by side. \u26a0 220 IS NOT A ROUND NUMBER PICKED FOR TIDINESS, it is the point where two limits nearly meet: below about 206 the four sections no longer span CARRIAGE_TRAVEL at all, and much above 220 the three beams plus Z no longer come out of TAPE_STOCK. 4 x 205 was considered and rejected - it gives exactly 820, which is the travel, leaving nothing for the Hall array or the tape\u2019s own unusable end poles."
source = "his, 2026-10-09"

[[dim]]
sym = "CARRIER_SECTIONS"
value = 4
provenance = "part"
note = "Four printed sections per beam. Four fit the bed in one run at 220 long; five would need them narrower. See CARRIER_W, which is open."
source = "his, 2026-10-09"

[[dim]]
sym = "TAPE_PER_BEAM"
expr = "CARRIER_SECTION_L * CARRIER_SECTIONS"
note = "880 mm of tape per long axis. The carrier sections butt end to end, joined by loose keys in blind sockets rather than protruding tenons - a male tenon would be swallowed at each joint and four sections would no longer reach 880."

[[dim]]
sym = "TAPE_OVERRUN_END"
expr = "(TAPE_PER_BEAM - CARRIAGE_TRAVEL) / 2"
note = "30 mm of tape past each end of travel. \U0001f534 THE OVERRUN IS NOT SLOP, IT IS LOAD-BEARING TWICE OVER. The AS5311 datasheet gives usable stroke as the active area LESS the 2.0 mm Hall array, with the short poles at either edge of the strip excluded from the active area - so tape equal to travel is always short. And the carriage reaches its hard stops exactly when something has gone wrong, which is the worst moment for the reader to be off the end: a magnetic reader that leaves the tape and returns gives a wrong count and does not complain. At 30 a side the array never approaches an end pole, which retires the end-exclusion question rather than requiring it to be respected."

[[dim]]
sym = "TAPE_THREE_BEAMS"
expr = "3 * TAPE_PER_BEAM"
note = "2640 mm for X, Y1 and Y2. One figure times three because CARRIAGE_TRAVEL is the same on all three."

[[dim]]
sym = "TAPE_Z"
expr = "Z_TRAVEL + (2 * TAPE_OVERRUN_END)"
note = "295.91 for the Z axis, on the same overrun rule. \u26a0 THE SOFTEST NUMBER IN THIS CHAIN: Z\u2019s tape runs on the EDGE of the Z gantry plate rather than between rails, because the 1605 screw occupies the centre, and that axis has never been laid out - the encoder doc calls its reader allocation reserved rather than spent. Z_TRAVEL is firm; how much tape the edge mounting actually wants is not."

[[dim]]
sym = "TAPE_REMAINING"
expr = "TAPE_STOCK - TAPE_THREE_BEAMS - TAPE_Z"
note = "64.09 mm left of the 3 m roll after all four axes. \U0001f534 THAT IS THE MARGIN ON A ONE-SHOT CONSUMABLE AND IT IS THIN. It is why CARRIER_SECTION_L stops at 220: at 230 the sections come to 2760 for the three beams and the roll goes NEGATIVE once Z is counted. Any of these going up - a longer travel on one axis, a more generous overrun, a wider Z allowance - comes out of 64 mm. \u26a0 Buy more tape before changing any of them, not after."

[[dim]]
sym = "FLANGE_HALF"
expr = "FLANGE_HEAD_D / 2"
note = "8.65, the M8 equivalent of FLANGE_M5_HALF. Same reason: this is what an edge distance has to clear. \U0001f534 IT IS THE BEAM-END HEAD'S HALF, off FLANGE_HEAD_D's 17.3 - the bolt that goes into a beam's corner bores, which his rule 2026-10-08 keeps at the old style. \u26a0 THE FRONT STRIP'S BOLT IS A DIFFERENT PART at 13.8, so its half is 6.9: use FLANGE_STRIP_D for anything on that joint. This symbol briefly read 6.9 on 2026-10-08 when the strip bolt was wrongly written into FLANGE_HEAD_D, which would have relaxed every edge distance in the repo on the strength of a bolt that is not in those joints."

[[dim]]
sym = "FLANGE_DRIVE"
value = 0
provenance = "part"
note = "NOT A LENGTH - a fact parked where the other fastener facts live, because it changes how a joint is assembled. Both the M8 and M5 flange fasteners are FLANGED BUTTON HEADS DRIVEN BY A HEX SOCKET in the centre of the dome, settled 2026-10-03. Two consequences. (1) They need AXIAL access for a hex key and cannot be driven by a spanner, so anywhere a bolt sits in a narrow slot the key reaches it where a wrench never would - the front strip's rows, 45 between the bearing block rows, are the case in point. (2) The whole head is FLANGE_HEAD_H or FLANGE_M5_H proud and no more; nothing sits above the dome."

[[dim]]
sym = "RAIL_BOLT_HOLE_D"
value = 6
provenance = "vendor"
note = "6, the rail's through-hole - Vevor HGH block page, column d. 🔴 THE 0.5 OF RADIAL FLOAT ON AN M5 IS NOT SLOP, IT IS THE MECHANISM. It is what lets a bolt tilt to catch a T-nut thread that is not perfectly aligned, and what lets the rail be nudged into line. He found an M6 would enter but not wiggle, and concluded the bolts would have to be pre-threaded into their T-nuts and slid in one at a time - 51 assemblies by hand. That difficulty WAS the symptom: a mounting hole with no clearance is the wrong bolt, not a hard job."

[[dim]]
sym = "BOLT_RAIL"
value = 16
provenance = "vendor"
note = "M5 x 16 for every rail mounting bolt - Vevor HGH block page. Socket head 8.5 across, which seats in the 9.5 counterbore with 0.5 to spare where an M6's 10.0 will not go in at all."

[[dim]]
sym = "RAIL_CBORE_D"
value = 9.5
provenance = "vendor"
note = "9.5, the counterbore along an HGR20 rail - Vevor HGH block page, column D, and he confirms it on the part. Was carried as 10. 🔴 IT IS WHAT SETTLED THE M5-versus-M6 ARGUMENT: the manual contradicts itself, the block page giving M5 x 16 with D 9.5 / h 8.5 / d 6 and the rail page giving S = M6 x 1P. An M6 SOCKET HEAD IS 10.0 ACROSS AND CANNOT SIT IN A 9.5 COUNTERBORE - he tried it. The block page is right, the rail page is an error, and Sheet 3a's fourteen M5 holes stand as drawn."

[[dim]]
sym = "RAIL_CBORE_DEPTH"
value = 8.5
provenance = "vendor"
note = "8.5, the counterbore depth - Vevor HGH block page, column h, confirmed on the part. Was carried as 10, which also made the rail look like half its 17.5 height. It is one term in how far a hex driver has to reach to a rail bolt through the Z plate and spacer."

[[dim]]
sym = "RAIL_CBORE_FIRST"
value = 20
provenance = "part"
note = "First counterbore from either end of a rail - the pattern is symmetric, 20 in from both ends with RAIL_CBORE_PITCH between."

[[dim]]
sym = "RAIL_CBORE_PITCH"
value = 60
provenance = "part"
note = "Counterbore pitch along the rail."

[[dim]]
sym = "RAIL_CBORE_N_BEAM"
expr = "((BEAM_LEN - (2 * RAIL_CBORE_FIRST)) / RAIL_CBORE_PITCH) + 1"
note = "17 on a 1000 rail. IT COMES OUT EXACTLY, which is the check that the 20 / 60 / 20 pattern is right: gantry-beam-joint.md has said 'HGR20, 17 x M5 at 60 mm' since the bench measurements, from a completely separate direction."

[[dim]]
sym = "RAIL_CBORE_N_Z"
expr = "((Z_RAIL_L - (2 * RAIL_CBORE_FIRST)) / RAIL_CBORE_PITCH) + 1"
note = "7 on the 400 Z rail. Also exact, on the same pattern."

[[dim]]
sym = "Z_RAIL_L"
value = 400
provenance = "part"
note = "Z rail length, on a 407 carriage plate - which is where the 7 mm at one end that z-carriage.md calls 'forced, not chosen' comes from."

[[dim]]
sym = "BLOCK_OVERHANG_CLEAR"
value = 6
provenance = "measured"
note = "Clear height under the HGH20 block, above the surface the rail sits on. His, 2026-10-03, stated as AT MOST 6 - so it is an upper bound, and anything designed against it should leave room. \U0001f534 WAS 4.5 from the 2026-09-29 bench table. The 6 is the better number because IT PREDICTS BOTH OF HIS MEASURED OUTCOMES, where 4.5 only predicted one: a 4 mm strip stacks to 5 and fits, a 1/4in strip stacks to 7.35 and does not. At 4.5 the 4 mm case came out marginal on paper while fitting in practice, which was the tell that the clearance figure was wrong rather than the fit. IT IS THE CEILING ON ANYTHING THAT REACHES UNDER THE BLOCK."

[[dim]]
sym = "STRIP_HEAD_REACH"
expr = "RAIL_SLOT_INSET + (FLANGE_STRIP_D / 2)"
note = "How far a strip bolt's flange head reaches from the beam's seam: \u2705 21.9 on the 13.8 head adopted 2026-10-08, against a strip half-width of 22.5. THE HEAD NOW STOPS 0.6 INSIDE THE STRIP'S OWN EDGE and reaches nothing. \u26a0 THAT RETIRES A WHOLE CLEARANCE QUESTION rather than changing its answer: at the old 17.3 head this was 23.65, past the 22.5 and past a block inner edge near 23, so the head's RIM passed under the bearing block's overhang by about half a millimetre. That was fine and it was MEASURED - he checked it 2026-10-03 on a real beam with rails and blocks fitted, the rim being under a millimetre thick at that radius - and the 3D model only flagged it because it draws the block as a plain solid with no overhang relief. None of that applies now; nothing goes under the block. See STRIP_STACK, which existed to bound it."

[[dim]]
sym = "STRIP_STACK"
expr = "T_FRONT_STRIP + FLANGE_RIM_H"
note = "What has to pass under the block where the bolt head reaches past the strip's edge: the strip plus the flange AT ITS RIM, which is the only part that gets that far out. 5 against BLOCK_OVERHANG_CLEAR's 6, so it CLEARS BY 1 - and both of those are upper bounds, so the real margin is larger. \u2705 Measured on a real beam at 4 mm. At the old 6.35 the stack was 7.35 against the same 6 and it did NOT fit, which is what drove the strip to 4. The arithmetic and the measurement now agree in both directions; with the old 4.5 clearance they did not, and the measurement was right. \u26a0 KEPT, BUT IT NO LONGER BITES: on the 13.8 head adopted 2026-10-08 STRIP_HEAD_REACH is 21.9 against a 22.5 strip half-width, so NO PART OF THE HEAD REACHES THE STRIP'S EDGE, let alone under the block. This stays because the strip thickness argument it records is why T_FRONT_STRIP is 4 and not 1/4in, and that reasoning is still load-bearing."

[[dim]]
sym = "T_FRONT_STRIP"
value = 3.175
provenance = "nominal"
note = "The front joining strip, all three beams. \u26a0 OPEN AND BOUNDED RATHER THAN KNOWN: ordered as 1/8in 6061 flat bar, but metric and SAE intermix unpredictably on this supplier's aluminium, so it may arrive at 3.175 OR at 4.0 - his warning 2026-10-09. 3.175 is carried here because it is the conservative end for the consequence that actually bites. \U0001f534 CALIPER IT ON ARRIVAL AND PUT THE READING HERE, which is the fourth time this repo has had a nominal turn out wrong - a 5/8in spacer that measured 16.41, a 1/2in plate whose stock is 10 mm, a 1/2in end plate at 12.19. \u2705 BOTH ENDS ARE SAFE ON BLOCK CLEARANCE: STRIP_STACK is 4.175 at 3.175 and 5.0 at 4.0, against BLOCK_OVERHANG_CLEAR's 6, and the 5.0 case is the one his 60 mm test pieces already proved. \u26a0 THE BOLT IS WHERE IT BITES: see BOLT_FRONT_STRIP - an M8 x 10 reaches 6.0 through a 4.0 strip and 6.825 through a 3.175 one, against a 7.2 limit, so the margin falls from 1.2 to 0.375. \U0001f534 WAS 1/4in (6.35) UNTIL 2026-10-03 AND THAT DID NOT FIT: the bolt heads fouled the bearing blocks, confirmed on the real beam. The strip is NOT T_BACK_JOIN_PLATE - they shared 6.35 once and are different parts with different constraints; the back plate is sized for stiffness, the strip by what clears a block overhang. See gantry-beam-joint.md for the stiffness given up."
source = "ordered 1/8in; CALIPER ON ARRIVAL"

# ------------------------------------------------- T-slot bolt lengths, 2026-10-04

[[dim]]
sym = "TSLOT_LIP_T"
value = 2.3
provenance = "measured"
note = "Thickness of the T-slot lip on the 30-6060 - the shoulder a slide-in T-nut bears against, so it is also HOW DEEP the nut's back face starts. His calipers, 2026-10-04. The 8020 section drawing calls the lip 4.20, which is a DIFFERENT dimension (the lip's reach inward, not its thickness) and must not be substituted here. This is one of the two numbers that decide bolt length; nothing in the repo had it before."

[[dim]]
sym = "TSLOT_DEPTH"
value = 9.5
provenance = "measured"
note = "Beam face to T-slot FLOOR on the 30-6060. His calipers, 2026-10-04. The other half of the bolt-length calculation, and the figure the published section does not give: the drawing dimensions the slot's mouth (8.14) and channel width (16.51) but never its depth, which is why bolt lengths could not be computed before this was taken."

[[dim]]
sym = "TSLOT_MOUTH_W"
value = 8.14
provenance = "part"
note = "8.14, the T-slot's MOUTH on the 30-6060 - the gap between the two lips, which is what you see looking at the face. It was already in the repo as prose inside TSLOT_DEPTH's note and nowhere else, so nothing could draw a slot from it. It is NOT the channel width behind the lips, which the same drawing gives as 16.51, and it is not a bolt clearance - an M8 passes the mouth with room because the lip, not the mouth, is what a T-nut bears on."
source = "manufacturer-assets/8020-30-6060-Profile-Drawing.jpg"

[[dim]]
sym = "TNUT_BODY_T"
value = 6
provenance = "measured"
note = "8020 13025 T-nut body thickness where the thread runs - 6, his calipers 2026-10-04, confirming the published F = 6.00. THIS IS THE CEILING ON THREAD ENGAGEMENT for every bolt-on plate on every beam: the bolt cannot engage more than 6 mm no matter how long it is, so engagement is set by the nut and not by the bolt. The nut's total height is 7.80 including its 1.80 boss, and that boss is not threaded usefully - do not compute engagement off 7.80."

[[dim]]
sym = "TNUT_BACK_FACE"
expr = "TSLOT_LIP_T + TNUT_BODY_T"
note = "Where the T-nut's back face sits below the beam face: 8.3. The boss (1.80) is SHORTER than the lip (2.3), so the nut's shoulders bear on the lip underside and the boss top sits 0.5 recessed from the face - which means the lip thickness, not the boss, is what sets this depth."

[[dim]]
sym = "TNUT_BACK_CLEAR"
expr = "TSLOT_DEPTH - TNUT_BACK_FACE"
note = "Air behind the T-nut, between its back face and the slot floor: 1.2. THIS IS THE PROTRUSION BUDGET - how far a bolt tip may stand proud of the nut before it bottoms on the slot floor. A bolt that bottoms reads as a tight bolt that never pulls the plate down, which is the failure this symbol exists to prevent."

[[dim]]
sym = "BOLT_REACH_MAX"
expr = "TNUT_BODY_T + TNUT_BACK_CLEAR"
note = "7.2 - the most a bolt may reach past the back face of any plate bolted to a beam. Bolt length minus plate thickness must not exceed this. It is what rules M8 x 12 OUT on the 4 mm front strip (reach 8.0) while leaving it correct on the 6.35 back plate (reach 5.65)."

[[dim]]
sym = "T_OUTBOARD_PLATE"
expr = "T_SIDE_PLATE"
note = "ALIAS OF T_SIDE_PLATE, collapsed 2026-10-07 - it is the same piece of steel under two names, the Y outboard plate which on Y IS the back joining plate. It had its own value of 3.175 and fed NOTHING, while T_SIDE_PLATE carried the identical nominal and fed sixteen symbols. 🔴 THE TRAP WAS WHERE THE MEASUREMENT WOULD LAND: the standing instruction to measure the delivered sheet named THIS symbol, so a caliper reading written here would have changed nothing - not the rear plate's length, not the box width, not Sheet 7's hole columns. Put the reading in T_SIDE_PLATE. Same failure as T_DOUBLER the same day: two symbols for one part, only one of them wired up. Kept rather than deleted because the prose refers to it. Its bolt-reach consequence lives in BOLT_BACK_Y and BOLT_REACH_MAX, and \u2705 THE ORDER SETTLED IT COMFORTABLY: at the ordered 10 gauge (3.429) an M8 x 10 reaches 6.571 against the 7.2 limit and clears by 0.629. This note used to say 0.24 at an 11-gauge 3.04, which was inside caliper noise and is why BOLT_BACK_Y_WASHER was specified; the washer stays, but for load spreading rather than for reach."

[[dim]]
sym = "BOLT_FRONT_STRIP"
value = 10
provenance = "derived"
note = "M8 x 10 for the front joining strip, all three beams - 42 of them, and these are the ones that must be A4 / 316 austenitic because the magnetic tape runs between their rows. M8 x 12 IS WRONG HERE: it reaches 8.0 against BOLT_REACH_MAX's 7.2 and bottoms before the head seats. \u26a0 THE x 10 IS NO LONGER COMFORTABLE AND THAT IS NEW: it was chosen against a 4 mm strip, where reach is exactly TNUT_BODY_T's 6 with 1.2 spare to the slot floor. T_FRONT_STRIP is now open between 3.175 and 4.0, and at 3.175 the reach is 6.825 - inside the limit by 0.375, which is caliper noise. \U0001f534 IF THE STOCK CALIPERS AT 1/8in, DECIDE THIS BEFORE TIGHTENING ANYTHING: an M8 x 8, or a washer under the head the way BOLT_BACK_Y_WASHER solves the identical problem on the 3.175 back plate. A washer here must be A4 / 316 as well, for the same reason the bolts are."

[[dim]]
sym = "BOLT_BACK_X"
value = 12
provenance = "derived"
note = "M8 x 12 for the X back joining plate, 6.35 mm 6061 - 28 of them. Reach 5.65, so 5.65 of the available 6 engaged and 1.55 spare to the floor. The next size up, M8 x 16, would reach 9.65 and bottom."

[[dim]]
sym = "BOLT_BACK_Y_WASHER"
value = 1.6
provenance = "nominal"
note = "A plain M8 washer under the head on the Y back plate - NOT a stiffness or clearance figure, a shim that buys margin. \u2705 THE MARGIN IT WAS BOUGHT FOR TURNED OUT NOT TO BE NEEDED, and the washer stays anyway: at the ORDERED 10 gauge (T_SIDE_PLATE 3.429) an M8 x 10 bare reaches 6.571 against the 7.2 of BOLT_REACH_MAX, clearing by 0.629 - outside caliper noise, where the old figures were not. With the washer the reach is 4.971 and 2.229 spare. \u26a0 THIS NOTE USED TO READ 'only 3.175 nominal and possibly 3.04, so M8 x 10 bare leaves 0.24-0.37', which was the whole reason for the washer and is now stale in both numbers. It is kept for the reason it was wanted anyway: it spreads load on 3.4 mm steel. 56 washers, two beams."

[[dim]]
sym = "BOLT_BACK_Y"
value = 10
provenance = "derived"
note = "M8 x 10 for the Y back plate - the outboard steel plate, 28 per beam, 56 total - WITH the washer in BOLT_BACK_Y_WASHER. Same length as the front strip's bolts, so the buy is two lengths and not three: 98 of M8 x 10 (42 A4 / 316 for the front strips, 56 plain for the Y backs) and 28 of M8 x 12 for the X back. 126 bolts against 126 T-nuts."

# ---------------------------------------------------------------- the ball screws
# His 2026-10-10, off the four screws in hand. Every axis uses the same 1605, so one
# set of symbols covers all four and only the overall length differs.

[[dim]]
sym = "SCREW_D"
value = 16
provenance = "part"
note = "Ball screw nominal diameter - the 16 in 1605. All four axes run the same screw."

[[dim]]
sym = "SCREW_LEAD"
value = 5
provenance = "part"
note = "5, the lead - how far the nut travels in one turn of the screw. It is the 05 in 1605 and in DSG1605, so it has been in every reference to the part from the start, but it was never a symbol and nothing could be drawn or computed from it. RIGHT-HAND, his 2026-10-10, which the paperwork does not state either. It is the lead and not a pitch: a 1605 is single-start, so the two happen to be the same number here, and they would not be on a multi-start screw."
source = "Vevor DSG1605 page, printed manual with the ball screw kit"

[[dim]]
sym = "SCREW_JOURNAL_D"
value = 10
provenance = "part"
note = "The bare shaft at each end, turned down from the 16 to ride in its bearing. Both ends are the same diameter; only the LENGTHS differ."

[[dim]]
sym = "SCREW_JOURNAL_BF"
value = 11
provenance = "part"
note = "Bare shaft at the BF12 end - the short one. It only has to reach through the bearing."

[[dim]]
sym = "SCREW_JOURNAL_CAST"
value = 54.5
provenance = "part"
note = "Bare shaft at the stepper casting end. Long because the coupler lives on it as well as the bearing, which is also why the casting end is the one that sets how far the screw stands off its mount."

[[dim]]
sym = "SCREW_BARE_TOTAL"
expr = "SCREW_JOURNAL_BF + SCREW_JOURNAL_CAST"
note = "Both journals together, 65.5. It is what comes off an overall length to leave thread, and it is the same on every axis."

[[dim]]
sym = "SCREW_OAL_LONG"
value = 1000
provenance = "part"
note = "Overall length of the X, Y1 and Y2 screws."

[[dim]]
sym = "SCREW_OAL_Z"
value = 400
provenance = "part"
note = "Overall length of the Z screw."

[[dim]]
sym = "SCREW_THREAD_LONG"
expr = "SCREW_OAL_LONG - SCREW_BARE_TOTAL"
note = "Threaded portion on X, Y1 and Y2 - 934.5. This, not the overall 1000, is the most the nut could ever traverse, and the travel is shorter again by the nut's own length and both stops."

[[dim]]
sym = "SCREW_THREAD_Z"
expr = "SCREW_OAL_Z - SCREW_BARE_TOTAL"
note = "Threaded portion on Z - 334.5, against a 400 rail."

[[dim]]
sym = "SCREW_AXIS_H"
value = 25
provenance = "part"
note = "Screw centreline above the seating face of whatever carries it. \u2705 CONFIRMED off the BF/BK12 spec by him, 2026-10-10: the ball screw centreline is 25 above the bottom of the block. That makes it the FIXED point in the Y height chain and puts the disagreement on the nut side - see NUT_AXIS_TO_FACE. BF12 at one end and the stepper casting at the other must both put the axis here or the screw is not straight - NUT_AXIS_TO_FACE's note already records that BK-12 and BF-12 share an h of 25, and this is that number as a symbol. It is also his 25 for the Z top stop block's bore, seen from the carriage plate, and footnote 3.8's \"25 for the casting's axis\" in the X nut chain."

[[dim]]
sym = "NUT_BODY_L"
value = 40
provenance = "part"
note = "Ball nut body along the screw, without its flange. His 2026-10-10. Numerically the same as NUT_FACE_Y's L, which is the mounting flat's length - they are different dimensions that happen to agree, the same trap NUT_FACE_Y's own note describes between L and H."

[[dim]]
sym = "NUT_FLANGE_T"
value = 14
provenance = "part"
note = "The flange bolted to the nut, measured along the screw. His 2026-10-10."

[[dim]]
sym = "NUT_OAL"
expr = "NUT_BODY_L + NUT_FLANGE_T"
note = "Ball nut overall along the screw, 54. This is the figure that eats travel at each end, not the 40."

[[dim]]
sym = "NUT_W"
value = 52
provenance = "part"
note = "Ball nut across, 52 - the same figure as NUT_FACE_X's B, which is why SOLE_BRACKET_L closes at the screw axis plus 26."

# -------------------------------------------------- BK12, the casting, and the motors
# His 2026-10-10. The cast stepper frame replaced BK12 and the M5 standoffs on the Y
# ends, but its screw end is BK12's shape, so BK12's own figures still describe it.

[[dim]]
sym = "BK12_W"
value = 60
provenance = "part"
note = "BK12 across - the same 60 as BF12 and as the beam, which is what lets SCREW_AXIS_X treat the (EXT_W / 2) term as by-construction rather than an assumption."

[[dim]]
sym = "BK12_L"
value = 30
provenance = "part"
note = "BK12 along the screw axis. BF12's equivalent is T_BF12_BLOCK at 20, so the fixed end is 10 longer than the free end."

[[dim]]
sym = "BK12_H"
value = 43
provenance = "part"
note = "43 - a real BK12\u2019s centre boss, the tallest part of it. \U0001F534 IT WAS GIVEN AS 45 FIRST AND IS 43: measured off a real BK12 and confirmed in the Vevor spec sheet, his 2026-10-10. If a 45 appears anywhere it is stale. \u2705 It is the same 43 as BF12_H, which is what two supports carrying one screw ought to come to. \u26a0 DO NOT READ IT ONTO THE CASTING: the cast stepper frame\u2019s screw end is BK12-SHAPED but its boss is CASTING_BOSS_H at 44, a millimetre over, and both figures come off real parts."

[[dim]]
sym = "CASTING_FOOTPRINT_L"
value = 77
provenance = "part"
note = "77 - the cast stepper frame's bolted footprint along the screw, front flange of the motor mount to the front edge of the casting. His calipers off the casting's underside, 2026-10-10. \U0001f534 IT WAS 72.5 AND THE 72.5 WAS WRONG, remeasured after the 3D view put an M8 flange head 0.85 from the casting's face. Sheet 3a's K1-K6 sit in it. The motor frame starts immediately after this. \u2705 ON A 150 BAR IT LEAVES 73 EXPOSED, which is what the interposer's two T-nut columns have to live in."

[[dim]]
sym = "CASTING_FOOTPRINT_W"
value = 60
provenance = "part"
note = "The casting's footprint across, matching BK12_W and the beam."

[[dim]]
sym = "CASTING_RAIL_H"
value = 30
provenance = "part"
note = "The rails that carry the motor frame off the BK12 section are 30 high. They are the open part of the casting - the model draws them as solid, which is conservative for an interference check and wrong for a photograph."

[[dim]]
sym = "MOTOR_FRAME_T"
value = 12.5
provenance = "part"
note = "The casting's NEMA 23 mounting plate, measured along the screw. It begins where CASTING_FOOTPRINT_L ends."

[[dim]]
sym = "MOTOR_FRAME_W"
value = 60
provenance = "part"
note = "The motor frame is 60 square - wider than the 56 motor it carries."

[[dim]]
sym = "MOTOR_BODY_SQ"
value = 56
provenance = "part"
note = "NEMA 23 body, square section. These are the integrated closed-loop units, so the body carries its own driver and is longer than a plain NEMA 23."

[[dim]]
sym = "MOTOR_BODY_L"
value = 94
provenance = "part"
note = "NEMA 23 body length. \u26a0 HIS FIRST FIGURE WAS 99 AND HE CORRECTED IT TO 94 the same day - if 99 appears anywhere it is stale."

[[dim]]
sym = "CASTING_OAL"
expr = "CASTING_FOOTPRINT_L + MOTOR_FRAME_T"
note = "The casting alone along the screw, 85 - footprint plus the motor plate."

[[dim]]
sym = "CASTING_PLUS_MOTOR"
expr = "CASTING_OAL + MOTOR_BODY_L"
note = "179 from the casting's leading edge to the back of the motor. This is the figure that decides whether a stepper end fouls anything, and it is why the motors are worth drawing at all - the casting on its own clears everything easily."

[[dim]]
sym = "BF12_WING_H"
value = 30
provenance = "part"
note = "30 - the height of BF12\u2019s two SIDE WINGS, the low flanges either side of the centre boss, and the only part of the block that anything bolts to. His, 2026-10-10. The four mounting holes live here, at BF12_BASE_TO_ROW1 and that plus BF12_ROW_PITCH off the base - 7 and 25 - so a 30 wing clears the upper row by 5. \u2705 THIS IS WHAT THE TONGUE HAS TO BACK, not BF12_H\u2019s 43: that 43 is the centre boss carrying the bearing and it stands above the wings touching nothing. \u26a0 An earlier version of this note had the right 30 for the wrong reason - it guessed the block \u201cmay stand proud above its top row\u201d rather than knowing it is a T-section. Same number, but one of those is checkable against the part and the other is not."

# ------------------------------------------- the T-sections, BF12 and the casting end
# Neither support is a block. Each is a tall centre boss carrying the bearing with a
# lower wing either side, and the mounting bolts go through the wings. His 2026-10-10.

[[dim]]
sym = "BF12_BOSS_W"
value = 34
provenance = "part"
note = "34 of BF12\u2019s 60.08 is the centre boss - the raised part holding the bearing. The rest is wing."

[[dim]]
sym = "BF12_WING_W"
expr = "(BF12_W - BF12_BOSS_W) / 2"
note = "13.04 of wing either side of the boss, which is where the four mounting bolts go. Derived rather than measured because BF12_W is a caliper figure with a decimal and the boss is a round 34."

[[dim]]
sym = "CASTING_BOLT_ROW_1"
value = 28
provenance = "measured"
note = "28 - the first of the cast stepper frame's three mounting rows, measured from its MOTOR END. Sheet 6's C1 and C4. \U0001f534 THE TWO SHEETS DISAGREED AND SHEET 6 WON - his, 2026-10-10. Sheet 3a drew this pattern 4.5 further toward the motor, which is exactly what CASTING_FOOTPRINT_L moved when the casting was remeasured at 77, so 3a was laid out on the old 72.5 and never corrected. Its K1-K6 come DOWN 4.5. \u2705 THE SAME SIX HOLES SERVE ALL FOUR PLATES - both Y bars, the X bar and the carriage plate - so they are a property of the casting and belong here rather than on a sheet. The columns are BF12_COL_INB and _OUTB, the same 7 and 53."
source = "shop-pack Sheet 6, confirmed by him 2026-10-10"

[[dim]]
sym = "CASTING_BOLT_ROW_2"
value = 58
provenance = "measured"
note = "58 - the second row, Sheet 6's C2 and C5. \U0001f534 THE TWO SHEETS DISAGREED AND SHEET 6 WON - his, 2026-10-10. Sheet 3a drew this pattern 4.5 further toward the motor, which is exactly what CASTING_FOOTPRINT_L moved when the casting was remeasured at 77, so 3a was laid out on the old 72.5 and never corrected. Its K1-K6 come DOWN 4.5. \u2705 THE SAME SIX HOLES SERVE ALL FOUR PLATES - both Y bars, the X bar and the carriage plate - so they are a property of the casting and belong here rather than on a sheet. The columns are BF12_COL_INB and _OUTB, the same 7 and 53."
source = "shop-pack Sheet 6, confirmed by him 2026-10-10"

[[dim]]
sym = "CASTING_BOLT_ROW_3"
value = 71
provenance = "measured"
note = "71 - the third row, Sheet 6's C3 and C6, nearest the bearing end. It sits 6 inside the casting's CASTING_FOOTPRINT_L of 77. \U0001f534 THE TWO SHEETS DISAGREED AND SHEET 6 WON - his, 2026-10-10. Sheet 3a drew this pattern 4.5 further toward the motor, which is exactly what CASTING_FOOTPRINT_L moved when the casting was remeasured at 77, so 3a was laid out on the old 72.5 and never corrected. Its K1-K6 come DOWN 4.5. \u2705 THE SAME SIX HOLES SERVE ALL FOUR PLATES - both Y bars, the X bar and the carriage plate - so they are a property of the casting and belong here rather than on a sheet. The columns are BF12_COL_INB and _OUTB, the same 7 and 53."
source = "shop-pack Sheet 6, confirmed by him 2026-10-10"

[[dim]]
sym = "CASTING_BOSS_W"
value = 34
provenance = "part"
note = "34 of the casting end\u2019s 60 is centre boss - the same 34 as BF12, which is what one would expect of two supports made to carry the same screw."

[[dim]]
sym = "CASTING_BOSS_H"
value = 44
provenance = "part"
note = "44 - the cast stepper frame\u2019s centre boss, measured off the casting. \u2705 RESOLVED 2026-10-10 AND IT IS NOT AN ERROR: a real BK12\u2019s boss is BK12_H at 43, off the part and off the Vevor sheet, and the casting genuinely stands a millimetre taller. Its screw end is BK12-SHAPED, not a BK12. Both numbers come off real parts, so neither gets rounded to the other."

[[dim]]
sym = "CASTING_WING_H"
value = 37
provenance = "part"
note = "37 - the casting end\u2019s side sections, where its mounting bolts go. \u2705 IT IS NOT BF12_WING_H\u2019s 30, and that is fine rather than a conflict: the two supports are different parts and only their BORE height has to match, which SCREW_AXIS_H holds at 25 for both."

[[dim]]
sym = "CASTING_WING_W"
expr = "(CASTING_FOOTPRINT_W - CASTING_BOSS_W) / 2"
note = "13 of wing either side of the casting end\u2019s boss."

[[dim]]
sym = "Y_SCREW_BELOW_BEAM"
expr = "T_INTERPOSER + SCREW_AXIS_H"
note = "35 - the Y screw centreline below the Y beam's underside, and HIS FIGURE STATED DIRECTLY on 2026-10-10: ten of interposer, twenty-five to the bore. It exists as a symbol because it had been an assembly three symbols deep that nobody could check - the registry held SCREW_AXIS_X and X_SCREW_AXIS and nothing at all for Y's height, so a disagreement of 8 between this and the ball nut chain went unnoticed until the 3D model needed to place a screw. A number the model needs and the registry cannot state is a gap whether or not it is wrong."

[[dim]]
sym = "XEP_CUT"
value = 235
provenance = "part"
note = "235 - what the X gantry end plate is actually CUT to, as drawn on Sheet 2a, out of a 300 piece. \U0001F534 IT WAS 242.5 AND THE 7.5 WAS NOT SPARE METAL AFTER ALL - his, 2026-10-10. The plate is cut AT the floor, so its bottom edge IS the Y ball nut\u2019s mounting plane and the sole bracket can bolt into the plate\u2019s and the doubler\u2019s END FACES, which is what Sheet 5 has always drawn. Cut 7.5 long, the bracket either misses the nut or its rows R1-R8 miss the metal. \u2705 THE SHELF BOLTS SAY THE SAME THING INDEPENDENTLY: SHELF_BOLT_LOW_X puts Sheet 2a\u2019s H1 at 79.2 up from the plate\u2019s bottom edge and SHELF_BOLT_LOW_Z puts that same bolt at machine Z -95.8, and those two only meet with the bottom edge on the nut plane. \U0001F534 IT IS A SEPARATE SYMBOL FROM XEP_H ON PURPOSE. XEP_H is the floor the plate has to reach and it moves whenever the nut or the interposer moves; the cut is a decision about a piece of metal and should only move when somebody decides to cut differently. Keeping one symbol for both meant the sheet quietly disagreed with the registry twice - by 0.5 when T_INTERPOSER went 9.525 to 10, and by 8 more when NUT_FACE_BELOW_BEAM was rebuilt on the screw axis. \u26a0 IF THIS EVER DROPS BELOW XEP_H the plate no longer reaches the nut face, and nothing checks that automatically yet."

# ------------------------------------------------- the tongue bolt's outboard end
# The washer and the nut on the far side of every plywood tongue. Standard M8
# hardware, NOT measured - they are here so the 3D model can draw the joint, and
# they are the only two figures in that joint that nobody has put a caliper on.

[[dim]]
sym = "FENDER_WASHER_D"
value = 25
provenance = "nominal"
note = "M8 fender washer, outside diameter. \u26a0 A CATALOGUE FIGURE AND NOT HIS - caliper the washers actually bought. It spreads the clamp into 19 mm plywood, so the diameter is the whole point of choosing a fender over a plain washer; a plain M8 washer is about 16 and would be most of the way to pulling through."

[[dim]]
sym = "FENDER_WASHER_T"
value = 2
provenance = "nominal"
note = "M8 fender washer thickness. \u26a0 CATALOGUE, NOT MEASURED. It is a term in the bolt length: it sits between the tongue and the acorn nut, so it eats 2 of the thread that would otherwise reach the nut. Sheet 7's footnote 7.9 already says to measure the washer actually in hand before buying a box of bolts."

[[dim]]
sym = "ACORN_NUT_D"
value = 15
provenance = "nominal"
note = "M8 acorn nut across the corners - 13 across the flats, about 15 across the points. \u26a0 CATALOGUE, NOT MEASURED. Drawn round in the model because a hexagon buys nothing at this scale."

[[dim]]
sym = "ACORN_NUT_H"
value = 13
provenance = "nominal"
note = "M8 acorn nut overall height. \u26a0 CATALOGUE, NOT MEASURED, AND IT IS THE ONE THAT MATTERS: the nut is CLOSED, so how deep its thread runs decides whether an M8 x 35 bottoms out before it clamps. That depth is the open question on Sheet 7's footnote 7.9 and this overall height is not a substitute for it."

[[dim]]
sym = "TT_BED_T"
value = 16
provenance = "part"
note = "16 - the aluminium tee track plate's thickness, and the whole height of the bed that bears on the box. \U0001F534 IT WAS CARRIED AT 20 FOR ONE COMMIT AND THAT WAS WRONG - his correction 2026-10-11, given with the rest of the profile when the slots were asked for. The 20 came from his first description of the Mega V stack; the plate is 16 and THE PROFILE IS NON-STANDARD, so no catalog figure substitutes for his. The 4 it moved comes straight off the bed's top, so the MDF above makes it up - see machine/spoilboard.md. \U0001F534 ON THIS MACHINE THE PLATES BED DIRECTLY ON THE TOP SKIN: the Mega V carried them on three 2040 extrusions laid flat at 500 mm centres, which is why that board springs under the cutter, and the 2040s do not come across. See machine/spoilboard.md."

[[dim]]
sym = "TT_BED_PLATE_W"
value = 250
provenance = "part"
note = "250 - one tee track plate across its width. Four of them make up the bed. His, 2026-10-11."

[[dim]]
sym = "TT_BED_PLATES"
value = 4
provenance = "part"
note = "Four tee track plates, carried over from the Mega V addon. His, 2026-10-11."

[[dim]]
sym = "TT_BED_L"
value = 1193.8
provenance = "part"
note = "47in - the tee track sections' actual length, running ACROSS the machine. His, 2026-10-11, and he confirmed the axis when the shortfall below was raised. It is SHORTER than the span it fits into, so there is nothing to cut off - see TT_BED_SPACER."

[[dim]]
sym = "TT_BED_CLEAR"
expr = "MACHINE_OUTER_W - (2 * T_SIDE_PLATE)"
note = "1204.38 - the clear span between the two side plates' INSIDE faces, which is what the bed fits into. The same figure BOX_W's note names as 'the space INSIDE the side plates'. \u26A0 IT IS NOT BOX_W: the plates stand ON the skin and the tongues lap them from outboard, so the box is the full outer envelope and the bed only gets what is between the plates."

[[dim]]
sym = "TT_BED_SPACER"
expr = "(TT_BED_CLEAR - TT_BED_L) / 2"
note = "5.29 - THE GAP AT EACH END OF THE BED, not a part to obtain. \U0001F534 IT WAS WORDED AS A SPACER THICKNESS AND THAT IS HOW A 5.29 FLAT BAR GETS ORDERED, which does not exist - his point, 2026-10-11. \u2705 TAKEN UP BY ONE 5 mm M5-BORE ALUMINIUM SPACER PER SCREW - his, 2026-10-11, and he can buy them, which is what settled it over the washer stack considered first. The standoff only has to keep the bolt from drawing the side plate inward as it tightens, so it needs AXIAL STIFFNESS UNDER THE HEAD and nothing else - no fit and no thickness to hit. TT_BED_FLOAT is what the 5 leaves. The bed carries no hold-down duty either: it beds flat on the top skin and gravity holds it, so these bolts only stop it walking. \u26A0 NOTHING SHOULD DERIVE A PART SIZE FROM THIS - it is a clearance, and the only thing it must not be is negative."

[[dim]]
sym = "TT_BED_FORE_AFT"
expr = "TT_BED_PLATE_W * TT_BED_PLATES"
note = "1000 - the bed front to back, four 250 plates side by side. \U0001F4CC It lands on exactly SIDE_TONGUE_L, so the bed's run and the Y beam's run are the same 1000, which is the cross-check that the placement below is not arbitrary."

[[dim]]
sym = "TT_BED_Y0"
expr = "T_REAR_PLATE"
note = "6.35 - the bed's back edge, butted against the REAR PLATE'S FRONT FACE. \u2705 IT IS NOT A CHOICE AND IT IS NOT A PLACEHOLDER, which is what this note said for one commit: the clear run between the rear plate's front face at 6.35 and the front fin's back face at 1006.35 is exactly BEAM_LEN, 1000, and TT_BED_FORE_AFT is exactly 1000, so the bed is CAPTURED fore-aft the same way TT_BED_CLEAR captures it across. His, 2026-10-11, and he is right - there was never a degree of freedom here to pick. TT_BED_FORE_AFT_CHECK holds it closed. \U0001F534 KEYED TO THE REAR PLATE RATHER THAN TO SIDE_TONGUE_START, which is the same 6.35 by coincidence of both deriving from T_REAR_PLATE: the bed butts the PLATE, not the tongue, and a tongue that moved would otherwise drag the bed with it."

[[dim]]
sym = "TT_SLOT_W"
value = 8
provenance = "part"
note = "8 - the tee slot's opening across the plate. His, 2026-10-11. \u26A0 IT IS THE OPENING ONLY: the slot's undercut below the top face and its depth into the 16 are not figures he has given, and nothing in this registry infers them."

[[dim]]
sym = "TT_SLOTS"
value = 8
provenance = "part"
note = "Eight tee slots across each plate's 250, running the full 47in length. His, 2026-10-11."

[[dim]]
sym = "TT_END_FLAT"
value = 16
provenance = "part"
note = "16 of flat at each edge of the plate, outboard of the first and last slot. His breakdown, 2026-10-11."

[[dim]]
sym = "TT_MID_FLAT"
value = 22
provenance = "part"
note = "22 of flat between adjacent slots, seven of them. His breakdown, 2026-10-11."

[[dim]]
sym = "TT_SLOT_PITCH"
expr = "TT_MID_FLAT + TT_SLOT_W"
note = "30 - slot centre to slot centre. \U0001F534 IT IS NOT 40, AND 40 IS WHAT WAS FIRST RECORDED. He gave the pitch as 40 on 2026-10-11 and eight at 40 needs 280 of span across a 250 plate, which is what sent the question back; his own breakdown then closed the 250 exactly and makes the pitch 30. DERIVED FROM THE FLATS RATHER THAN STATED, because the flats are what he measured and a stated pitch is what went wrong."

[[dim]]
sym = "TT_PLATE_W_CHECK"
expr = "(2 * TT_END_FLAT) + ((TT_SLOTS - 1) * TT_MID_FLAT) + (TT_SLOTS * TT_SLOT_W)"
note = "250 - his breakdown of the plate's depth, summed: 2 x 16 end flats, 7 x 22 inner flats, 8 x 8 slots. \u2705 IT EXISTS ONLY TO CLOSE ON TT_BED_PLATE_W, and it does, exactly. That is the check the first set of slot figures failed."

[[dim]]
sym = "TT_BED_FORE_AFT_CHECK"
expr = "BEAM_LEN - TT_BED_FORE_AFT"
note = "0 - the slack the bed has fore-aft, and there is none. The clear run from the rear plate's front face to the front fin's back face is BEAM_LEN; four 250 plates are 1000; the difference is zero, so the bed is captured front to back. \u2705 THIS SYMBOL EXISTS BECAUSE THE PLACEMENT WAS BRIEFLY RECORDED AS A FREE CHOICE and it is not one - his correction 2026-10-11. If either number ever moves this goes non-zero and says so."

[[dim]]
sym = "TT_BED_END_BOLT"
value = 5
provenance = "measured"
note = "M5 - the screws into the tee track sections' ends, TWO PER END. \u2705 HE DRILLED AND TAPPED THEM 2026-10-11, so this is a finished hole and not a plan: 4.2 drill, M5 tap, TT_BED_END_ENGAGE of thread. \U0001F534 M4 WAS RECOMMENDED AND M4 WAS WRONG. The Mega V used two M4 SELF-TAPPING screws per end - not machine screws in a tapped hole, which this file called them until he corrected it - and the advice was to drill 3.3 and tap M4 on the reasoning that three in-and-out cycles is light duty. His measurement killed it: A 3.3 DRILL ENTERED THE EXISTING HOLE WITH NO RESISTANCE, so the hole was already at or above the M4 tapping size and an M4 tap would have had almost nothing to cut. THE CYCLE COUNT WAS THE WRONG THING TO JUDGE IT ON; the hole size was, and it was measurable all along."

[[dim]]
sym = "TT_BED_SPACER_PART"
value = 5
provenance = "part"
note = "5 - the aluminium spacer, one per screw, and it is an M5 BORE now that the ends are tapped M5 - it was specified M4 before the holes were drilled out. His, 2026-10-11. \U0001F534 THE PART IS 5 AND THE GAP IS TT_BED_SPACER'S 5.29 - they are different numbers on purpose, and the difference is TT_BED_FLOAT. Do not 'correct' either to match the other."

[[dim]]
sym = "TT_BED_FLOAT"
expr = "TT_BED_SPACER - TT_BED_SPACER_PART"
note = "0.29 per end, 0.58 across the bed - how far the bed can shift before a spacer touches. \u2705 IT DOES NOT MATTER AND THAT IS THE POINT OF RECORDING IT: the aluminium is not a reference surface, the MDF above it is surfaced in place by the machine, and nothing is laid out from the bed's position. A number small enough to ignore is still worth naming, so that nobody later reads the 0.29 as an error to chase."

[[dim]]
sym = "TT_BED_END_SCREWS_PER_END"
value = 2
provenance = "part"
note = "Two M4 self-tapping screws into each end of each 250 panel - the Mega V's own arrangement, carried over. His, 2026-10-11."

[[dim]]
sym = "TT_BED_END_SCREWS"
expr = "TT_BED_END_SCREWS_PER_END * 2 * TT_BED_PLATES"
note = "16 screws holding the bed against walking - two per end, both ends, four panels, so EIGHT THROUGH EACH SIDE PLATE. That is the hole count the side plate has to carry at bed height, and the reason to know it is the side plate's drilling rather than the bed's."

[[dim]]
sym = "TT_BED_SCREW_STACK"
expr = "T_SIDE_PLATE + TT_BED_SPACER_PART"
note = "8.429 - what each screw passes through before it reaches aluminium: the 3.429 side plate plus the 5 spacer. \u2705 THE MEGA V SCREWS DO NOT CARRY OVER AT ALL - they were self-tappers and the ends are now tapped M5 - so the length comes from this plus the engagement wanted, which is TT_BED_END_SCREW_L. On the Mega V the panel end lands against the frame with neither the plate nor the spacer in the way, which is why nothing in that drawer is long enough."

[[dim]]
sym = "TT_BED_END_ENGAGE"
value = 15
provenance = "measured"
note = "15 of M5 thread in each panel end - his, 2026-10-11, measured off the tapped hole. \u2705 IT WAS BRIEFLY RECORDED AS 10, which was his first figure before he put a gauge in it; the 15 is the tested depth and is the one to use. \u2705 THAT IS 3 x D AND IT CLOSES THE LAST WORRY ABOUT THIS JOINT: the question asked was the wall thickness at the panel end, because a thin web would have left 2-3 mm, and 15 says the screw goes into real depth rather than through a skin. These screws only stop the bed walking, so 3 x D is far more than the duty - but it is measured, and the earlier concern was not. \U0001F4CC THE 5 IT MOVED IS WHAT MAKES AN M5 x 20 THE RIGHT PART instead of an 18 - see TT_BED_END_SCREW_L."

[[dim]]
sym = "TT_BED_END_SCREW_L"
expr = "TT_BED_SCREW_STACK + TT_BED_END_ENGAGE"
note = "23.43 - the M5 screw length that would use the whole tapped depth: 3.429 side plate + 5 spacer + 15 of thread. \u2705 BUY M5 x 20. It reaches 11.57 into a hole tapped 15, which clamps with 3.4 of hole to spare. \u26A0 DO NOT BUY 25 - it wants 16.57 and would bottom out 1.57 short of clamping, FEELING tight while holding nothing. \U0001F534 AN 18 WAS THE ANSWER UNTIL THE DEPTH WAS GAUGED: on the first figure of 10 a 20 was the part that would have bottomed, and the two recommendations are opposite. THAT IS WHY THIS SYMBOL IS NOT THE PART NUMBER - it is the ceiling, the bought screw sits under it, and the depth it depends on is measured rather than assumed."

[[dim]]
sym = "TT_BED_END_HOLE_Z"
value = 4
provenance = "measured"
note = "4 - the M5 hole centre in the panel end, above the torsion box's top skin. His, 2026-10-11. \U0001F534 IT IS WHAT MAKES THE SPACER A CLEARANCE PROBLEM: an 8 OD spacer has a 4 radius, so its bottom edge lands exactly ON the skin. See TT_BED_SPACER_CLEAR."

[[dim]]
sym = "TT_BED_SPACER_OD"
value = 8
provenance = "part"
note = "8 - the stainless spacer's outside diameter, the one he is ordering to test. His, 2026-10-11."

[[dim]]
sym = "TT_BED_SPACER_ID"
value = 5.1
provenance = "part"
note = "5.1 - the spacer's bore, 0.1 over the M5 screw. His, 2026-10-11. Stainless."

[[dim]]
sym = "TT_BED_SPACER_CLEAR"
expr = "TT_BED_END_HOLE_Z - (TT_BED_SPACER_OD / 2)"
note = "\U0001F534 ZERO. The spacer's bottom edge is TANGENT to the top skin - 4 of hole centre against a 4 radius - and that is a coincidence rather than a fit. \u26A0 IT FAILS IN THE DIRECTION THAT MATTERS: if anything goes the wrong way by a tenth the spacer rides ON the skin and LIFTS THE PANEL END OFF ITS BEDDING, which gives back the continuous support that dropping the 2040s was for. Things that can go the wrong way: the hole centre on panels he did not drill, spacer OD tolerance, glue squeeze-out or a proud veneer patch, and the skin not being flat under a 1193.8 panel. \u2705 HE IS ORDERING SPACERS TO TEST THE FIT, 2026-10-11 - UNVERIFIED UNTIL A REAL ONE IS OFFERED UP TO A REAL PANEL. \u26A0 IT CANNOT BE MARKED provenance OPEN because it has an expr, and dims.py rightly forbids that pair - the ARITHMETIC is certain and it is the CONSEQUENCE that is open, so machine/spoilboard.md carries the open item and this note carries the warning. IF IT FOULS, the fix is to RELIEVE THE SKIN and not the spacer: sixteen scallops about 10 across and 1.5 deep, one under each screw, marked off the panels at assembly. A relief in the skin cannot lift the panel; a filed spacer or a thinner one both can. A 6 OD spacer would give 1 of clearance on a 0.45 stainless wall, which these no-load screws would carry, but it depends on sourcing a part where the relief does not."

[[dim]]
sym = "T_BB_RIB"
value = 19
provenance = "nominal"
note = "19 - the egg-crate ribs, and they STAY 19 even though going to a 25 top skin leaves surplus 25 stock. \U0001F534 ASKED AND ANSWERED 2026-10-11. The skins are the flanges and carry the bending moment; THE RIBS CARRY SHEAR, and 19 of Baltic birch is far past what the shear demands - which is the same reason torsion-box.md calls rib HEIGHT the lever and skin material the weak one. \u26A0 AND THE TRADE RUNS BACKWARDS: thicker ribs DISPLACE SAND, and sand is about 1.5 g/cc against plywood's 0.68, so swapping rib volume for sand volume REDUCES total mass - paying plywood to remove ballast, on a box where mass is wanted for damping. \u2705 THE SURPLUS 25 GOES TO THE BACK EDGE instead, which torsion-box.md names as the thing that deserves material: a beam supported at its midpoint carrying both back corners, which cannot be propped. The walls and tongues are the next best homes for it."

[[dim]]
sym = "T_BOX_WALL_WEB"
value = 19
provenance = "nominal"
note = "19 - the INNER wall lamination, the web that sits between the two skins. It stays 19 while the outer lamination went to 25 on 2026-10-11, because it is effectively a PERIMETER RIB and carries shear - the same argument that keeps T_BB_RIB at 19. Nothing bolts through it: the plates bolt through the OUTER lamination, which is T_BOX_TONGUE. \u26A0 NOMINAL - caliper the sheet."

[[dim]]
sym = "T_BOX_WALL"
expr = "T_BOX_TONGUE + T_BOX_WALL_WEB"
note = "44 - the outer wall's full thickness, both laminations. \U0001F534 IT WAS 38 ON TWO EQUAL 19s and it is 44 since the outer lamination went to 25 on 2026-10-11 - if 38 appears in the prose as a wall thickness it is stale. The two laminations are summed separately BECAUSE THEY ARE NO LONGER THE SAME, the same reason BOX_THK stopped doubling one skin symbol. \u2705 The 6 it grew is all OUTBOARD: the plates sit on the top skin and the tongue laps them from outside, so the box's outer envelope grows and nothing inside the machine moves."
