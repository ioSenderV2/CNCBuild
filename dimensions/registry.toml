note = "164. 🔴 EVERY HOLE ON THIS PLATE IS NOW A WHOLE MILLIMETRE - all 28 of them - and that only works at 164. It briefly went to 165 to chase the C-hole columns, on the belief that the rail pitch was 115; the pitch is 114 (see Z_RAIL_COL), which puts the block bolt columns on whole offsets and makes an EVEN width the one that works. At 165 the nut and clamp holes land on half millimetres instead. The width was 154 before that, and 164 because on 154 the outer M5 counterbore broke through the edge by 1.5; at 164 it clears by 4.55 on the measured 8.9 bit."

[[dim]]
sym = "Z_M5_ROW_OFF_1"
value = -59.2
provenance = "measured"
note = "First M5 row from the Z plate's centre. Measured on the X/Y kit 2026-09-30; the four rows are -59.2, -23.2, +20.8, +56.8, which is 36 / 44 / 36 - two blocks per spacer at a 36 pitch with 44 between them."

[[dim]]
sym = "Z_M5_ROW_OFF_3"
value = 20.8
provenance = "measured"
note = "Third M5 row from the plate's centre, the first on the second block. Same measurement as Z_M5_ROW_OFF_1."

[[dim]]
sym = "Z_BLOCK_GROUP_SHIFT"
value = 0
provenance = "derived"
note = "0 - 🔴 RETIRED. It was 0.3, a deliberate slide of the block group to force the C-hole rows onto whole millimetres, and it existed only because the rows were being built from four loose measurements that were not symmetric. Deriving them from Z_BLOCK_CENTRE_SEP instead makes the pattern symmetric about the plate and the rows come out whole on their own. Kept at zero rather than deleted because the prose refers to it."

[[dim]]
sym = "BLOCK_BODY_L"
expr = "BLOCK_BUTTED / 2"
note = "77.09, one HGH20 block along the rail - half the measured butted pair. 🔴 TRUST THIS OVER THE ROW MEASUREMENTS. Z_M5_ROW_OFF_1 and _3 imply the two block centres sit 80 apart when butted, which contradicts this by 2.91, and BLOCK_BUTTED is one direct reading of the pair where the rows are four separate readings. Same looseness the Y block rows already carry a warning about."

[[dim]]
sym = "Z_BLOCK_CENTRE_SEP"
value = 87
provenance = "derived"
note = "87, the two Z block centres apart - CHOSEN, and the one number this whole pattern hangs on. It puts the four bolt rows on 26 / 62 / 113 / 149, all whole and symmetric about the plate, which is why the group shift that used to sit here is gone. 🔴 DO NOT SPECIFY THE GAP, SPECIFY THESE ROWS. The gap is not something you set - it is what happens when the blocks are bolted to rows that are already drilled."

[[dim]]
sym = "Z_BLOCK_GAP"
expr = "Z_BLOCK_CENTRE_SEP - BLOCK_BODY_L"
note = "9.91, the clear gap between the two block bodies. 🔴 THE GAP IS THE WHOLE REASON THE BLOCKS ARE SPREAD AT ALL - his, 2026-10-08: a 4 mm hex driver passes through the Z plate and the spacer into this gap to reach a rail bolt beneath, so the Z plate, spacers, blocks and rails can be built as one sub-assembly and then bolted to the X carriage plate by fastening the rails last. At 9.91 a 4 mm shaft has 2.96 mm of slop, which is the difference between a job and a fight. It costs 9.91 mm of Z travel, and the blocks were butted before precisely to spend none."

[[dim]]
sym = "Z_TRAVEL"
expr = "Z_RAIL_L - BLOCK_BUTTED - Z_BLOCK_GAP"
note = "235.91 mm of Z travel, down from the 245.82 the butted blocks gave. Every millimetre of gap is a millimetre of travel - that is the honest trade and z-carriage.md already said so in the other direction."

[[dim]]
sym = "Z_M5_X_1"
expr = "(Z_PLATE_L / 2) - (Z_BLOCK_CENTRE_SEP / 2) - (BLOCK_PITCH_Y / 2)"
note = "26. Sheet 4's C-holes, first row, X from the plate's installed bottom. Row 2 is this plus BLOCK_PITCH_Y. DERIVED from the block separation now, where it used to be a measured row offset plus a 0.3 fudge to force a whole number - the fudge is gone because a symmetric pattern does not need one."

[[dim]]
sym = "Z_M5_X_3"
expr = "(Z_PLATE_L / 2) + (Z_BLOCK_CENTRE_SEP / 2) - (BLOCK_PITCH_Y / 2)"
note = "113, the third C-hole row. Row 4 is this plus BLOCK_PITCH_Y, so 149."

[[dim]]
sym = "Z_M5_COL_INB"
expr = "Z_RAIL_COL - BLOCK_BOLT_HALF_X"
note = "41, the inboard M5 column. Same derivation, previously a measured 41.5."

[[dim]]
sym = "Z_M5_COL_OUTB"
expr = "Z_RAIL_COL + BLOCK_BOLT_HALF_X"
note = "73, the outboard M5 column from the plate centre. DERIVED now, from the rail column plus half the block's own bolt pitch - it had been a measured 73.5, which carried the old 57.5 rail column with it. This is the hole whose counterbore forced the width off 154."

[[dim]]
sym = "Z_M5_Y_1"
expr = "(Z_PLATE_W / 2) - Z_M5_COL_OUTB"
note = "Sheet 4's C-holes, first column in plate coordinates - 9 on the 165 width, and whole only because the width is odd. The next is this plus BLOCK_PITCH_X."

[[dim]]
sym = "Z_M5_Y_3"
expr = "(Z_PLATE_W / 2) + Z_M5_COL_INB"
note = "Third C-hole column, 124. The fourth is this plus BLOCK_PITCH_X."

# ------------------------------------ the Z plate / ball nut standoff, measured 2026-10-08

[[dim]]
sym = "SPACER_TOP_Z"
value = 46.6
provenance = "measured"
note = "46.6, the spacers' top face above the X carriage plate - his, 2026-10-08. This is the plane the Z plate lands on, set by the rails and the bearing blocks, which are the precision reference in this stack."

[[dim]]
sym = "NUT_TOP_Z"
value = 45.3
provenance = "measured"
note = "45.3, the Z ball nut's top face above the X carriage plate - his, 2026-10-08. It sits BELOW the spacers, so the Z plate laid on the spacers stands off the nut rather than touching it. \u2705 IT CROSS-CHECKS THE TWO CONSTANTS THAT CAUSED ALL THE TROUBLE, from a third direction. The Z axis has no interposer, so geometry puts this face at SCREW_AXIS_H + NUT_AXIS_TO_FACE = 25 + 20 = 45, and the caliper says 45.3. His 2026-10-10 statement of 45 for Z and 55 for the beams - the same stack plus the interposer - is what made the comparison. Two constants arrived at off a BF12 and off a nut page, checked against a measurement on a different axis, landing within three tenths. \u26a0 DO NOT ROUND THIS TO 45: it is measured, and NUT_STANDOFF_STEP subtracts it from a measured SPACER_TOP_Z to get 1.3, which is a tenths-level chain feeding the shim. The 0.3 earns its place."

[[dim]]
sym = "NUT_STANDOFF_STEP"
expr = "SPACER_TOP_Z - NUT_TOP_Z"
note = "1.3, the gap between the Z plate's back face and the ball nut's mounting face once the plate is down on the spacers. 🔴 IT MUST BE CLOSED WITH METAL, NOT BY TIGHTENING. The nut is captive on the screw, so pulling those four M5 across an open gap does not draw the plate down - it drags the NUT off the screw axis and holds it there for the whole travel, which is a constant side load. Even 0.3 across the nut's 40 mm bolt span is 0.43 degrees of tilt on a part that wants coplanarity in hundredths. Closed as SPACER_SKIM plus NUT_SHIM. ⚠ It is a difference of two readings against a common reference, so the errors add - call it two tenths, which is already too much to settle with an irreversible cut."

[[dim]]
sym = "NUT_SHIM"
expr = "NUT_STANDOFF_STEP - SPACER_SKIM"
note = "0.3 NOMINAL, and the real one is measured on the assembled stack - feeler-gauge the gap at the nut with the plate already tight on the spacers and blocks, then shim to what you read. Solid shim, steel or brass, which comes in 0.05 steps and so resolves the joint far finer than the step could be measured beforehand. 🔴 THE FOUR M5 CLEARANCE HOLES ALREADY GIVE THE NUT THE FLOAT IT NEEDS - 0.5 radial at Z_HOLE_D - so it self-centres on the screw as it is tightened. The only thing missing was the standoff, and that is all this shim sets: free where it needs to float, rigid where it drives. ⚠ The shim adds to the grip length of those four bolts, so it comes off their engagement into the nut."

# ------------------------------------ the Z carriage bolt stack, settled 2026-10-08
# Sixteen M5 cross the Z plate, the spacer and thread into the bearing block. Every term below
# was measured or read off a spec sheet on 2026-10-08 - the joint had been carried on a nominal
# plate, a caliper-measured spacer and an unchecked assumption about the block's tapped depth.

[[dim]]
sym = "BLOCK_HOLE_DEPTH"
value = 8.7
provenance = "measured"
note = "8.7, the drilled depth of the bearing block's M5 holes - his, 2026-10-08, against 8 of thread. 🔴 0.7 OF CHIP SPACE, SO THERE IS NOTHING TO TAP INTO. The block's 8 really is a hard ceiling, unlike the nut housing's - and it does not matter, because the block is STEEL and 5.8 mm is 1.16 x D there. Two joints that read identically on paper - M5 into an 8 mm thread - and completely different problems, because of what they are cut in."

[[dim]]
sym = "BLOCK_TAP_DEPTH"
value = 6
provenance = "vendor"
note = "6 - the M5 THREAD depth in an HGH20 block, from the Vevor block page's Mxl column, which reads M5x6. 🔴 IT WAS CARRIED AS 8 AND THAT WAS THE WRONG COLUMN. The 8 is T, the hole depth, and a measured BLOCK_HOLE_DEPTH of 8.7 agreed with it - which is exactly why the error survived: the number checked out against the part, just not against the right feature. ⚠ IT TIGHTENS THE Z BOLT WINDOW HARD. Z_BOLT_ENGAGE is 5.8 against a 6 mm cap, so 0.2 of margin, and the faced spacer must land between 15.0 and 16.0 - thinner and the bolt jams where the thread stops, reading tight while the joint stays loose; thicker and engagement drops under 1 x D. If the faced pair falls outside that, MOVE Z_CBORE_WEB, which is what it is there for. ⚠ The nut housing is a different part with a different answer - see NUT_TAP_DEPTH."

[[dim]]
sym = "M5_HEAD_D"
value = 8.48
provenance = "measured"
note = "8.48, the socket head cap diameter on the M5 he is actually using - his calipers 2026-10-08, not the 8.5 nominal. An 8.9 counterbore leaves 0.21 radial clearance on it."

[[dim]]
sym = "M5_HEAD_H"
value = 5
provenance = "measured"
note = "5, head height on the same bolts. The counterbore has to beat this or the head stands proud."

[[dim]]
sym = "Z_CBORE_D"
value = 8.9
provenance = "part"
note = "8.9, the counterbore bit's bore - a piloted 5.2 x 8.9. The pilot size is why the drilling order is forced; see Z_PILOT_D."

[[dim]]
sym = "Z_PILOT_D"
value = 5.2
provenance = "part"
note = "5.2, the counterbore's pilot, and therefore the size the hole must be WHILE IT IS COUNTERBORED. 🔴 THE ORDER IS FORCED AND IT IS A ONE-WAY DOOR: drill 5.2, counterbore, THEN open to Z_HOLE_D. Open it first and the pilot has nothing to steer on; open it before the depth is proven and the pilot no longer fits, so there is no second attempt at the counterbore."

[[dim]]
sym = "Z_HOLE_D"
value = 6
provenance = "derived"
note = "6, the final clearance hole. It is opened from Z_PILOT_D with an END MILL and not a reamer - a reamer takes 0.1 to 0.3 and follows the hole it is given, so it can neither remove 0.8 nor move a hole. ⚠ IT MATCHES THE SPACERS, WHICH ARE ALREADY MADE WITH 6 mm CLEARANCE - his, 2026-10-08 - so this does not add float to the stack, it removes a step: the plate was the tight layer at 5.2 while the spacer beneath it was already 6. The cost is head bearing area, 35.2 mm2 down to 28.2, which takes the bearing stress under the head from about 59% to about 73% of 6061-T6 yield at a typical M5 8.8 preload. ESTIMATES, not spec - but the aluminium is the weak member in this joint, not the bolt, so do not torque these to what the fastener would take."

[[dim]]
sym = "Z_CBORE_WEB"
value = 4
provenance = "derived"
note = "4, the plate material left UNDER the head. 🔴 THE COUNTERBORE IS SPECIFIED AS A WEB AND NOT AS A DEPTH, which is the whole point: engagement is bolt minus web minus spacer, so a web target gives the same engagement whatever the plate turns out to measure. A depth dialled from the face does not - T_Z_PLATE is still an unmeasured nominal and the half-inch stock the X end plates came from measured 12.19, a 0.5 swing that is larger than the whole engagement budget. Same thinking as referencing every standing plate from its bottom edge, one layer down. Caliper the plate, subtract this, dial that depth."

[[dim]]
sym = "Z_CBORE_DEPTH"
expr = "T_Z_PLATE - Z_CBORE_WEB"
note = "8.7 on the nominal plate, 8.19 if it is really 12.19. DERIVED, so it re-derives when the plate is finally caliper'ed - which is the reason Z_CBORE_WEB is the input and this is the output. It clears M5_HEAD_H by a wide margin, so the head sits several millimetres below the face."

[[dim]]
sym = "BOLT_Z_CARRIAGE"
value = 25
provenance = "part"
note = "M5 x 25 for all sixteen Z carriage bolts. 🔴 IT WAS M5 x 35 AND THEN BRIEFLY M5 x 30, AND BOTH BOTTOM. The chain moved three times in one day: the counterbore went deeper, the spacer came back 0.2 thinner on a micrometer, and the block's tapped depth turned out to be 8. z-carriage.md carried a headed section called 'Use M5 x 35, not M5 x 30' whose answer is now neither."

[[dim]]
sym = "Z_BOLT_ENGAGE"
expr = "BOLT_Z_CARRIAGE - Z_CBORE_WEB - SPACER_T"
note = "5.8 mm into the bearing block, 1.16 x D in STEEL, which is content with about one. 🔴 BUT THE CAP IS 6, NOT 8 - the block threads M5 x 6 - so this sits 0.2 from jamming at the thread's end. A bolt that reaches past the thread reads as tight and never clamps, the same failure BOLT_REACH_MAX exists to prevent on the T-nut joints. ⚠ SPACER_T IS STILL OPEN AND THIS IS BOUNDED BOTH WAYS BY IT: the faced pair must land between 15.0 and 16.0 for a 4 mm web, and if it does not, move the web rather than the bolt. Check this the moment the spacers come off the mill."

# ------------------------------------ Z plate to ball nut, added 2026-10-08 - they were MISSING

[[dim]]
sym = "BF12_W"
value = 60.08
provenance = "measured"
note = "60.08 across, HIS CALIPERS 2026-10-08. BF12 is bolted to the X carriage plate on the screw centreline and has to pass between the two Z spacers - see BF12_SIDE_CLEAR. It had been back-derived at 60.2 from his recollection of about 2 mm each side, which was close, but three decisions were resting on it so it got measured."

[[dim]]
sym = "Z_SPACER_CHANNEL"
expr = "(2 * Z_RAIL_COL) - SPACER_W"
note = "64, the clear channel between the two spacers' inner edges, which is what BF12 passes through."

[[dim]]
sym = "BF12_SIDE_CLEAR"
expr = "(Z_SPACER_CHANNEL - BF12_W) / 2"
note = "1.96 mm each side of BF12. 🔴 HIS CATCH, 2026-10-08, and it nearly sank the rail pitch: bringing the rails in to 114 brings the spacers with them and closes this channel by 1. The new bar being 50 wide rather than 2in gives 0.8 of it back, which lands this within four hundredths of the ~2 mm the as-built carriage has. ⚠ If the spacers are ever ordered at 2in again this drops to 1.5. For more margin than the as-built, a 48 wide bar gives 2.9 and still covers the 44 block by 2 each side."

[[dim]]
sym = "T_BF12_BLOCK"
value = 20
provenance = "measured"
note = "20, BF12's thickness along the screw axis - HIS CALIPERS off a real BF12, 2026-10-08. Not to be confused with BF12_H, which is 43 and is how far the block stands UP its plate from the seating face. This is the one that sets where the Z ball nut can reach: going down, the nut bottoms on BF12's face. ⚠ IT DRIVES NO OTHER DIMENSION - dims.py deps re-derives Z_NUT_X_1 and Z_NUT_X_2 and nothing else, and X and Y get their nut geometry from the end plate chain through SCREW_AXIS_X instead, so do not reach for this symbol on those axes. ⚠ BUT IT IS A TERM IN A BOLT LENGTH, his 2026-10-08: BF12 is face-mounted through its own body, so the 4 x M5 that fix it to the rear plate and to the right X end plate's tongue have to clear this 20 before they reach any thread. Those lengths are not derived in this file yet."

[[dim]]
sym = "NUT_HOLE_DEPTH"
value = 16
provenance = "measured"
note = "16, the drilled depth of a ball nut housing's M5 holes - his, 2026-10-08, against only 8 of thread as supplied. 🔴 ALL FOUR NUTS AND SCREWS ARE THE SAME PART, differing only in length - his, 2026-10-08 - so every figure here applies to X, Y1, Y2 and Z alike. 🔴 THE 8 BELOW THE THREAD IS NOT USABLE TRAVEL: it is tap drill diameter, about 4.2 on an M5 x 0.8, so a 5 mm thread cannot enter it and a longer bolt jams where the mating thread stops, exactly as if the hole ended at 8. That was got wrong once here, so it is written down - chip space is not depth. What the 16 DOES buy is room to tap deeper."

[[dim]]
sym = "NUT_TAP_ASSUPPLIED"
value = 8
provenance = "vendor"
note = "8, the thread depth every one of the four nut housings arrives with. ⚠ IT IS ENOUGH ON ITS OWN wherever the bolt only has to cross a plate: on the Y sole bracket an M5 x 12 reaches 5.65 through the 1/4in bracket, and the aluminium thread is already stronger than the bolt at that depth. Tapping deeper is margin, not a fix - see NUT_TAP_DEPTH."

[[dim]]
sym = "NUT_TAP_REACH"
value = 14
provenance = "measured"
note = "14, HOW FAR A BOLT ACTUALLY GOES into the tapped housing - and the measurement is the good part. He had a spare nut, tapped one hole as deep as the tap would go, ran an M5 x 30 in until it bottomed and measured what was left standing out: 16, so the bolt went in 14. 🔴 THAT MEASURES THE CONSEQUENCE, NOT THE ANNOUNCEMENT. The hole drills 16 but a plug tap cannot thread the last couple of millimetres of a blind hole, so the drilled depth was never the usable figure - and reasoning from it is exactly the error that put a wrong bolt in this file twice. One spare part and a bolt settled what two rounds of arithmetic did not. ⚠ IT IS THE TAP'S LIMIT, NOT THE HOLE'S - his, 2026-10-08: that was a plug tap, not a bottoming tap. So another millimetre or two is available if anything ever needs it. Nothing does: M5 x 16 already engages 9.7, which is the 2 x D aluminium asks for."

[[dim]]
sym = "NUT_TAP_DEPTH"
expr = "NUT_TAP_REACH - 2"
note = "12, the working thread depth - NUT_TAP_REACH held back 2 mm so nothing can bottom. 🔴 IT IS MARGIN, NOT A STRENGTH REQUIREMENT, and an earlier version of this note overstated it as 'about half what aluminium asks'. His challenge, 2026-10-08: the load on these four bolts is SHEAR - the screw drives vertically and the bolts run horizontally - so why would thread depth matter? It matters only through preload: a bolted joint carries shear by FRICTION between the faces, and thread is what lets you develop the clamp load that makes the friction. Run the numbers and the joint was never short: at the as-supplied 8 mm thread an M5 reached 5.7, whose aluminium shear area strips at about 11 kN against the bolt's own ~9 kN proof - THE THREAD WAS ALREADY STRONGER THAN THE BOLT, which is what the 2 x D rule of thumb exists to achieve. So the deeper tap buys preload RETENTION, not capacity: aluminium relaxes, and more turns share the load. It costs five minutes in a soft material, which is the only reason it is worth doing at all. ⚠ THE BEARING BLOCKS CANNOT HAVE THIS - their hole is 8.7 against 6 of thread, so nothing to tap into; they are steel and do not need it."

[[dim]]
sym = "Z_NUT_CBORE_WEB"
value = 6
provenance = "derived"
note = "6, the plate left under the head on N1-N4 - DEEPER than the 4 the C-holes get, and his call 2026-10-08: 🔴 THE 4 mm WEB IS ONLY THE SPACER BOLTS' CONSTRAINT. C1-C16 cross the web AND the 15.2 spacer before they reach the block, so at a 6 web an M5 x 25 would engage 3.8, under a diameter - the 4 is forced there, not chosen. N1-N4 cross only the web and the shim, so they can afford a thicker one, and it buys 2 mm more material under the four heads that sit beneath the lower spindle clamp. ⚠ THE PLATE THEREFORE HAS TWO COUNTERBORE DEPTHS. I had claimed all twenty could share one setting, which was tidier and wrong."

[[dim]]
sym = "Z_NUT_CBORE_DEPTH"
expr = "T_Z_PLATE - Z_NUT_CBORE_WEB"
note = "6.7 on the nominal plate, 6.19 if it is really 12.19. Derived off the web for the same reason Z_CBORE_DEPTH is - caliper the plate, subtract the web, dial that depth."

[[dim]]
sym = "BOLT_Z_NUT"
value = 16
provenance = "part"
note = "M5 x 16 into the ball nut housing - and 🔴 THE SAME BOLT ON EVERY AXIS, because all four nuts are the same part. On Z it crosses a 6 mm web and the shim for 9.7 of engagement; on the Y sole brackets it crosses 6.35 of 1/4in bracket for 9.65. Both need the housing tapped to NUT_TAP_DEPTH first. ⚠ One bolt and one tap setting across four nuts was worth more than the alternative, which was M5 x 12 on Y against the as-supplied 8 mm thread - that works too, and leaves the Y housings untapped, but then two lengths and two tap states are loose in the same build. ⚠ NOT the M5 x 25 that the Z carriage bolts take."

[[dim]]
sym = "Y_NUT_BOLT_ENGAGE"
expr = "BOLT_Z_NUT - T_SOLE_BRACKET"
note = "9.65 mm into the Y ball nut housing, 1.93 x D, with the housing tapped to NUT_TAP_DEPTH. The sole bracket bolts UP into the inverted nut and there is nothing between them - no spacer, no shim - so this is the simplest of the nut joints: bolt less bracket. ⚠ SAME POINT AS THE Z: the load here is SHEAR and a bolted joint carries shear by friction, so what this joint needs is preload. The four holes are M5 clearance, so a joint that slips gives up lost motion the controller cannot see. Torque them properly and evenly. At the as-supplied 8 mm thread an M5 x 12 would reach 5.65 and the aluminium would still be stronger than the bolt - the deeper tap is margin."

[[dim]]
sym = "Z_NUT_BOLT_ENGAGE"
expr = "BOLT_Z_NUT - Z_NUT_CBORE_WEB - NUT_SHIM"
note = "9.7 mm into the nut housing, 1.94 x D in aluminium. It was 5.7 before the housing was tapped deeper, and 🔴 5.7 WAS ALREADY ENOUGH - the aluminium thread strips at about 11 kN there against the bolt's ~9 kN proof load. The extra is margin against preload relaxation, not capacity. ⚠ WHAT THIS JOINT ACTUALLY NEEDS IS PRELOAD, NOT THREAD. The four bolts are in 6 mm clearance holes on M5, so 0.5 radial float per side - if the joint ever slips, that float becomes up to 1 mm of Z lost motion the controller cannot see. Friction is doing the work: at a modest 2 N.m each the four develop roughly 1.6 kN of friction capacity against a 500 N envelope. TORQUE THEM PROPERLY AND EVENLY; that matters more here than the last few millimetres of thread. Bounded at both ends like Z_BOLT_ENGAGE - too little and the thread strips, more than NUT_TAP_DEPTH and the bolt jams where the thread stops."

