[[dim]]
sym = "WINDOW_OUTB_DRAWN"
value = 20
provenance = "derived"
note = "Window's outboard edge from the fin's outboard factory edge, AS DRAWN on Sheet 1 (Y 20). \u26a0 WINDOW_OUTB says 19, measured off the MDF template 2026-10-02, and open-items.md closed the strip widths at 19. The two disagree by 1. The 20 is almost certainly right and the 19 stale: at 20 the window's outboard edge lands on X 3.175 and 1207.555 in machine coordinates, which ARE the two Y beams' outer faces - exactly what Sheet 1's own note says it is aligned to. The 3D model uses 20. SETTLE IT before the fins are cut."

[[dim]]
