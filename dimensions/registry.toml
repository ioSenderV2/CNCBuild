expr = "Y2_EXT_FACE_X - Y1_EXT_FACE_X"
note = "Y1's outboard EXTRUSION face to Y2's, 1204.38 - the figure lateral-stiffness.md's table calls outboard face to outboard face. It was 1200 until 2026-10-03, when his stackup replaced the round number; the plate is 6.35 longer than this because it also covers the two side plates."

[[dim]]
sym = "BF12_BASE_TO_ROW1"
value = 7
provenance = "part"
note = "7, the BF12 casting's own offset from its base face to the first mounting hole. His, 2026-10-08. BF12 IS MOUNTED UPSIDE DOWN on the rear plate's inside face, so the base face is the upper surface of the installed part and this 7 runs DOWNWARD from it."

[[dim]]
sym = "BF12_ROW1_BARE"
value = 127
provenance = "derived"
note = "🔴 SUPERSEDED 2026-10-08 AND NOTHING DERIVES FROM IT. It was the first BF12 row measured DOWN from the plate's installed TOP edge - his number 2026-10-03, given when the plate was a nominal 304.8. Kept rather than deleted because the prose quotes it and because it records the shape of the mistake: a ball screw's mounting height referenced to a bought plate edge, which moved 3.175 the moment the plate was ordered at 11 7/8. BF12_ROW1_Y now runs on Y_BEAM_UNDERSIDE - T_INTERPOSER - BF12_BASE_TO_ROW1 instead. For the record the two land within 0.475 of each other, which is why the error survived three readings."

[[dim]]
sym = "BF12_ROW_PITCH"
value = 18
provenance = "part"
note = "BF12 face-mount row spacing. Columns are 7 and 53 - the same columns measured on the cast stepper frame, see open-items.md."

[[dim]]
sym = "BF12_ROW1_Y"
expr = "Y_BEAM_UNDERSIDE - T_INTERPOSER - BF12_BASE_TO_ROW1"
note = "165, and 🔴 IT IS BEAM-REFERENCED NOW rather than converted from a plate edge - his chain, 2026-10-08, and it closes the open item that two earlier commits could not. BF12 sits upside down with its base face LEVEL WITH THE UNDERSIDE OF THE INTERPOSER PLATE, because at the far end of the beam the stepper frame / BK12 casting hangs below that same interposer, and the interposer bolts to the Y beam's underside. So the screw's two ends are set by one surface and the row is Y_BEAM_UNDERSIDE less the interposer less the casting's own 7. ⚠ It used to read REAR_PLATE_W - BF12_ROW1_BARE - T_INTERPOSER, which hung the ball screw's far end off a BOUGHT plate edge: the plate going 304.8 to 301.625 moved it 3.175 while the near end on the cast frame did not move, and over a 1000 mm screw that is parallelism. Nothing about the delivered plate can move it now."

[[dim]]
sym = "BF12_ROW2_Y"
expr = "BF12_ROW1_Y - BF12_ROW_PITCH"
note = "147, the second BF12 row, same four columns. It SUBTRACTS the pitch: Sheet 7 reads from the plate's bottom edge, so the second row is the lower of the two and therefore the smaller Y."

[[dim]]
sym = "XBOX_PITCH"
value = 150
provenance = "derived"
note = "Torsion-box bolt pitch along the rear plate, settled 2026-10-03. The side plates use 100 over 1000 - different plates, both correct."

[[dim]]
sym = "XBOX_X_FIRST"
expr = "(REAR_PLATE_L - (7 * XBOX_PITCH)) / 2"
note = "First of eight torsion-box bolts. Eight at 150 pitch span 1050; centred on the plate's own 1210.73 that leaves 80.365 at each end. Stations: 80.365, 230.365, 380.365, 530.365, 680.365, 830.365, 980.365, 1130.365 - and note 7.8 is why the fractions cost nothing, since these are drill-guide holes with no mating pattern to miss."

# ---------------------------------------------------------------- the BF12 tongue, Sheet 2b

[[dim]]
sym = "XEP_STOCK_L"
value = 300
provenance = "measured"
note = "The 1/2in plate stock for the X end plates: 200 x 300, his. THE LENGTH THE RIGHT-HAND PLATE ENDS AT, because its far end is not cut - see TONGUE_TOP. \U0001f534 WAS RECORDED AS 304.5 AND THAT WAS WRONG: a 304.5 x 154 piece was written down as the stock, the tongue was built on it, and the real stock is 200 x 300. Every number on Sheet 2b past X 242.5 moved when it was corrected. It is the repo's own README warning twice over - a stock dimension taken from the conversation rather than from the part, and then derived from."

[[dim]]
sym = "XEP_STOCK_W"
value = 200
provenance = "measured"
note = "Width of the same stock. The plate is XEP_W (154) wide, so cutting one out leaves a 45 strip - and THAT is where DOUBLER_H's 45 comes from. The doubler is the offcut, which is the whole reason it is 45 rather than the 50 it used to be."

[[dim]]
sym = "TONGUE_TOP"
expr = "XEP_STOCK_L"
note = "Far end of the RIGHT-HAND plate - the stock's own end, uncut, so it is XEP_STOCK_L and not a chosen length. His reason was 'one less cut': leave the far end alone and let the corner cut make the tongue. The left-hand plate still stops at XEP_H, which is the single thing making the pair non-interchangeable."


[[dim]]
sym = "TONGUE_H"
expr = "TONGUE_TOP - XEP_H"
note = "BF12 tongue length past the 2a outline - 57.475, DERIVED from the stock rather than chosen, and it only has to beat TONGUE_MIN. It has been 40, then 50, then briefly 61.975 on a stock length that turned out to be wrong, and it is now whatever XEP_STOCK_L leaves. \U0001f534 DO NOT PRINT A ROUND NUMBER FOR IT: it was called '60 x 60' while the stock read 304.5 and 61.975 rounded there, and 57.475 does not. The sheet dimensions the stock length and the corner cut; the tongue has no cut-to length of its own. THE BF12 ROWS NEVER MOVED FOR ANY OF IT - their X is TONGUE_BF12_ROW1/ROW2, set by the beam top plus the interposer, so this symbol follows them and never the reverse."



[[dim]]
sym = "TONGUE_BF12_ROW1_BARE"
value = 249.5
provenance = "derived"
note = "First tongue BF12 row BEFORE the interposer: 7 above the TOP OF THE X BEAM at 242.5, matching Sheet 7's own pre-interposer offset. The reference is the beam top, not the plate end - XEP_TOP_ABOVE_BEAM makes those the same point on this plate, which is easy to read as a coincidence and is not one."

[[dim]]
sym = "TONGUE_BF12_ROW1"
expr = "TONGUE_BF12_ROW1_BARE + T_INTERPOSER"
note = "THE INTERPOSER GOES UNDER THE CAST STEPPER FRAME - beam top, interposer, casting - so the frame and the screw it carries both stand 9.525 above the beam top, and these holes must be drilled where the screw ACTUALLY ends up rather than where a casting sitting straight on the beam would put it. The X stepper end has one too - there are three, Y1, Y2 and X. The X tongue is ABOVE its beam where the Y frames hang BELOW theirs, so the interposer lifts this end rather than dropping it; on each sheet's own frame that is still an addition. Same correction as BF12_ROW1_Y on Sheet 7."

[[dim]]
sym = "TONGUE_BF12_ROW2"
expr = "TONGUE_BF12_ROW1 + BF12_ROW_PITCH"
note = "Second tongue row, same two columns at Y 7 and 53."

[[dim]]
sym = "TONGUE_EDGE_MARGIN"
expr = "TONGUE_TOP - TONGUE_BF12_ROW2"
note = "Far BF12 row to the tongue's end - 22.975 on the 300 stock. Must stay well clear of an M5; 5.5 at the original 40 was not, which drove the tongue to 50 and then to the full piece. DERIVED, so it moves when the stock does and never sets anything."


[[dim]]
sym = "CORNER_CUT_Y"
expr = "EXT_W"
note = "Where the corner cut starts up the far end of both X end plates - 60, and it is EXT_W because that is the beam's footprint off the back edge. Below it the plate must stay full width to cover the upper extrusion's end; above it there is nothing but plate. His cut, 2026-10-04."

[[dim]]
sym = "CORNER_CUT_X_END"
value = 188
provenance = "derived"
note = "Where the corner cut lands on the plate's FRONT edge, at Y = XEP_W. The same number on BOTH plates - 2a cuts from (XEP_H, 60) and 2b from (XEP_STOCK_L, 60), and they meet here. ON 2B THE CUT REPLACES THE STEP rather than following it: one diagonal instead of cutting along X 242.5 and then across Y 60, which is the 'one less cut' that let the far end stay uncut. WAS 185.5 BRIEFLY, moved to 188 so the cut stops crowding the bearing block. CHECKED, computed not measured: the nearest feature is the far-upper bearing block M5 at (183.5, 133.5), and the perpendicular distance to the cut is 14.2 mm on 2a and 18.6 on 2b, so a ~10 mm counterbore leaves about 9 mm of material on the tighter of the two. At 185.5 those were 12.3 and 17.3."


[[dim]]
sym = "BF12_H"
value = 43
provenance = "part"
note = "BF12's height - how far the block stands up the plate from its seating face. His, and it is the term that gives the tongue a FLOOR."

[[dim]]
sym = "TONGUE_MIN"
expr = "BF12_H + T_INTERPOSER"
note = "\U0001f534 THE TONGUE'S LOWER BOUND, and the only thing its length actually has to satisfy: the tongue must back the whole of BF12, and BF12 sits on the interposer, so the floor is the block's own height plus the interposer offset. His: 43 + 9.25 = 52.25. This expr gives 52.525 because it uses T_INTERPOSER's 3/8in nominal of 9.525 where he said 9.25 - a 0.275 difference that cannot matter against TONGUE_CLEAR, and deriving it this way means the floor TRACKS the 3/8in stock when it is finally calipered. ABOVE THIS FLOOR THE LENGTH IS FREE: it is not a fit, and the tongue is simply however much the stock leaves past XEP_H."

[[dim]]
sym = "TONGUE_CLEAR"
expr = "TONGUE_H - TONGUE_MIN"
note = "How much tongue there is past the floor BF12 needs - 4.95 on the 200 x 300 stock. THE CHECK TO RUN BEFORE SUBSTITUTING A DIFFERENT PIECE OF PLATE: any stock whose length leaves this positive will do, so the minimum usable plate is XEP_H + TONGUE_MIN, about 295. The 300 in hand clears by about 5."
