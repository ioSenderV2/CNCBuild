note = "The Y beam's underside above the torsion box's top skin, 182 - and it comes from the FIN, which is the riser that actually carries the beam. It is the top edge of the fin's window: the casting and interposer fill the window up to the beam, so the window's top IS the beam's underside. Settled 2026-10-03 after the side plate was ruled out as the reference."

[[dim]]
