provenance = "OPEN"
note = "🔴 THE ONLY SPACER THICKNESS THIS FILE CARRIES, and it is the thickness AFTER FACING - his call 2026-10-08. The two as-found symbols are gone: both bars are faced in one setup, so the starting thickness feeds nothing and recording it only invited the wrong number to be used. ⚠ 15.2 IS A PLACEHOLDER so the arithmetic resolves - it is the previous bar's micrometer reading less the skim, and the new 160 x 50 stock is a different bar. MIC THE FACED PAIR AND PUT THAT NUMBER HERE, with provenance measured. It feeds Z_BOLT_ENGAGE, which is bounded at both ends by the block's 8 mm tapped depth, and SPINDLE_OFFSET - so both are provisional until it is real. This part has been wrong twice already, once as a fraction (5/8in, 15.875) and once by instrument (16.41 on calipers against 16.22 on a micrometer), which is why it is not being guessed a third time."

[[dim]]
