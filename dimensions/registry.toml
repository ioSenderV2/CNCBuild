note = "Fits inside SPINDLE_BODY_L, which closed at 213 on 2026-10-03. It used to be written as fitting on either the 199 or the 213 reading, because the body length was disputed; it is not any more."

# ---------------------------------------------------------------- the shelf
#
#  THE CAUTIONARY TALE OF THIS REGISTRY. These four holes were dimensioned from the
#  BEAM FRONT. The beam moved back to flush on 2026-10-02, and the rear horizontal -
#  "60 from the beam front" - silently became Y 0, off the edge of the plate. Nothing
#  linked the hole to the face it was measured from. They are keyed to the plate's own
#  back edge now, and SHELF_* depends on nothing that can move.

[[dim]]
sym = "SHELF_BAR_W"
value = 25.4
provenance = "nominal"
note = "1in, across the bar"

[[dim]]
sym = "SHELF_BAR_H"
value = 50.8
provenance = "derived"
note = "2in. Was 1in. The height exists to separate the two horizontal bolts in Z."

[[dim]]
sym = "SHELF_BAR_L"
expr = "EXT_W"
note = "60 - exactly the beam's footprint. Was 76.2 (3in), which reached back under the back joining plate; with the beam flush there is nothing back there, and the overhang carried the only route by which a proud joining plate could become the gantry's bearing point."

[[dim]]
sym = "SHELF_VERT_REAR"
value = 15
provenance = "part"
note = "Vertical M8 into the extrusion's underside slot, Y from the PLATE'S BACK EDGE. Pinned by the 30-6060 slot centrelines."

[[dim]]
sym = "SHELF_VERT_FRONT"
value = 45
provenance = "part"
note = "The second underside slot"

[[dim]]
sym = "SHELF_HORIZ_Y"
expr = "(SHELF_VERT_REAR + SHELF_VERT_FRONT) / 2"
note = "BOTH horizontal bolts. The only free Y station - two M8 need ~12 between centres and the verticals occupy 15 and 45, leaving Y 27-33."

[[dim]]
sym = "SHELF_HORIZ_Z_LOW"
value = 15
provenance = "derived"
note = "Z from the bar's underside. BLIND-TAPPED: through-drilling would break out where the lower Y bearing block sits."

[[dim]]
sym = "SHELF_HORIZ_Z_HIGH"
value = 35
provenance = "derived"
note = "15.8 to the bar's top"

[[dim]]
sym = "SHELF_Z_COUPLE"
expr = "SHELF_HORIZ_Z_HIGH - SHELF_HORIZ_Z_LOW"
note = "The lever resisting the bar's nose-down pitch about X. This is what the 2in bar buys."

[[dim]]
sym = "SHELF_BAR_TOP"
value = -60
provenance = "derived"
note = "Z from the Y beam top - the underside of the X beam's bottom extrusion"

[[dim]]
sym = "SHELF_BAR_BOTTOM"
expr = "SHELF_BAR_TOP - SHELF_BAR_H"

[[dim]]
sym = "SHELF_BOLT_LOW_Z"
expr = "SHELF_BAR_BOTTOM + SHELF_HORIZ_Z_LOW"
note = "Machine Z of the lower bolt. Near the lower bearing block row - hence the blind tap."

[[dim]]
sym = "SHELF_SHIM_W"
expr = "SHELF_BAR_W"
note = "The 1in shim strip on hand is exactly the bar's width, so a strip cut to SHELF_BAR_L is a full-face shim. Slot it open at Y 15 and Y 45 to clear the vertical M8."

[[dim]]
sym = "BEAM_BOLT_CLEARANCE"
value = 9
provenance = "derived"
note = "9 mm clearance on M8 where a plate meets extrusion - the repo's deliberate figure, the joint working by friction"

[[dim]]
sym = "ROLL_RANGE"
expr = "(BEAM_BOLT_CLEARANCE - 8) / 2"
note = "Vertical float of the beam in its own bolt holes, and therefore the CEILING on shim-based roll - about 0.5. Caps the adjustment; the shim stack does not."

[[dim]]
sym = "BEAM_LEN"
value = 1000
provenance = "part"
note = "Span between the two shelves, so the lever the roll shim works over"

[[dim]]
sym = "ROLL_RANGE_PER_100"
expr = "ROLL_RANGE / BEAM_LEN * 100"
note = "Correctable tram error at a 100 mm circle. A 0.03 shim, the finest on hand, is worth 0.003 at the same circle."


# ------------------------------------------------------------- the 1211.75 rear plate

[[dim]]
sym = "Y_BEAM_GAP"
expr = "BEAM_LEN + (2 * (RAIL_STACK + T_X_ENDPLATE))"
note = "Y beam INBOARD face to inboard face - the gap the X gantry spans. His chain, 2026-10-03: the X beam plus, each side, an end plate and a rail-and-block stack, which lands on the Y extrusion's inner face. Same 1085.4 that lateral-stiffness.md's length table already carried."

[[dim]]
sym = "Y_BEAM_ASSY_W"
expr = "EXT_W + T_SIDE_PLATE"
note = "One Y beam as assembled, across the machine: the extrusion plus its outboard side plate. His number, 2026-10-03 - he gave it as 60 + 1/8in."

[[dim]]
sym = "REAR_PLATE_L"
expr = "Y_BEAM_GAP + (2 * Y_BEAM_ASSY_W)"
note = "Rear plate length, settled 2026-10-03 and NO LONGER A WINDOW. The plate runs FLUSH with the side plates' outer faces, which is exactly the ~1212 MAXIMUM lateral-stiffness.md names - past it the rear plate becomes the proud member at the corner. Supersedes the round 1200 and the tilde'd 1205. It is load-bearing now because Sheet 7's A9-A16 are absolute from the plate's left edge: cut the plate long and the Y2 station is wrong by the excess."

[[dim]]
sym = "Y1_EXT_FACE_X"
expr = "T_SIDE_PLATE"
note = "Y1 extrusion's outboard face, from the rear plate's left edge = Sheet 7's X 0. The side plate occupies that 3.175, so the beam no longer sits on the origin the way Sheet 7 was first drawn."

[[dim]]
sym = "Y2_EXT_FACE_X"
expr = "REAR_PLATE_L - T_SIDE_PLATE"
note = "Y2 extrusion's outboard face, from the same origin. Sheet 7's Y2 station mirrors about REAR_PLATE_L / 2, so every Y2 coordinate is REAR_PLATE_L minus its Y1 twin."

[[dim]]
sym = "BEAM_SPAN"
expr = "Y2_EXT_FACE_X - Y1_EXT_FACE_X"
note = "Y1's outboard EXTRUSION face to Y2's, 1205.4 - the figure lateral-stiffness.md's table calls outboard face to outboard face. It was 1200 until 2026-10-03, when his stackup replaced the round number; the plate is 6.35 longer than this because it also covers the two side plates."

[[dim]]
sym = "BF12_ROW1_BARE"
value = 127
provenance = "derived"
note = "First BF12 row on the rear plate BEFORE the interposer is accounted for, from the plate's installed TOP edge. His number, 2026-10-03."

[[dim]]
sym = "BF12_ROW_PITCH"
value = 18
provenance = "part"
note = "BF12 face-mount row spacing. Columns are 7 and 53 - the same columns measured on the cast stepper frame, see open-items.md."

[[dim]]
sym = "BF12_ROW1_Y"
expr = "BF12_ROW1_BARE + T_INTERPOSER"
note = "The screw's far end is carried by the cast stepper frame sitting ON the interposer, which LOWERS that end, so BF12 drops by the same amount or the screw is not parallel to the beam. Sheet 7 is clamped inverted, so lower is a LARGER Y. The FULL interposer thickness applies, settled 2026-10-03: the 5 mm standoff no longer exists in the design, so BF12_ROW1_BARE is a bare-metal number with nothing to take back off. This is NOT the same as NUT_FACE_BELOW_BEAM, which subtracts the standoff because its base value was MEASURED with one."

[[dim]]
sym = "BF12_ROW2_Y"
expr = "BF12_ROW1_Y + BF12_ROW_PITCH"
note = "Second BF12 row, same four columns."

[[dim]]
sym = "XBOX_PITCH"
value = 150
provenance = "derived"
note = "Torsion-box bolt pitch along the rear plate, settled 2026-10-03. The side plates use 100 over 1000 - different plates, both correct."

[[dim]]
sym = "XBOX_X_FIRST"
expr = "(REAR_PLATE_L - (7 * XBOX_PITCH)) / 2"
note = "First of eight torsion-box bolts. Eight at 150 pitch span 1050; centred on the plate's own 1211.75 that leaves 80.875 at each end. Stations: 80.875, 230.875, 380.875, 530.875, 680.875, 830.875, 980.875, 1130.875 - and note 7.8 is why the fractions cost nothing, since these are drill-guide holes with no mating pattern to miss."

# ---------------------------------------------------------------- the BF12 tongue, Sheet 2b

[[dim]]
sym = "TONGUE_H"
value = 50
provenance = "derived"
note = "BF12 tongue height above the 2a outline, raised from 40 on 2026-10-03 when the interposer pushed the far BF12 row out to 277. At 40 it left 5.5 to the edge, which is not enough beside an M5; at 50 it leaves 15.5."

[[dim]]
sym = "TONGUE_TOP"
expr = "XEP_H + TONGUE_H"
note = "Top of the tongue from the plate's bottom end. The RIGHT-HAND plate only - the left one stops at XEP_H, and that is the single thing making the pair non-interchangeable."

[[dim]]
sym = "TONGUE_BF12_ROW1_BARE"
value = 249.5
provenance = "derived"
note = "First tongue BF12 row BEFORE the interposer: 7 past the beam end at 242.5, matching Sheet 7's own pre-interposer offset."

[[dim]]
sym = "TONGUE_BF12_ROW1"
expr = "TONGUE_BF12_ROW1_BARE + T_INTERPOSER"
note = "The X stepper end sits on the interposer too - it is 3 off, Y1, Y2 and X. The X tongue is ABOVE its beam where the Y frames hang BELOW theirs, so the interposer lifts this end rather than dropping it; on each sheet's own frame that is still an addition. Same correction as BF12_ROW1_Y on Sheet 7."

[[dim]]
sym = "TONGUE_BF12_ROW2"
