# ---------------------------------------------------- consistency, settled 2026-10-03

[[dim]]
sym = "FRONT_STRIP_W"
value = 45
provenance = "derived"
note = "The front joining strip across the seam, identical on X, Y1 and Y2, and also the magnetic tape surface. WAS 46 until 2026-10-03, changed by him for consistency - and the consistency is real, not cosmetic: 45 is BLOCK_ROW_GAP, the conservative keep-out between the bearing block rows, so the strip is exactly the width that is known to fit. At 46 it matched the GEOMETRIC gap instead and had no clearance at all."

[[dim]]
sym = "BOX_TONGUE_PROUD"
value = 60
provenance = "derived"
note = "How far the box's laminated tongue stands proud of the top skin, on the back and both sides. The plates sit FLAT ON THE SKIN and the tongue laps them from OUTBOARD, so this is a simple bolted lap - there is no channel and nothing is captured. WAS 61 until 2026-10-03, changed by him for consistency, which makes the bolt line exactly central: BOX_TONGUE_BOLT_Y is 30 above the plate's bottom edge and now also 30 below the tongue's top. Named BOX_TONGUE to keep it clear of TONGUE_H and friends, which are the X end plate's BF12 tongue and a different part entirely."

[[dim]]
sym = "BOX_TONGUE_BOLT_Y"
expr = "BOX_TONGUE_PROUD / 2"
note = "The one bolt line through the plates into the box tongues. 30, and with BOX_TONGUE_PROUD at 60 it is the tongue's mid-height rather than 31 down from a 61. \u26a0 The front fin NO LONGER USES IT - the front has no tongue, so the fins are tied down by four L-brackets behind each instead; see BOX_FRONT_OVERHANG."

# ------------------------------------------------ the bolt-on plates, settled 2026-10-03

[[dim]]
sym = "TSLOT_X_FIRST"
value = 50
provenance = "derived"
note = "First bolt station along the 1000 on every bolt-on plate - Sheets 8, 9 and 10. His, 2026-10-03. With TSLOT_X_PITCH it gives seven per row at 50 to 950, symmetric with 50 clear at each end. The pitch had been written down for weeks; where the first one sat never had been."

[[dim]]
sym = "TSLOT_X_PITCH"
value = 150
provenance = "derived"
note = "Bolt pitch along the 1000 on Sheets 8, 9 and 10. NOT the same number as XBOX_PITCH, which is also 150 but is the rear plate's torsion-box row on a different part - they agree by choice, not by derivation."

[[dim]]
sym = "TSLOT_X_COUNT"
expr = "((1000 - (2 * TSLOT_X_FIRST)) / TSLOT_X_PITCH) + 1"
note = "Seven per row. Written as an expr so that if the first station or the pitch is ever revisited, the count moves with it instead of being a stale 7 in the prose."

[[dim]]
sym = "SLOT_GRID"
value = 30
provenance = "part"
note = "The 30 series' module. Corner bores and T-slot centres both sit on it, which is why EXT_BORE_INSET and RAIL_SLOT_INSET are both 15 and why a 120 beam has four rows at 15 / 45 / 75 / 105."

[[dim]]
sym = "SIDE_PLATE_H"
value = 304.8
provenance = "part"
note = "12in stock, the full-height outboard plate's width. A BOUGHT size, not a derived one - which is exactly why Sheet 9 dimensions off the bottom edge."

[[dim]]
sym = "SIDE_TSLOT_ROW_1"
expr = "SIDE_PLATE_H - BEAM_H + RAIL_SLOT_INSET"
note = "Lowest of Sheet 9's four T-slot rows, measured from the plate's BOTTOM edge - 199.8. His call 2026-10-03, and it removes a real risk: the bottom edge is the reference because it bears on the box's top skin, so the rows stay correct even if the plate turns out slightly short of the Y beam's top face. Dimensioned from the top instead, a short plate would have moved all four. Rows 2-4 follow on SLOT_GRID."

[[dim]]
sym = "SIDE_TSLOT_ROW_4"
expr = "SIDE_TSLOT_ROW_1 + (3 * SLOT_GRID)"
note = "Highest of the four, 289.8 from the bottom edge. If the plate is cut exactly 304.8 this sits 15 below its top edge, which is the beam's own slot inset - the check that the chain is right."

[[dim]]
sym = "STRIP_ROW_LOW"
expr = "(FRONT_STRIP_W / 2) - RAIL_SLOT_INSET"
note = "Sheet 8's lower bolt row, 7.5 from the strip's edge. Forced, not chosen: the strip is centred on the beam's seam because the block gap it passes through is, and the two slots flanking the seam sit RAIL_SLOT_INSET either side of it."

[[dim]]
sym = "STRIP_ROW_HIGH"
expr = "(FRONT_STRIP_W / 2) + RAIL_SLOT_INSET"
note = "Sheet 8's upper bolt row, 37.5. Same derivation as STRIP_ROW_LOW, the other side of the seam."

[[dim]]
sym = "BOX_FRONT_OVERHANG"
value = 140
provenance = "derived"
note = "How far the box's top skin runs PAST the front fins. His, 2026-10-03. The front is the one side with no tongue: rather than capture the fins, the box simply extends under and beyond them and FOUR L-BRACKETS BEHIND EACH FIN tie the fin down to the top skin. That is why BOX_FORE_AFT grew rather than shrank, and why Sheet 1's two tongue bolts need re-purposing or deleting."

[[dim]]
sym = "SIDE_TONGUE_START"
expr = "T_REAR_PLATE"
note = "Where the side tongue begins, from the box's BACK edge - 6.35, his 1/4in offset 2026-10-03. The back tongue laps the rear plate's outer face, so the rear plate occupies the first 6.35 of the box's fore-aft run and the side tongue starts just clear of it."

[[dim]]
sym = "SIDE_TONGUE_L"
expr = "BEAM_LEN"
note = "Side tongue length, 1000 - his, 2026-10-03, and it is the Y beam's own length because the side plate it laps is too."

[[dim]]
sym = "SIDE_TONGUE_END"
expr = "SIDE_TONGUE_START + SIDE_TONGUE_L"
note = "1006.35 from the box's back edge. THIS IS THE NUMBER THAT CLOSES THE FIN CLASH: the Y beam runs 6.35 to 1006.35 and the front fin caps it from 1006.35 forward, so the tongue ends exactly where the fin begins. The fin stands FIN_PROUD = 16.825 outboard of the side plate, which is also the tongue's inner face, so a tongue running any further forward would be held off the plate by the fin along the plate's whole length. It does not run further forward."

[[dim]]
sym = "BOX_FRONT_BARE"
expr = "BOX_FORE_AFT - SIDE_TONGUE_END"
note = "Bare top skin ahead of the side tongue, 150. The front fin occupies the first T_FIN of it and the remaining BOX_FRONT_OVERHANG is clear deck, which is where the four L-brackets per fin land."

[[dim]]
sym = "T_BOX_TONGUE"
value = 19
provenance = "derived"
note = "The box tongue is ONE 19 mm lamination, settled by him 2026-10-03 - not the two-lamination 38 the old walls had, because with no channel there is nothing for a second one to form. Same stock as the skins, so T_BB_SKIN's warning applies: sheet sold as 19 commonly measures 18.2-18.5."

[[dim]]
sym = "FIN_COVERS_TONGUE_END"
expr = "FIN_PROUD - T_BOX_TONGUE"
note = "How much of the side tongue's front END GRAIN the fin covers, beyond its full thickness. His intent 2026-10-03 is that the fin covers it completely, which needs this at 0 or above. ⚠ IT IS NEGATIVE ON THE REPO'S OWN NUMBERS: FIN_PROUD derives to 16.825 (FIN_OVERHANG 20 less the 3.175 side plate) against a 19 tongue, so 2.175 of end grain stays exposed. He stated the fin runs past the side plate by 19. One of the two is wrong and it is UNRESOLVED - either FIN_OVERHANG is 22.175 rather than 20, or the end grain is 2.175 short of covered."
