value = 20
provenance = "part"
note = "HGR20 rail width - the 20 in the designation. For the 3D model he settled 2026-10-03 that the rail may be drawn as 20 mm SQUARE ROD, so this doubles as its section height. That is an approximation he chose, not one the model invented: the real HGR20 profile is shorter than it is wide and shaped, and nothing downstream of a drawing depends on the difference."

[[dim]]
sym = "X_CARRIAGE_W"
value = 154
provenance = "part"
note = "154, the X carriage plate across - same width as the X end plates, and Sheet 3a's Y axis."

[[dim]]
