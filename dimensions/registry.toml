note = "Sheet 2a's D1-D4 column, and Sheet 2d's. One column in shear with full material around it. 🔴 IT IS NO LONGER THE DOUBLER'S MIDPOINT and must not be re-derived as one: at DOUBLER_H 45 the middle is 22.5, and 25 is deliberate. THE REASON IS R1-R4: they bore 20 deep from X 0 into the doubler's end face and clear the 5 mm D-bolt wall - the bolt spans 22.5 to 27.5 - by 2.5. Re-centre the column to 22.5 and the bolt spans 20 to 25, which a 20 deep hole arrives exactly on; the R row would have to shorten to about 17.5. His call: leave it at 25. Edge distances at 45 are 20 above and 25 below, which on a 5 mm hole is 17.5 and 22.5 of material. Moving it would also move D1-D4 on Sheets 2a and 2b, which share this column."

[[dim]]
