# ---------------------------------------------------------------- the torsion box

[[dim]]
sym = "T_BB_SKIN"
value = 19
provenance = "nominal"
note = "Baltic birch skin, top and bottom. NOMINAL ON PURPOSE - torsion-box.md warns that sheet sold as 19 commonly measures 18.2-18.5 and varies between sheets, and that the rib notches must be cut to the measured thickness of the sheet in hand, not to this."

[[dim]]
sym = "BOX_RIB_H"
value = 100
provenance = "derived"
note = "Egg-crate rib height between the skins. His, 2026-10-03."

[[dim]]
sym = "BOX_THK"
expr = "BOX_RIB_H + (2 * T_BB_SKIN)"
note = "The box's vertical thickness, 138 - his arithmetic 2026-10-03 and the figure torsion-box.md already carried as 'depth overall'. Named THK here because 'depth' was ambiguous against the fore-aft run."

[[dim]]
sym = "T_REAR_PLATE"
value = 6.35
provenance = "nominal"
note = "1/4in A36 hot-rolled, the Sheet 7 plate. CALIPER IT with the side plate on arrival."

[[dim]]
sym = "BOX_W"
expr = "REAR_PLATE_L"
note = "Box top skin across the machine, measured INSIDE the two side tongues - 1211.75, the same as the rear plate because both are the machine's outer envelope. \u26a0 THIS INVERTED on 2026-10-03 and the earlier reading is wrong: it was briefly recorded as 1205.4, the space INSIDE the side plates, on a reading that the box tucked between them. It does not. The side and back plates sit FLAT ON THE TOP SKIN and the tongues stand proud OUTBOARD of them, so the tongue's inside face is the plate's outer face. There is no channel and nothing is captured on two sides."

[[dim]]
sym = "BOX_FORE_AFT"
expr = "BEAM_LEN + T_REAR_PLATE + T_FIN + BOX_FRONT_OVERHANG"
note = "Box top skin front to back, from the back tongue's inside face to the front edge - 1156.35. \u26a0 ALSO INVERTED on 2026-10-03, same reason as BOX_W: it was 983.65 on the reading that the box tucked inside the plates. It does not; the machine stands ON it. So this ADDS the plate thicknesses the old one subtracted, and adds the front overhang on top. THE FRONT HAS NO TONGUE - the box simply runs past the fins and four L-brackets behind each fin tie it down."

# ================================================================ drilled coordinates
#
#  Added 2026-10-03 after tools/audit-prose.py --uncaptured found 78 values in the
#  shop pack's hole schedules with nothing in the registry behind them. They were
#  not wrong - they were UNANCHORED, which is a different fault: when something
#  upstream moves, an unanchored number does not move with it and nobody is told.
#  That is exactly how Sheet 7's X values went stale when the rear plate's length
#  changed. A row on a pitch is left as one fact: the first station plus the pitch,
#  not a symbol per hole.

