note = "Sheet 2a's H1, 86.725, drawn as 86.7. THIS WAS DRAWING-ONLY UNTIL 2026-10-03 - the audit found 86.7 and 106.7 nowhere else in the repo, not even in the prose. They do derive, and they check out, but nothing had ever said so."

[[dim]]
