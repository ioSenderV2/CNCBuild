#  CNCBuild dimension registry
#
#  AUTHORITATIVE FOR VALUES. The machine/*.md files stay authoritative for REASONING -
#  why a number is what it is, what was rejected, what it trades against. This file owns
#  only what the numbers are. If a number here and a number in prose disagree, THIS FILE
#  WINS and the prose is stale; run `tools/dims.py check` to find out.
#
#  Why it exists: on 2026-10-02 a single session found five wrong numbers in the prose.
#  Three were bad primitives carried as labels (a "5/8"" spacer that measured 16.41, a
#  "PHI80x200" spindle that reads 213, a "1/2"" plate that is 10 mm stock). Two were
#  ORPHANED DERIVATIONS - a value computed from a source, written as a literal, with no
#  link back, so when the source moved the derivative silently did not:
#
#    * the shelf's rear bolt, dimensioned from the beam front, which moved to flush
#    * the "1.8 mm proud" figure, computed from an M8 column at 20 that became 35
#
#  Symbols alone would not have caught either. The `expr` field and the reverse index it
#  generates are the point: change a primitive, and `tools/dims.py deps <SYM>` tells you
#  every value that has to be re-derived.
#
#  FIELDS
#    sym         identifier. Fusion-safe: letter first, then [A-Za-z0-9_]. Exported verbatim.
#    value       a primitive's number. Mutually exclusive with `expr`.
#    expr        a derived value, in terms of other syms. Mutually exclusive with `value`.
#    unit        mm unless stated. Fusion needs this.
#    provenance  measured | part | vendor | nominal | derived | OPEN   <- see below
#    note        one line. The long reasoning lives in the prose, not here.
#    source      where the number came from: a file, a photo, a person, a date.
#
#  PROVENANCE IS NOT DECORATION. It is the repo's standing rule made machine-readable:
#    measured  off the real machine or the real part, with an instrument
#    part      off a part's own geometry that is not in doubt (an extrusion's bore inset)
#    vendor    off a datasheet or listing committed to manufacturer-assets/
#    nominal   a catalogue figure NOT yet confirmed on the part - the dangerous class
#    derived   computed here from other syms
#    OPEN      not established. The value is a placeholder and MUST NOT be cut to.

[meta]
updated = "2026-10-02"
units = "mm"

