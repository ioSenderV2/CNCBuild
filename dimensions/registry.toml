[[dim]]
sym = "T_REAR_PLATE"
value = 6.35
provenance = "part"
note = "1/4in A36 hot-rolled, the Sheet 7 plate - and it is ORDERED as a true 1/4in, his word 2026-10-08. The sales order line reads CPL 1/4in x 11-7/8in x 47.6562in HR, one piece. \u2705 The nominal stands and that is worth saying rather than assuming: three nominals in this registry have already turned out wrong by being taken off what a part was SOLD as - a 5/8in spacer that measured 16.41, a 1/2in plate whose stock is 10 mm, a 1/2in end plate that micrometers 12.19. This one is ordered true rather than inferred from a label. Still caliper it with the side plate on arrival: ordered true is not the same as delivered true."
source = "Specialty Metals Corp sales order W053768, 2026-10-08"

[[dim]]
sym = "BOX_W"
expr = "REAR_PLATE_L"
note = "Box top skin across the machine, measured INSIDE the two side tongues - 1210.73, the same as the rear plate because both are the machine's outer envelope. \u26a0 THIS INVERTED on 2026-10-03 and the earlier reading is wrong: it was briefly recorded as 1204.38, the space INSIDE the side plates, on a reading that the box tucked between them. It does not. The side and back plates sit FLAT ON THE TOP SKIN and the tongues stand proud OUTBOARD of them, so the tongue's inside face is the plate's outer face. There is no channel and nothing is captured on two sides."

[[dim]]
sym = "BOX_FORE_AFT"
expr = "BEAM_LEN + T_REAR_PLATE + T_FIN + BOX_FRONT_OVERHANG"
note = "Box top skin front to back, from the back tongue's inside face to the front edge - 1156.35. \u26a0 ALSO INVERTED on 2026-10-03, same reason as BOX_W: it was 983.65 on the reading that the box tucked inside the plates. It does not; the machine stands ON it. So this ADDS the plate thicknesses the old one subtracted, and adds the front overhang on top. THE FRONT HAS NO TONGUE - the box simply runs past the fins and four L-brackets behind each fin tie it down."

