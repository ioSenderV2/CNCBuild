note = "Y beam INBOARD face to inboard face - the gap the X gantry spans. His chain, 2026-10-03: the X beam plus, each side, an end plate and a rail-and-block stack, which lands on the Y extrusion's inner face. Same 1084.38 that lateral-stiffness.md's length table already carried."

[[dim]]
sym = "Y_BEAM_ASSY_W"
