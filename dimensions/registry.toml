#  CNCBuild dimension registry
#
#  AUTHORITATIVE FOR VALUES. The machine/*.md files stay authoritative for REASONING -
#  why a number is what it is, what was rejected, what it trades against. This file owns
#  only what the numbers are. If a number here and a number in prose disagree, THIS FILE
#  WINS and the prose is stale; run `tools/dims.py check` to find out.
#
#  Why it exists: on 2026-10-02 a single session found five wrong numbers in the prose.
#  Three were bad primitives carried as labels (a "5/8"" spacer that measured 16.41, a
#  "PHI80x200" spindle that reads 213, a "1/2"" plate that is 10 mm stock). Two were
#  ORPHANED DERIVATIONS - a value computed from a source, written as a literal, with no
#  link back, so when the source moved the derivative silently did not:
#
#    * the shelf's rear bolt, dimensioned from the beam front, which moved to flush
#    * the "1.8 mm proud" figure, computed from an M8 column at 20 that became 35
#
#  Symbols alone would not have caught either. The `expr` field and the reverse index it
#  generates are the point: change a primitive, and `tools/dims.py deps <SYM>` tells you
#  every value that has to be re-derived.
#
#  FIELDS
#    sym         identifier. Fusion-safe: letter first, then [A-Za-z0-9_]. Exported verbatim.
#    value       a primitive's number. Mutually exclusive with `expr`.
#    expr        a derived value, in terms of other syms. Mutually exclusive with `value`.
#    unit        mm unless stated. Fusion needs this.
#    provenance  measured | part | vendor | nominal | derived | OPEN   <- see below
#    note        one line. The long reasoning lives in the prose, not here.
#    source      where the number came from: a file, a photo, a person, a date.
#
#  PROVENANCE IS NOT DECORATION. It is the repo's standing rule made machine-readable:
#    measured  off the real machine or the real part, with an instrument
#    part      off a part's own geometry that is not in doubt (an extrusion's bore inset)
#    vendor    off a datasheet or listing committed to manufacturer-assets/
#    nominal   a catalogue figure NOT yet confirmed on the part - the dangerous class
#    derived   computed here from other syms
#    OPEN      not established. The value is a placeholder and MUST NOT be cut to.

[meta]
updated = "2026-10-04"
units = "mm"

# ---------------------------------------------------------------- the extrusion

[[dim]]
sym = "EXT_W"
value = 60
provenance = "part"
note = "8020 30-6060 section, 60 x 60"
source = "machine/gantry-beam-joint.md; manufacturer-assets/8020-30-6060-Profile-Drawing.jpg"

[[dim]]
sym = "EXT_BORE_INSET"
value = 15
provenance = "part"
note = "Corner bores sit 15 in from each face. Four corners, so symmetric."
source = "manufacturer-assets/8020-30-6060-Profile-Drawing.jpg"

[[dim]]
sym = "BEAM_H"
expr = "EXT_W * 2"
note = "Every beam is a stacked pair - X, Y1 and Y2 alike"
source = "machine/gantry-beam-joint.md"

# ---------------------------------------------------------------- linear motion

[[dim]]
sym = "RAIL_SLOT_INSET"
value = 15
provenance = "measured"
note = "The two rails on a beam go in the OUTSIDE T-slot of each stacked extrusion - X, Y1 and Y2 all the same, confirmed by him again 2026-10-03. On a 30-6060 that slot centre is 15 from the extrusion's outer face, the same 15 as EXT_BORE_INSET and for the same reason: the 30 series puts both on the module grid. NOT NEW: gantry-beam-joint.md's measured table has carried 'rail spacing X 90 mm, the outermost of the four front slots, at 15 and 105 up the section' since 2026-10-01. It had simply never been lifted into the registry, which is how a question already closed on the bench came to be asked again."
source = "machine/gantry-beam-joint.md, measured table, confirmed 2026-10-01"

[[dim]]
sym = "RAIL_LOW_Z"
expr = "RAIL_SLOT_INSET"
note = "Lower rail centreline, from the beam's BOTTOM face. Beam-local, so it reads the same on X, Y1 and Y2."

[[dim]]
sym = "RAIL_HIGH_Z"
expr = "BEAM_H - RAIL_SLOT_INSET"
note = "Upper rail centreline, from the beam's bottom face. 105."

[[dim]]
sym = "RAIL_PITCH"
expr = "RAIL_HIGH_Z - RAIL_LOW_Z"
note = "90, and it agrees exactly with the measured 90 in gantry-beam-joint.md. The outside slot is used because it is the widest the pair can be spread on a 120 beam; this is the couple that resists nod, so it is a stiffness number, not a convenience. It is also what lays out Sheet 2a's sixteen block holes - see BLOCK_ROW_GAP for what does not."

[[dim]]
sym = "RAIL_STACK"
value = 30
provenance = "measured"
note = "HGR20 rail plus HGH20 block, plate face to rail mounting face"
source = "measured 2026-10-02, X/Y kit"

[[dim]]
sym = "BLOCK_BUTTED"
value = 154.18
provenance = "measured"
note = "Two HGH20 blocks butted, full body. Sets the X end plate width."
source = "machine/photos/y-bearing-blocks-butted-154.jpg, calipers 2026-10-02"

[[dim]]
sym = "BLOCK_PADS"
value = 128.24
provenance = "measured"
note = "Two blocks butted, MACHINED PADS ONLY. The functional bearing floor."
source = "machine/photos/y-bearing-blocks-machined-pads-128.jpg, calipers 2026-10-02"

[[dim]]
sym = "BLOCK_ROW_GAP"
value = 45
provenance = "measured"
note = "Facing edges of the upper and lower Y block rows, measured. \u26a0 IT DOES NOT LAY OUT THE 16 BOLT HOLES - settled by him 2026-10-03. The rows are set by the rails, which sit in the beams' OUTSIDE T-slots and are therefore RAIL_PITCH apart; the geometric gap that follows is BLOCK_ROW_GAP_GEOM at 46. What it actually describes is a KEEP-OUT, his words 2026-10-03: the magnetic linear encoder tape runs down this gap and the 35 dia sensor rides over the tape, both centred on the beam's seam. Keep it at 45 - under-stating a keep-out is safe. THREE NUMBERS EXIST FOR THIS GAP and they do not agree: 45 here, 46 from the geometry (BLOCK_ROW_GAP_GEOM = 90 rail pitch less a 44 block), and 46.7 measured at a trial fit on the X beam's front face with a photo behind it, in gantry-beam-joint.md. On a 90 pitch those imply block widths of 45, 44 and 43.3. HGH20 is 44 nominal, so the geometric 46 is the one to believe and both measurements are loose. It does not matter: nothing is laid out from this, and the smallest value is the safe one for a keep-out. Using it to lay holes out from, which is what happened until 2026-10-03, put all sixteen holes 0.5 out."

[[dim]]
sym = "BLOCK_W"
value = 44
provenance = "part"
note = "HGH20 block body width, measured. Only used for clearance - what is left between the rows, and where the lower row's bottom edge falls against the doubler."

[[dim]]
sym = "BLOCK_ROW_GAP_GEOM"
expr = "RAIL_PITCH - BLOCK_W"
note = "The gap the geometry actually produces once the rails are in the outside T-slots: 46. One more than the measured 45, which is why 45 is kept as the conservative clearance number rather than corrected."

[[dim]]
sym = "BEAM_SEAM_XEP"
expr = "NUT_FACE_BELOW_BEAM + EXT_W"
note = "The Y beam's seam - where the two stacked extrusions meet - in the X end plate's own frame, measured from the plate's bottom end. 122.525, and Sheet 2a's encoder bore was independently placed at 122.5, which is the cross-check that this whole vertical chain closes."

[[dim]]
sym = "RAIL_LOW_XEP"
expr = "NUT_FACE_BELOW_BEAM + RAIL_LOW_Z"
note = "Lower Y rail centreline in the end plate's frame = the lower block row's centre. 77.525, drawn and scheduled at 77.5."

[[dim]]
sym = "RAIL_HIGH_XEP"
expr = "NUT_FACE_BELOW_BEAM + RAIL_HIGH_Z"
note = "Upper Y rail centreline in the end plate's frame = the upper block row's centre. 167.525, drawn and scheduled at 167.5."

[[dim]]
sym = "BLOCK_PITCH_X"
value = 32
provenance = "part"
note = "HGH20 block mounting pattern, across the block. Was the oldest open item on the pre-trip checklist."
source = "spec sheet supplied with the X/Y kit, read 2026-10-03"

[[dim]]
sym = "BLOCK_PITCH_Y"
value = 36
provenance = "part"
note = "HGH20 block mounting pattern, along the rail. Pairs with BLOCK_PITCH_X."
source = "spec sheet supplied with the X/Y kit, read 2026-10-03"

# ---------------------------------------------------------------- plate thicknesses

[[dim]]
sym = "T_X_ENDPLATE"
value = 12.19
provenance = "measured"
note = "1/2in 6061, HIS MICROMETER in several places 2026-10-07: 12.19, not the 12.7 nominal this was carried at. That is 0.48in stock sold as half inch, and 0.61 per plate - so 1.22 across the machine, which is why REAR_PLATE_L moved. The entry had said CALIPER IT because two other nominals had already been wrong; this is the third."
source = "machine/end-plates-risers-and-spindle.md"

[[dim]]
sym = "T_DOUBLER"
expr = "T_X_ENDPLATE"
note = "The doubler IS the end plate's offcut - 200 wide stock less the plate's 154 leaves the 45 strip, which is where DOUBLER_H comes from. So it is the same piece of metal and cannot have its own thickness. It was carried as an independent 12.7 and would have stayed at 12.7 when the end plate went to 12.19, which is the drift this expression removes."

[[dim]]
sym = "T_SOLE_BRACKET"
value = 6.35
provenance = "nominal"
note = "1/4in 6061"

[[dim]]
sym = "T_INTERPOSER"
value = 10
provenance = "part"
note = "10 mm, HIS PART 2026-10-08 - metric plate, NOT the 3/8in (9.525) this was carried at as a nominal. 🔴 SECOND PART ON THIS MACHINE TO COME BACK METRIC WHERE THE FILE ASSUMED IMPERIAL, and from the same direction: T_FIN was corrected to a measured 10 for the fin square on 2026-10-02 with the same words - not 3/8in and not 1/2in. It feeds 21 symbols, so it is the single highest-reach nominal in this file and it is now his number rather than a fraction it was sold as. ⚠ CALIPER IT ON ARRIVAL anyway: 10 nominal is still a nominal, and the two parts it most affects - the BF12 row and the X end plate stack - are both one-shot."

[[dim]]
sym = "T_FIN"
value = 10
provenance = "measured"
note = "His caliper on the fin stock: 10, metric plate, NOT 3/8in (9.525) and not 1/2in. \u26a0 THIS NOTE SAID 'the 302 square' AND BOTH HALVES OF THAT WERE OVERTAKEN - the piece measures 301.625 (PLATE_H), and as of 2026-10-08 each fin has its own piece rather than both nesting out of one square. The 10 is the part of the reading that was ever about thickness and it is unchanged."
source = "measured 2026-10-02"

[[dim]]
sym = "T_SIDE_PLATE"
value = 3.429
provenance = "part"
note = "\U0001f534 ORDERED 10 GAUGE, NOT 1/8in - 3.429, and the sales order is the authority. The line reads CSH 10GA(.135) x 11-7/8in x 39-5/16in CR, two pieces, cold-rolled carbon sheet, and .135in x 25.4 is 3.429. \u2705 THAT CLOSES THE OPEN: this symbol carried a nominal 1/8in (3.175) with a standing question about the listing also saying 11 gauge (3.04), and a 3.36 had been floated and withdrawn as a guess. None of the three was right and the question is now answered by a part that has been bought rather than by a better reading of a listing. \u26a0 IT FEEDS 17 SYMBOLS and the 0.254 it moved is not cosmetic in two of them: REAR_PLATE_L is the flush-envelope length and it grows by 0.508 to 1211.238, while the back plate was ORDERED at 47 21/32in = 1210.47 - so the plate no longer reaches flush and that gap is open. FIN_PROUD comes down to 16.571. Still caliper the delivered sheet: 10 gauge sheet is a gauge, and the gauge is the nominal."
source = "Specialty Metals Corp sales order W053768, 2026-10-08"

[[dim]]
sym = "T_BACK_JOIN_PLATE"
value = 6.35
provenance = "part"
note = "1/4in 6061, X back joining plate across the beam seam - ORDERED as a true 1/4in, same call as T_REAR_PLATE. The sales order line reads APL 0.25in x 4.6875in x 39.3125in 6061 T651, one piece, so the temper is T651 and the piece is sheared 119.0625 x 998.5375. \u26a0 SHEET 10 DRAWS IT 120 x 1000 and the ordered piece is neither: see XBJ_W and XBJ_L."
source = "Specialty Metals Corp sales order W053768, 2026-10-08"

[[dim]]
sym = "XBJ_W"
value = 119.0625
provenance = "part"
note = "119.0625, the ORDERED width of the X back joining plate - 4 11/16in, sheared. \u26a0 SHEET 10 DRAWS IT 120 AND CALLS THAT 'the full section height', which is the one claim the ordered piece breaks: it is 0.9375 shy of the 30-6060 pair's 120. It costs nothing because Sheet 10 is referenced to the plate's TOP edge, which is the beam's top face, so the four T-slot rows at 15 / 45 / 75 / 105 do not move and the shortfall lands at the BOTTOM, 14.06 below the last row instead of 15. \U0001f534 DO NOT RE-REFERENCE SHEET 10 TO ITS BOTTOM EDGE to 'fix' this - the top edge is the reference precisely because it is the face that registers against the beam, and the bottom edge of this plate registers against nothing."
source = "Specialty Metals Corp sales order W053768, 2026-10-08"

[[dim]]
sym = "XBJ_L"
value = 998.5375
provenance = "part"
note = "998.5375, the ORDERED length of the X back joining plate - 39 5/16in, sheared, the same shear length as the two side plates. Sheet 10 draws it 1000. Same shape of slack as SIDE_PLATE_L and the same reason it is harmless: the seven stations run 50 to 950, so 1.46 of margin disappears from the end the plate is not laid out from."
source = "Specialty Metals Corp sales order W053768, 2026-10-08"

# ---------------------------------------------------------------- X end plate

[[dim]]
sym = "XEP_W"
value = 154
provenance = "derived"
note = "Set by BLOCK_BUTTED at 154.18, rounded down. Not re-derived: narrowing buys nothing back, the blocks reach the rail end regardless."
source = "machine/end-plates-risers-and-spindle.md"

[[dim]]
sym = "XEP_TOP_ABOVE_BEAM"
value = 60
provenance = "derived"
note = "The plate stops at the top of the X beam's upper extrusion = EXT_W above the Y beam top"

[[dim]]
sym = "XEP_BOLT_REAR"
value = 15
provenance = "derived"
note = "Rear M8 pair from the plate's BACK EDGE. Beam back face flush with that edge, bolt EXT_BORE_INSET in."

[[dim]]
sym = "XEP_BOLT_FRONT"
expr = "EXT_W - EXT_BORE_INSET"
note = "Front M8 pair from the back edge. Follows from the bores being symmetric."

[[dim]]
sym = "BEAM_FRONT_FROM_BACK_EDGE"
expr = "EXT_W"
note = "The X beam's front face, from the plate's back edge. THE SHELF HOLES KEY OFF THIS - it moved on 2026-10-02 when the beam went flush, and that is what put the shelf's rear bolt at Y 0."

[[dim]]
sym = "BLOCK_CENTROID_Y"
expr = "XEP_W / 2"
note = "Y block group centroid, from the plate's back edge"

[[dim]]
sym = "BEAM_CENTRELINE_Y"
expr = "EXT_W / 2"
note = "X beam centreline from the plate's back edge, beam flush with it"

[[dim]]
sym = "HANG_ARM"
expr = "139 - (BLOCK_CENTROID_Y - BEAM_CENTRELINE_Y)"
note = "Arm from the block centroid to the forward-hanging mass. 139 is the centred case recorded in the prose."

# ---------------------------------------------------------------- the Y ball nut chain

[[dim]]
sym = "BK12_STANDOFF_ASBUILT"
value = 5
provenance = "measured"
note = "BK12/BF12 mounted 5 above the extrusion, AS BUILT. 🔴 DO NOT DELETE because the standoff no longer exists in the design - that is exactly why this is here. NUT_FACE_BELOW_BEAM_ASBUILT was measured WITH the standoff, so converting that measurement to the design has to take the 5 back off before adding the interposer. Removing this symbol would silently resize the X end plate: it feeds XEP_H, which is the 242.5."

[[dim]]
sym = "NUT_FACE_BELOW_BEAM_ASBUILT"
value = 58
provenance = "measured"
note = "Beam underside to the ball nut's downward mounting face, as built with the 5 mm standoff"
source = "measured 2026-10-02"

[[dim]]
sym = "NUT_FACE_BELOW_BEAM"
expr = "NUT_FACE_BELOW_BEAM_ASBUILT + (T_INTERPOSER - BK12_STANDOFF_ASBUILT)"
note = "The interposer replaces the 5 mm standoff, so the nut face drops by the difference"

[[dim]]
sym = "XEP_H"
expr = "XEP_TOP_ABOVE_BEAM + BEAM_H + NUT_FACE_BELOW_BEAM"
note = "X end plate height. Bottom level with the nut's mounting face."

[[dim]]
sym = "XEP_BOTTOM"
expr = "0 - (BEAM_H + NUT_FACE_BELOW_BEAM)"
note = "Plate bottom, measured from the Y beam top. Negative is down."

[[dim]]
sym = "SCREW_AXIS_X"
expr = "T_X_ENDPLATE + RAIL_STACK + (EXT_W / 2)"
note = "Y screw centreline, from the X end plate's INNER face. The (EXT_W / 2) term is BY CONSTRUCTION, not an assumption: the BK12 and BF12 support blocks are 60 wide and the BF12 tongue is cut 60 wide to match, so the screw is centred in 60 by the parts themselves. Reconciled against a measurement 2026-10-03: it leaves 21.81 of air past the doubler, which meets the 20 minimum."

[[dim]]
sym = "NUT_FACE_X"
value = 52
provenance = "vendor"
note = "Ball nut mounting face, along X. The long dimension, parallel with the X beam."
source = "given 2026-10-02"

[[dim]]
sym = "NUT_FACE_Y"
value = 40
provenance = "vendor"
note = "Ball nut mounting face, along Y"
source = "given 2026-10-02"

[[dim]]
sym = "NUT_PATTERN_X"
value = 40
provenance = "vendor"
note = "4 x M5 THREADED INTO THE NUT - not through-holes. Pattern along X."

[[dim]]
sym = "NUT_PATTERN_Y"
value = 24
provenance = "vendor"
note = "Pattern along Y"

[[dim]]
sym = "NUT_INSET_X"
expr = "(NUT_FACE_X - NUT_PATTERN_X) / 2"
note = "Closes exactly at 6, which is how the centred pattern was confirmed"

[[dim]]
sym = "NUT_INSET_Y"
expr = "(NUT_FACE_Y - NUT_PATTERN_Y) / 2"
note = "Closes exactly at 8. A 7 was given first and corrected."

[[dim]]
sym = "NUT_BOLT_X_NEAR"
expr = "SCREW_AXIS_X - (NUT_PATTERN_X / 2)"
note = "Inboard M5 column, from the end plate's inner face"

[[dim]]
sym = "NUT_BOLT_X_FAR"
expr = "SCREW_AXIS_X + (NUT_PATTERN_X / 2)"
note = "Outboard M5 column"

[[dim]]
sym = "SOLE_REACH"
expr = "(SCREW_AXIS_X + (NUT_FACE_X / 2)) - (T_X_ENDPLATE + T_DOUBLER)"
note = "Free span of the sole bracket, doubler's outer face to the nut face's outboard edge"

[[dim]]
sym = "NUT_AIR_MIN"
value = 20
provenance = "part"
note = "REQUIRED minimum clear air between the doubler's outer face and the ball nut's side. His number, 2026-10-03, off the Y beam build."

[[dim]]
sym = "NUT_AIR_CLEAR"
expr = "(SCREW_AXIS_X - (NUT_FACE_X / 2)) - (T_X_ENDPLATE + T_DOUBLER)"
note = "Actual clear air, doubler's outer face to the nut's near edge. Comes out 21.81, so it clears NUT_AIR_MIN by 1.81. If this ever drops below NUT_AIR_MIN the stack has moved."

[[dim]]
sym = "SOLE_BRACKET_L"
expr = "SCREW_AXIS_X + (NUT_FACE_X / 2)"
note = "Sole bracket root to tip, from the plate's INNER face - the root covers the stacked plate and doubler end faces, so the 24.38 seating is INSIDE this length, not added to it. Comes out 98.19, flush with the nut's outboard edge. A 107.4 drawn 2026-10-02 added the seating twice."

[[dim]]
sym = "ROOT_BOLT_X_ENDPLATE"
expr = "T_X_ENDPLATE / 2"
note = "Sole bracket's R5-R8 row, from the plate's INNER face. Centred in the end plate's own thickness - FORCED, not chosen: a row off its plate's mid-thickness breaks out of it. Spotted at home through the bracket, so this is for drawing it, not for setting a mill."

[[dim]]
sym = "ROOT_BOLT_X_DOUBLER"
expr = "T_X_ENDPLATE + (T_DOUBLER / 2)"
note = "Sole bracket's R1-R4 row, from the plate's INNER face. Centred in the doubler's own thickness, same reasoning as ROOT_BOLT_X_ENDPLATE. These are the only edge holes that need the mill - Sheet 2 carries them as B1-B4."

[[dim]]
sym = "ROOT_BOLT_Y_FIRST"
value = 32
provenance = "derived"
note = "First of four Y stations across the 154 root, settled 2026-10-03. D1-D4, R1-R4 and R5-R8 all sit on the same stations, so one spread serves the doubler bolts and both sole-bracket rows."

[[dim]]
sym = "ROOT_BOLT_Y_PITCH"
value = 30
provenance = "derived"
note = "Pitch of those four stations: 32, 62, 92, 122. Leaves 32 of edge at each end of the 154."

[[dim]]
sym = "THRUST_ARM"
expr = "SCREW_AXIS_X - T_X_ENDPLATE"
note = "Drive thrust outboard of the plate's OUTER face. This is what the doubler and the two bolt rows are for."

[[dim]]
sym = "DOUBLER_SEATING"
expr = "T_X_ENDPLATE + T_DOUBLER"
note = "Seating width at the plate's bottom with the doubler on"

[[dim]]
sym = "DOUBLER_H"
value = 45
provenance = "derived"
note = "Doubler height. 45, so it can come out of OFFCUTS - his reason, and the only one it needs: nothing requires a particular height here. THE CONSTRAINT IS AN UPPER BOUND, NOT A FIT: the doubler shares a face with the LOWER Y BEARING BLOCK ROW, whose bottom edge lands at 55.5 (the lower rail at 77.5 less half the block's measured 44), so anything under that clears. 45 clears by 10.5; the earlier 50 cleared by 5.5; 60 overlapped by 4.5 and is what the bound was found for. NOT gated on the Y beam underside - the doubler sits ~17 inboard of the beam's inside face. An earlier note rounded the 55.5 to 56 and the clearance to 6; the 55.5 is the computed figure and is the one to use. dims.py deps: nothing derives from this, so changing it is local - but see DOUBLER_BOLT_X, which STOPPED being the midpoint when this moved."

# ---------------------------------------------------------------- the front fin

[[dim]]
sym = "FIN_STOCK"
expr = "PLATE_H"
note = "Each front fin's stock height, 301.625 - PLATE_H, because the fin stands as high as the other four plates and is dimensioned off the same bottom edge. It is 11 7/8in, his piece 2026-10-07; it had been carried as a measured 302 and it is not 302, nor the nominal 12in it was already corrected away from once. \u26a0 THE NAME SAYS SQUARE AND IT IS NO LONGER ONE: both fins came out of a SINGLE 301.625 square on one diagonal cut until 2026-10-08, when he put each fin on its OWN piece of 10 mm plate. That is what released FIN_TOP_W back to a chosen 100 and retired FIN_KERF - top plus base plus kerf no longer has to close on anything. Kept under this name because every sheet and both documents refer to it."

[[dim]]
sym = "FIN_KERF"
value = 2
provenance = "nominal"
note = "\U0001f534 RETIRED 2026-10-08 AND NOTHING DERIVES FROM IT. It was the bandsaw kerf of the single diagonal cut that nested both fins out of one 301.625 square. He put each fin on its own piece of plate instead, so there is no cut to allow for and FIN_TOP_W stopped being forced by it. Kept rather than deleted because it is the reason FIN_TOP_W reads 100 again rather than 99.625, and a bare deletion would leave that reversal with no record."

[[dim]]
sym = "FIN_BASE_W"
value = 200
provenance = "part"
note = "THE BASE IS THE REFERENCE, his call 2026-10-07 - so it is a fixed 200 and the top absorbs whatever the square leaves. The base is the end that bolts down and bears, which is why it gets to be the round number. It was the other way round until the square turned out to be 301.625 rather than 302, and then the shortfall was landing on the bearing end."

[[dim]]
sym = "FIN_TOP_W"
value = 100
provenance = "part"
note = "100, his choice, and it is CHOSEN AGAIN rather than derived - 2026-10-08. It was forced to 99.625 for as long as both fins nested out of one 301.625 square, because top plus base plus kerf had to close on the square or the two halves did not fit. Each fin is its own piece of plate now, so nothing couples the top width to the base width and the round number comes back. FIN_BASE_W stays the reference end at 200 for the reason it always was: it is the end that bolts down and bears."

[[dim]]
sym = "FIN_COL_OUTB"
value = 35
provenance = "derived"
note = "Outboard M8 column from the fin's outboard factory edge. CORRECTED from 20 - the 1.8 mm proud figure was computed off that dead value."

[[dim]]
sym = "FIN_COL_INB"
expr = "FIN_COL_OUTB + (EXT_W / 2)"
note = "Inboard M8 column. 65."

[[dim]]
sym = "FIN_OVERHANG"
expr = "FIN_COL_OUTB - EXT_BORE_INSET"
note = "Fin overhanging the Y beam's outboard face"

[[dim]]
sym = "FIN_PROUD"
expr = "FIN_OVERHANG - T_SIDE_PLATE"
note = "Fin proud of the side plate's outer face. WAS RECORDED AS 1.8 off the dead FIN_COL_OUTB of 20. The side TONGUE must terminate short of the riser's station - it would otherwise be held out by this 16.825 rather than seating on the side plate. The word 'curb' is retired as of 2026-10-04: it implied a face the plate drops in against, and there is no channel - the plate stands on the top skin and the tongue laps it from outboard."

[[dim]]
sym = "WINDOW_W"
value = 60.5
provenance = "derived"
