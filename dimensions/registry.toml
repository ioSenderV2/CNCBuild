note = "57, the Z rail centrelines either side of the carriage plate's centre, so a pitch of 114. 🔴 IT WAS CARRIED AS A MEASURED 57.5 AND SHEET 3a HAS ALWAYS DRAWN 57. The sheet puts R1a-g on Y 20 and R2a-g on Y 134 of a 154 plate - inset 20 from each long edge, which is 57 from the centre - and nobody had noticed the registry disagreeing by half a millimetre. The sheet wins: 20 from the edge is a design intent set with a stop block, where 57.5 was a reading off a carriage. That half millimetre is not cosmetic - it is what decides whether the block bolt columns land on whole numbers, and therefore the whole plate."

[[dim]]
