note = "50, the new bar across - metric, replacing the 2in (50.8) of the existing pair. His, 2026-10-08. It leaves 9 mm either side of the block's own 32 mm bolt pitch, and the 0.8 it gives up against 2in is what keeps the BF12 side clearance where it was once the rails came in to a 114 pitch - see BF12_SIDE_CLEAR."

[[dim]]
