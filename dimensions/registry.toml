expr = "EXT_W * 2"
note = "Every beam is a stacked pair - X, Y1 and Y2 alike"
source = "machine/gantry-beam-joint.md"

# ---------------------------------------------------------------- linear motion

[[dim]]
sym = "RAIL_SLOT_INSET"
value = 15
provenance = "measured"
note = "The two rails on a beam go in the OUTSIDE T-slot of each stacked extrusion - X, Y1 and Y2 all the same, confirmed by him again 2026-10-03. On a 30-6060 that slot centre is 15 from the extrusion's outer face, the same 15 as EXT_BORE_INSET and for the same reason: the 30 series puts both on the module grid. NOT NEW: gantry-beam-joint.md's measured table has carried 'rail spacing X 90 mm, the outermost of the four front slots, at 15 and 105 up the section' since 2026-10-01. It had simply never been lifted into the registry, which is how a question already closed on the bench came to be asked again."
source = "machine/gantry-beam-joint.md, measured table, confirmed 2026-10-01"

[[dim]]
sym = "RAIL_LOW_Z"
expr = "RAIL_SLOT_INSET"
note = "Lower rail centreline, from the beam's BOTTOM face. Beam-local, so it reads the same on X, Y1 and Y2."

[[dim]]
sym = "RAIL_HIGH_Z"
expr = "BEAM_H - RAIL_SLOT_INSET"
note = "Upper rail centreline, from the beam's bottom face. 105."

[[dim]]
sym = "RAIL_PITCH"
expr = "RAIL_HIGH_Z - RAIL_LOW_Z"
note = "90, and it agrees exactly with the measured 90 in gantry-beam-joint.md. The outside slot is used because it is the widest the pair can be spread on a 120 beam; this is the couple that resists nod, so it is a stiffness number, not a convenience. It is also what lays out Sheet 2a's sixteen block holes - see BLOCK_ROW_GAP for what does not."

[[dim]]
sym = "RAIL_STACK"
value = 30
provenance = "measured"
note = "HGR20 rail plus HGH20 block, plate face to rail mounting face"
source = "measured 2026-10-02, X/Y kit"

[[dim]]
sym = "BLOCK_BUTTED"
value = 154.18
provenance = "measured"
note = "Two HGH20 blocks butted, full body. Sets the X end plate width."
source = "machine/photos/y-bearing-blocks-butted-154.jpg, calipers 2026-10-02"

[[dim]]
sym = "BLOCK_PADS"
value = 128.24
provenance = "measured"
note = "Two blocks butted, MACHINED PADS ONLY. The functional bearing floor."
source = "machine/photos/y-bearing-blocks-machined-pads-128.jpg, calipers 2026-10-02"

[[dim]]
sym = "BLOCK_ROW_GAP"
value = 45
provenance = "measured"
note = "Facing edges of the upper and lower Y block rows, measured. \u26a0 IT DOES NOT LAY OUT THE 16 BOLT HOLES - settled by him 2026-10-03. The rows are set by the rails, which sit in the beams' OUTSIDE T-slots and are therefore RAIL_PITCH apart; the geometric gap that follows is BLOCK_ROW_GAP_GEOM at 46. What it actually describes is a KEEP-OUT, his words 2026-10-03: the magnetic linear encoder tape runs down this gap and the 35 dia sensor rides over the tape, both centred on the beam's seam. Keep it at 45 - under-stating a keep-out is safe. THREE NUMBERS EXIST FOR THIS GAP and they do not agree: 45 here, 46 from the geometry (BLOCK_ROW_GAP_GEOM = 90 rail pitch less a 44 block), and 46.7 measured at a trial fit on the X beam's front face with a photo behind it, in gantry-beam-joint.md. On a 90 pitch those imply block widths of 45, 44 and 43.3. HGH20 is 44 nominal, so the geometric 46 is the one to believe and both measurements are loose. It does not matter: nothing is laid out from this, and the smallest value is the safe one for a keep-out. Using it as a layout datum, which is what happened until 2026-10-03, put all sixteen holes 0.5 out."

[[dim]]
sym = "BLOCK_W"
value = 44
provenance = "part"
note = "HGH20 block body width, measured. Only used for clearance - what is left between the rows, and where the lower row's bottom edge falls against the doubler."

[[dim]]
sym = "BLOCK_ROW_GAP_GEOM"
expr = "RAIL_PITCH - BLOCK_W"
note = "The gap the geometry actually produces once the rails are in the outside T-slots: 46. One more than the measured 45, which is why 45 is kept as the conservative clearance number rather than corrected."

[[dim]]
sym = "BEAM_SEAM_XEP"
expr = "NUT_FACE_BELOW_BEAM + EXT_W"
note = "The Y beam's seam - where the two stacked extrusions meet - in the X end plate's own frame, measured from the plate's bottom end. 122.525, and Sheet 2a's encoder bore was independently placed at 122.5, which is the cross-check that this whole vertical chain closes."

[[dim]]
sym = "RAIL_LOW_XEP"
expr = "NUT_FACE_BELOW_BEAM + RAIL_LOW_Z"
note = "Lower Y rail centreline in the end plate's frame = the lower block row's centre. 77.525, drawn and scheduled at 77.5."

[[dim]]
sym = "RAIL_HIGH_XEP"
expr = "NUT_FACE_BELOW_BEAM + RAIL_HIGH_Z"
note = "Upper Y rail centreline in the end plate's frame = the upper block row's centre. 167.525, drawn and scheduled at 167.5."

[[dim]]
sym = "BLOCK_PITCH_X"
value = 32
provenance = "part"
note = "HGH20 block mounting pattern, across the block. Was the oldest open item on the pre-trip checklist."
source = "spec sheet supplied with the X/Y kit, read 2026-10-03"

[[dim]]
sym = "BLOCK_PITCH_Y"
value = 36
provenance = "part"
note = "HGH20 block mounting pattern, along the rail. Pairs with BLOCK_PITCH_X."
source = "spec sheet supplied with the X/Y kit, read 2026-10-03"

