# ---------------------------------------------------------------- the Y ball nut chain

[[dim]]
sym = "BK12_STANDOFF_ASBUILT"
value = 5
provenance = "measured"
note = "BK12/BF12 mounted 5 above the extrusion, AS BUILT. 🔴 DO NOT DELETE because the standoff no longer exists in the design - that is exactly why this is here. NUT_FACE_BELOW_BEAM_ASBUILT was measured WITH the standoff, so converting that measurement to the design has to take the 5 back off before adding the interposer. Removing this symbol would silently resize the X end plate: it feeds XEP_H, which is the 242.5."

[[dim]]
sym = "NUT_FACE_BELOW_BEAM_ASBUILT"
value = 58
provenance = "measured"
note = "Beam underside to the ball nut's downward mounting face, as built with the 5 mm standoff"
source = "measured 2026-10-02"

[[dim]]
sym = "NUT_FACE_BELOW_BEAM"
expr = "NUT_FACE_BELOW_BEAM_ASBUILT + (T_INTERPOSER - BK12_STANDOFF_ASBUILT)"
note = "The interposer replaces the 5 mm standoff, so the nut face drops by the difference"

[[dim]]
sym = "XEP_H"
expr = "XEP_TOP_ABOVE_BEAM + BEAM_H + NUT_FACE_BELOW_BEAM"
note = "X end plate height. Bottom level with the nut's mounting face."

[[dim]]
sym = "XEP_BOTTOM"
expr = "0 - (BEAM_H + NUT_FACE_BELOW_BEAM)"
note = "Plate bottom, measured from the Y beam top. Negative is down."

[[dim]]
sym = "SCREW_AXIS_X"
expr = "T_X_ENDPLATE + RAIL_STACK + (EXT_W / 2)"
note = "Y screw centreline, from the X end plate's INNER face. The (EXT_W / 2) term is BY CONSTRUCTION, not an assumption: the BK12 and BF12 support blocks are 60 wide and the BF12 tongue is cut 60 wide to match, so the screw is centred in 60 by the parts themselves. Reconciled against a measurement 2026-10-03: it leaves 21.3 of air past the doubler, which meets the 20 minimum."

[[dim]]
sym = "NUT_FACE_X"
value = 52
provenance = "vendor"
note = "Ball nut mounting face, along X. The long dimension, parallel with the X beam."
source = "given 2026-10-02"

[[dim]]
sym = "NUT_FACE_Y"
value = 40
provenance = "vendor"
note = "Ball nut mounting face, along Y"
source = "given 2026-10-02"

[[dim]]
sym = "NUT_PATTERN_X"
value = 40
provenance = "vendor"
note = "4 x M5 THREADED INTO THE NUT - not through-holes. Pattern along X."

[[dim]]
sym = "NUT_PATTERN_Y"
value = 24
provenance = "vendor"
note = "Pattern along Y"

[[dim]]
sym = "NUT_INSET_X"
expr = "(NUT_FACE_X - NUT_PATTERN_X) / 2"
note = "Closes exactly at 6, which is how the centred pattern was confirmed"

[[dim]]
sym = "NUT_INSET_Y"
expr = "(NUT_FACE_Y - NUT_PATTERN_Y) / 2"
note = "Closes exactly at 8. A 7 was given first and corrected."

[[dim]]
sym = "NUT_BOLT_X_NEAR"
expr = "SCREW_AXIS_X - (NUT_PATTERN_X / 2)"
note = "Inboard M5 column, from the end plate's inner face"

[[dim]]
sym = "NUT_BOLT_X_FAR"
expr = "SCREW_AXIS_X + (NUT_PATTERN_X / 2)"
note = "Outboard M5 column"

[[dim]]
sym = "SOLE_REACH"
expr = "(SCREW_AXIS_X + (NUT_FACE_X / 2)) - (T_X_ENDPLATE + T_DOUBLER)"
note = "Free span of the sole bracket, doubler's outer face to the nut face's outboard edge"

[[dim]]
sym = "NUT_AIR_MIN"
value = 20
provenance = "part"
note = "REQUIRED minimum clear air between the doubler's outer face and the ball nut's side. His number, 2026-10-03, off the Y beam build."

[[dim]]
sym = "NUT_AIR_CLEAR"
expr = "(SCREW_AXIS_X - (NUT_FACE_X / 2)) - (T_X_ENDPLATE + T_DOUBLER)"
note = "Actual clear air, doubler's outer face to the nut's near edge. Comes out 21.3, so it clears NUT_AIR_MIN by 1.3. If this ever drops below NUT_AIR_MIN the stack has moved."

[[dim]]
sym = "SOLE_BRACKET_L"
expr = "SCREW_AXIS_X + (NUT_FACE_X / 2)"
note = "Sole bracket root to tip, from the plate's INNER face - the root covers the stacked plate and doubler end faces, so the 25.4 seating is INSIDE this length, not added to it. Comes out 98.7, flush with the nut's outboard edge. A 107.4 drawn 2026-10-02 added the seating twice."

[[dim]]
sym = "ROOT_BOLT_X_ENDPLATE"
expr = "T_X_ENDPLATE / 2"
note = "Sole bracket's R5-R8 row, from the plate's INNER face. Centred in the end plate's own thickness - FORCED, not chosen: a row off its plate's mid-thickness breaks out of it. Spotted at home through the bracket, so this is for drawing it, not for setting a mill."

[[dim]]
sym = "ROOT_BOLT_X_DOUBLER"
expr = "T_X_ENDPLATE + (T_DOUBLER / 2)"
note = "Sole bracket's R1-R4 row, from the plate's INNER face. Centred in the doubler's own thickness, same reasoning as ROOT_BOLT_X_ENDPLATE. These are the only edge holes that need the mill - Sheet 2 carries them as B1-B4."

[[dim]]
sym = "ROOT_BOLT_Y_FIRST"
value = 32
provenance = "derived"
note = "First of four Y stations across the 154 root, settled 2026-10-03. D1-D4, R1-R4 and R5-R8 all sit on the same stations, so one spread serves the doubler bolts and both sole-bracket rows."

[[dim]]
sym = "ROOT_BOLT_Y_PITCH"
value = 30
provenance = "derived"
note = "Pitch of those four stations: 32, 62, 92, 122. Leaves 32 of edge at each end of the 154."

[[dim]]
sym = "THRUST_ARM"
expr = "SCREW_AXIS_X - T_X_ENDPLATE"
note = "Drive thrust outboard of the plate's OUTER face. This is what the doubler and the two bolt rows are for."

[[dim]]
sym = "DOUBLER_SEATING"
expr = "T_X_ENDPLATE + T_DOUBLER"
note = "Seating width at the plate's bottom with the doubler on"

[[dim]]
sym = "DOUBLER_H"
value = 50
provenance = "derived"
note = "Closed 2026-10-03 at 50. Gated on the LOWER BLOCK ROW bottom edge, which shares this face and lands at X 56 once the block's measured 44 width is applied - so 50 clears by 6 and the earlier 60 overlapped by 4. NOT gated on the Y beam underside."

