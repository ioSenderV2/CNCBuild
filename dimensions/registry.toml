[[dim]]
sym = "INTERPOSER_PROUD"
value = 30
provenance = "derived"
note = "How far the interposer's outboard end stands past the fin's outer face, so the casting and bar protrude through the window together. y-beam-support.md's 30 mm protrusion, which it calls the thing that sets everything else at that end."

[[dim]]
