[[joint]]
id = "spindle-clamp"
what = "Spindle clamps to the Z plate"
size = 8
count = 4
length = 90
groups = [["Z plate", 4]]
head = "socket"
into = "tapped"
source = "registry BOLT_SPINDLE_CLAMP = 90"

[[joint]]
id = "sole-to-nut"
what = "Sole plate into the ball nut's own threads - Y1, Y2 and X"
size = 5
count = 12
per = "4 per nut, three nuts"
length = 16
head = "socket"
into = "tapped"
grip = ["T_SOLE_BRACKET"]
source = "registry BOLT_Z_NUT = 16"
note = "THE BOLT PASSES THROUGH THE SOLE PLATE AND THREADS INTO THE NUT BODY - his correction: the nut is what is tapped, so it is not bolted to anything, the plate is bolted to it. On Y that is upward into a face pointing down; on X downward into one pointing up. SETTLED: THE SAME M5 x 16 SERVES ALL FOUR NUTS - chosen over an M5 x 12 on Y so one length and one tap setting cover the build. OPEN: THE HOUSING MUST BE TAPPED DEEPER FIRST - see NUT_TAP_DEPTH; his recollection of the as-supplied thread (6, tapped to 11) does not match the file (8, tapped to 12 working), and 9.65 of engagement fits under either."

[[joint]]
id = "sole-to-doubler"
what = "Sole plate into the doubler's end edge - R1-R4, three plates"
size = 5
count = 12
per = "4 per plate, three plates"
length = 16
head = "socket"
into = "tapped"
grip = ["T_SOLE_BRACKET"]
source = "registry BOLT_SOLE_ROOT = BOLT_Z_NUT = 16"
note = "THE ONLY EDGE DRILLING ON THIS ASSEMBLY, and the one row that holds the sole plate on - the base butts the strip of plate past the doubler and takes nothing into it. FLAG: IT BORES STRAIGHT AT THE D BOLT. D1-D4 sit at DOUBLER_BOLT_X on these same four Y stations, so each hole points at one of them and is capped at SOLE_ROOT_TAP_DEPTH with SOLE_ROOT_WALL of aluminium left. SOLE_ROOT_ENGAGE is 9.65, so the cap costs nothing. Same bolt as the nut row, so this whole joint is one length."

[[joint]]
id = "doubler-to-plate"
what = "Doubler to the plate it backs, through the plate - D1-D4"
size = 5
count = 12
per = "4 per doubler, three doublers"
length = 22
head = "socket"
into = "tapped"
grip = ["T_X_ENDPLATE"]
source = "registry BOLT_DOUBLER_TO_PLATE = 22"
note = "These run through the plate in SHEAR and thread into the doubler. CLEARANCE IN THE PLATE, TAPPED THROUGH IN THE DOUBLER - Sheet 2a drills ø6 and Sheet 2d ø4.2 and taps it right through, which is easier than a blind hole and leaves the bolt length as the only thing stopping the tip short. SETTLED: HIS CHECK AGAINST THE PARTS - an M5 x 25 just reaches the doubler's far face, so a stock 22 is the size under it, leaving DOUBLER_BOLT_BREAKOUT. The X carriage plate is 12.7 against the end plate's 12.19, so on X the half millimetre comes off engagement rather than off that margin."

[[joint]]
id = "post-tenon-screw"
what = "RETIRED - nothing fastens the box to the posts"
count = 0
into = "wood"
source = "his call 2026-10-15"
note = "SETTLED: ELIMINATED 2026-10-15. One angled screw per tenon was carried for two cases that can separate box from post - road shock above 1 g, which momentarily unloads a gravity-only joint, and a lift taken under the BOX instead of the frame, which leaves the posts hanging from their tenons. THE STRAP OVER THE BOX TO THE BASE FRAME COVERS BOTH and was always the restraint to rely on; the screws added a small margin at the price of being an irreversible step inside the glue-up, and the size and length were never settled in all the time they were carried. Kept at count 0 rather than deleted so the schedule does not look like it simply forgot the joint."

[[joint]]
id = "base-slot-bolt"
what = "Every dry joint that lands in a leg slot - the fore-aft rail tongues and the central wall's two ends"
size = 8
count = 22
per = "two per rail tongue, eight tongues; three per wall end, two ends"
length = 90
groups = [["Fore-aft rail tongues", 16], ["Central wall ends", 6]]
head = "flange"
into = "nut"
grip = ["TONGUE_BOLT_GRIP", "FENDER_WASHER_T", "FENDER_WASHER_T"]
extras = ["M8 fender washer", "M8 fender washer", "M8 flange lock nut"]
source = "his"
note = "FLANGE BOLT ONE END, FLANGE LOCK NUT THE OTHER, with ONE M8 fender washer under each - his. ONE LENGTH DOES THE WHOLE FAMILY: every tongue is 36 and fills its slot, so a lower rail, an upper rail and the central wall all cross the same TONGUE_BOLT_GRIP of 72 - strip, tongue, far strip. The 90 leaves BASE_BOLT_SPARE past the far washer. OPEN: THE FLANGE LOCK NUT'S HEIGHT IS NOT RECORDED - caliper it against that spare, and on a nylon-insert nut check the thread reaches the insert at the top rather than stopping in the metal below. FLAG: THE FENDER IS NOT OPTIONAL BECAUSE THE BOLT HAS A FLANGE. The clamp goes into plywood face, where a flange alone dishes in at torque and the joint is loose again - which is the whole reason this family is bolted rather than dowelled. NOTE: THE LOWER RAIL'S TWO OUTBOARD LAMINATIONS ARE NOT IN THE PATH - they butt a leg's face at each end rather than passing through the slot."
