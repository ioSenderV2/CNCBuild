# The fastener schedule.
#
# WHY THIS EXISTS: the registry knows where every fastener GOES - it is full of
# BOLT_* position symbols - and it did not know how LONG any of them is. Lengths
# lived scattered in prose, and the length is the figure that gets guessed at the
# bench. This repo has been bitten by that twice in one day: an M8 x 25 that
# engaged 4 mm because a T-nut's thread sits in the BOTTOM of a 25 skin, and a
# fin bolt that had to be 16 rather than 15.
#
# RULES FOR THIS FILE, and they are the point of it:
#   - `length` is filled ONLY where a file or he states one. Blank means
#     UNKNOWN and the tool reports it. Nothing here is inferred.
#   - `source` says where the entry came from. An entry with no source is a
#     guess and should not be here.
#   - `grip` is the stack the bolt passes through before it meets thread,
#     written as registry symbols so it moves when they do. Where the stack is
#     not known, leave it out rather than approximate it.
#   - `into` says what carries the thread: tapped, t-nut, nut, or bore.
#
# Read with tools/make-fasteners.py.

[[joint]]
id = "rail-to-beam"
what = "Linear rails to the X, Y1 and Y2 beams"
size = 5
count = 102
per = "17 per rail, two rails per beam, three beams"
length = 16
into = "t-nut"
source = "his count 2026-10-11; length from assembly.md 'M5 x 16 into T-nuts, 17 per rail at 60 mm'"
note = "o6 through with a o9.5 counterbore. An M6 head will not enter a 9.5 counterbore. COUNT CORRECTED FROM 68: this file had four rails, but README says ONE RAIL PER PROFILE and a beam is two stacked 30-6060, so it is six rails across the three beams, not four."

[[joint]]
id = "z-rail-to-carriage"
what = "Z rails to the X carriage plate"
size = 5
count = 14
per = "7 per rail, two rails"
length = 20
into = "tapped"
grip = ["Z_RAIL_BOLT_GRIP"]
source = "his, 2026-10-11"
note = "TAPPED INTO THE PLATE, not a T-nut - the X carriage plate is 1/2in and carries the thread itself. 10 of engagement, and it stops 2.7 SHORT of the far face, so nothing breaks through to the back of the plate. 🔴 A DIFFERENT KIT from the beam rails: 7 holes on a 400 rail against 17 at 60 on the metre rails, and the repo warns against quoting one kit's figures for the other."

[[joint]]
id = "front-strip"
what = "Front joining strips to the beams"
size = 8
count = 42
length = 10
into = "t-nut"
grip = ["T_FRONT_STRIP"]
source = "assembly.md: 'The buy: 42 x M8 x 10 A4 / 316 (front strips)'"
note = "A4/316. An M8 x 12 in the 4 mm strip reaches 8.0 past the plate against a 7.2 limit - the length is NOT interchangeable with the X back plate's 12."

[[joint]]
id = "y-back-plate"
what = "Y back joining plates to the beams"
size = 8
count = 56
length = 10
into = "t-nut"
source = "assembly.md: '56 x M8 x 10 plain + 56 washers (Y backs)'"
note = "Plain, plus a washer each."

[[joint]]
id = "x-back-plate"
what = "X back joining plate to the beam"
size = 8
count = 28
length = 14
into = "t-nut"
grip = ["T_BACK_JOIN_PLATE"]
source = "his, 2026-10-11 - 14, not the 12 assembly.md gave"
note = "🔴 IT WAS 12 UNTIL HE CORRECTED IT, from assembly.md's '28 x M8 x 12 (X back)'. The 2 buys thread in the T-nut and the plate is the same, so nothing else moves."

[[joint]]
id = "interposer-to-beam"
what = "Interposer bars up into the beam's T-slots"
size = 8
count = 12
per = "4 per bar, three bars"
length = 20
into = "t-nut"
grip = ["T_INTERPOSER"]
source = "his, 2026-10-11; the 3D model independently draws 4 per bar"
note = "EVERYTHING BELOW THE BEAM IS IN TENSION HERE - these hold the bar UP against the beam's underside. 🔴 COUNT CORRECTED FROM 18: assembly.md said six per bar in three rows, but make-3d draws TWO rows x TWO slots = four, and he says four. The model and he agree; the prose was the odd one out. ✅ 20 LONG TAKES ALL 6 OF THE T-NUT'S THREAD - see TNUT_THREAD_M8 - with 10 left after the interposer."

[[joint]]
id = "stepper-to-frame"
what = "Stepper motors to the cast stepper frame"
size = 4
count = 16
per = "4 per motor"
length = 16
into = "tapped"
source = "his, 2026-10-11"
note = "🔴 THIS JOINT WAS MISSING FROM THE SCHEDULE ENTIRELY until he listed it - every motor on the machine hangs on these and not one was counted. NO GRIP RECORDED: the frame's thickness at the motor face is not a figure in the registry, so engagement is left blank rather than approximated."

[[joint]]
id = "casting-rails"
what = "Cast stepper frame, through its rails into the interposer"
size = 5
count = 6
per = "2 per casting, three castings"
length = 35
into = "tapped"
grip = ["CASTING_RAIL_H"]   # the interposer is TAPPED, so it is thread, not grip
source = "his, 2026-10-11 - 35, corrected down from 40 the same day"
note = "⚠ THE 35 LEAVES 5 OF ENGAGEMENT in the interposer, EXACTLY 1 x D on an M5, where the 40 gave 10. His call. It sits right on the threshold: the under-one-diameter check is strictly less-than, so this passes without a flag - it is the thinnest engagement on the machine that the tool will not warn about."

[[joint]]
id = "casting-block"
what = "Cast stepper frame, either side of the bearing block, into the interposer"
size = 5
count = 12
per = "4 per casting, three castings"
length = 45
into = "tapped"
grip = ["CASTING_T_AT_BLOCK"]   # ditto - tapped, not grip
source = "his, 2026-10-11"

[[joint]]
id = "bf12-to-rear-plate"
what = "BF12 face-mounted into the 1/4in rear plate, Y1 and Y2"
size = 5
count = 8
per = "4 per BF12, two BF12"
length = 25
into = "tapped"
grip = ["BF12_BODY_AT_BOLT"]
extras = []
source = "his, 2026-10-11"
note = "M5 x 25, giving 5 of engagement in the 6.35 plate - 1 x D in steel - and NOTHING PROTRUDES. 🔴 IT IS A DIFFERENT LENGTH FROM THE TONGUE'S for one reason: the same 30 bolt that stops 2.19 short in the 1/2in tongue runs 3.65 clean through a 1/4in plate. Shortening the bolt was taken over capping the stub with an acorn nut - one fewer part and one fewer step, and the stub was at the back of the machine where it did no harm anyway."

[[joint]]
id = "bf12-to-x-tongue"
what = "BF12 face-mounted into the X end plate's tongue"
size = 5
count = 4
per = "4 per BF12, one BF12"
length = 30
into = "tapped"
grip = ["BF12_BODY_AT_BOLT"]
source = "his, 2026-10-11"
note = "M5 x 30 into 1/2in plate: 10 of engagement, 2 x D, stopping 2.19 short of the far face. ✅ TWELVE IN TOTAL, SPLIT 8 PLUS 4 - his confirmation 2026-10-11. The eight are the rear plate's two BF12 at M5 x 25, these four are X's at 30, and the two lengths differ only because the plates do."

[[joint]]
id = "rear-plate-to-beam-ends"
what = "Rear plate into the ends of the Y1 and Y2 beams"
size = 8
count = 16
per = "8 per beam"
length = 35
into = "bore"
grip = ["T_REAR_PLATE"]
source = "his, 2026-10-11; assembly.md: '8 x M8 into each beam's corner bores - 16 bolts total'"
note = "🔴 THIS JOINT WAS MISSING FROM THE SCHEDULE ENTIRELY until he listed it - it is in assembly.md and was simply not transcribed. LENGTH STILL UNKNOWN: it wants T_REAR_PLATE of grip plus whatever engagement into the o6.65 corner bore, and the beam-to-endplate joint's M8 x 35 is the obvious comparison."

[[joint]]
id = "fin-to-beam-end"
what = "Front fin onto the end of each Y beam"
size = 8
count = 16
per = "8 per fin, two fins"
length = 35
into = "bore"
source = "his, 2026-10-11; assembly.md: '8 x M8 x 35 flange bolts into the o6.65 lengthwise corner bores'"
note = "Flange head. M8 x 35 leaves 22.3 in the extrusion. 🔴 THIS WAS ENTERED AS 'Y beams into the end plates' - MY MISLABEL. The section it came from is the FRONT FIN's, which is why its M8 columns are at 35 and 65 from the factory edge. Same bolts, wrong name, and a wrong name is how a joint gets counted twice or missed."

[[joint]]
id = "xep-to-xbeam"
what = "X end plates to the X beam's top extrusion corner bores"
size = 8
count = 8
per = "4 per plate"
length = 35
into = "bore"
grip = ["T_X_ENDPLATE"]
source = "his, 2026-10-11; assembly.md: '4 x M8 into the top extrusion's corner bores, 9 mm clearance'"
note = "Flange head, same 35 as the other two bore joints."

[[joint]]
id = "shelf-bar-horizontal"
what = "Shelf bar horizontally into the X end plate"
size = 8
count = 4
length = 35
into = "tapped"
grip = ["SHELF_BAR_W"]
source = "assembly.md: 'M8 x 35 into the end plate' and 'M8 x 35, not x 40'"
note = "Through 25.4 of bar into 12.7 of plate gives ~9.6 of engagement. AN M8 x 40 PROTRUDES ~1.6 ONTO THE Y BEARING BLOCK."

[[joint]]
id = "shelf-bar-vertical"
what = "Shelf bar up into the bottom extrusion's underside slots"
size = 8
count = 4
length = 50
head = "socket, counterbored"
into = "t-nut"
grip = ["SHELF_VERT_GRIP"]
source = "his, 2026-10-11"
note = "🔴 SOCKET HEAD AND COUNTERBORED, not flange - the only joint on the machine that is. ✅ THE GRIP IS THE BAR'S HEIGHT LESS THE COUNTERBORE, 42.8 - these run UP through the 50.8 height, counterbored from below, where it is the HORIZONTAL pair that cross the 25.4 width. 🔴 THIS ENTRY HAD THE WIDTH, which made the M8 x 50 look 26.6 too long when it is right: 7.2 past the bar, the T-nut takes TNUT_THREAD_M8 of it and 1.2 stands into the slot."

[[joint]]
id = "rear-plate-to-tongue"
what = "Rear plate through the back tongue"
size = 8
count = 8
length = 45
head = "small flange"
into = "acorn"
grip = ["T_BOX_TONGUE", "T_REAR_PLATE", "FENDER_WASHER_T", "FENDER_WASHER_T"]
extras = ["M8 fender washer", "M8 fender washer", "M8 acorn nut"]
source = "his, 2026-10-11 - M8 x 45 on TWO fender washers"
note = "From outboard: fender washer, tongue, plate, then a SECOND FENDER WASHER UNDER THE ACORN NUT - his, 2026-10-11, and it is what makes a 45 work here. 🔴 THE 40 ENGAGED 6.65, UNDER ONE DIAMETER, AND NO LONGER BOLT COULD FIX IT: a 45 on one washer wants 11.65 of nut against the ACORN_NUT_DEPTH of 11 and would bottom on the dome. The second washer lifts the nut 2, so the same 45 protrudes 9.65 - inside the 11, inside the ACORN_NUT_THREAD of 10, and engaging 9.65 instead of 6.65. ⚠️ THE WASHER IS THE PART THAT MAKES THE LENGTH LEGAL, so do not drop one to tidy the stack."

[[joint]]
id = "side-plate-to-tongue"
what = "Side plates through the side tongues"
size = 8
count = 14
per = "7 per beam"
length = 40
head = "small flange"
into = "acorn"
grip = ["T_BOX_TONGUE", "T_SIDE_PLATE", "FENDER_WASHER_T"]
extras = ["M8 fender washer", "M8 acorn nut"]
source = "assembly.md: 'M8 at 150 mm, first at 50 - seven per beam, at Y 30'"

[[joint]]
id = "fin-to-angle"
what = "Front fin to its angle, tapped"
size = 8
count = 4
per = "2 per fin"
length = 16
into = "tapped"
grip = ["FIN_ANGLE_T"]
source = "his, 2026-10-11"
note = "Tapped because the tee track bed is hard against the fin's back face - a nut would foul it."

[[joint]]
id = "fin-angle-to-skin"
what = "Fin angle down into T-nuts in the top skin"
size = 8
count = 6
per = "3 per angle"
length = 30
into = "t-nut"
tnut_thread = "FIN_ANGLE_TNUT_THREAD"
grip = ["FIN_ANGLE_BOLT_DEAD"]   # leg + the EMPTY hole above the T-nut
source = "his, 2026-10-11"
note = "THE T-NUT'S THREAD IS IN THE BOTTOM 10 OF THE SKIN, so the grip includes the empty 15 above it - see FIN_ANGLE_BOLT_DEAD. An M8 x 25 was specified first and would have engaged 4."

[[joint]]
id = "bed-to-side-plate"
what = "Tee track bed ends, through the side plates"
size = 5
count = 16
per = "2 per panel end, four panels"
length = 20
into = "tapped"
grip = ["T_SIDE_PLATE", "TT_BED_SPACER_PART"]
source = "his, 2026-10-11"
note = "The panel ends were drilled 4.2 and tapped M5, 15 deep."

[[joint]]
id = "spindle-clamp"
what = "Spindle clamps to the Z plate"
size = 8
count = 4
length = 90
into = "tapped"
source = "registry BOLT_SPINDLE_CLAMP = 90"

[[joint]]
id = "y-nut-to-sole"
what = "Y ball nut up into the sole bracket"
size = 5
count = 8
per = "4 per nut"
length = 16
into = "tapped"
grip = ["T_SOLE_BRACKET"]
source = "registry BOLT_Z_NUT = 16"
note = "THREADED INTO THE NUT BODY. 🔴 THE LENGTH WAS IN THE REGISTRY ALL ALONG as BOLT_Z_NUT and was simply not linked here - the schedule reported it as a gap when the figure existed. ✅ THE SAME M5 x 16 SERVES ALL FOUR NUTS, which was chosen over an M5 x 12 on Y precisely so one length and one tap setting cover the build. ⚠️ THE HOUSING MUST BE TAPPED DEEPER FIRST - see NUT_TAP_DEPTH, and note that his recollection of the as-supplied thread (6, tapped to 11) does not match the file (8, tapped to 12 working). It changes nothing: 9.65 of engagement fits under either."

[[joint]]
id = "post-tenon-screw"
what = "One angled screw into the side of each post tenon"
count = 3
into = "wood"
source = "assembly.md: 'Drive one screw at an angle into the side of each tenon, from inside the cavity'"
note = "BEFORE THE TOP SKIN IS GLUED - there is no access afterwards. Size and length never stated."
