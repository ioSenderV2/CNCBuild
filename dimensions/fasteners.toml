# The fastener schedule.
#
# WHY THIS EXISTS: the registry knows where every fastener GOES - it is full of
# BOLT_* position symbols - and it did not know how LONG any of them is. Lengths
# lived scattered in prose, and the length is the figure that gets guessed at the
# bench. This repo has been bitten by that twice in one day: an M8 x 25 that
# engaged 4 mm because a T-nut's thread sits in the BOTTOM of a 25 skin, and a
# fin bolt that had to be 16 rather than 15.
#
# RULES FOR THIS FILE, and they are the point of it:
#   - `length` is filled ONLY where a file or he states one. Blank means
#     UNKNOWN and the tool reports it. Nothing here is inferred.
#   - `source` says where the entry came from. An entry with no source is a
#     guess and should not be here.
#   - `grip` is the stack the bolt passes through before it meets thread,
#     written as registry symbols so it moves when they do. Where the stack is
#     not known, leave it out rather than approximate it.
#   - `into` says what carries the thread: tapped, t-nut, nut, or bore.
#
# Read with tools/make-fasteners.py.

[[joint]]
id = "rail-to-beam"
what = "Linear rails to the X, Y1 and Y2 beams"
size = 5
count = 102
per = "17 per rail, two rails per beam, three beams"
length = 16
head = "socket"
into = "t-nut"
source = "his count 2026-10-11; length from assembly.md 'M5 x 16 into T-nuts, 17 per rail at 60 mm'"
note = "o6 through with a o9.5 counterbore. An M6 head will not enter a 9.5 counterbore. COUNT CORRECTED FROM 68: this file had four rails, but README says ONE RAIL PER PROFILE and a beam is two stacked 30-6060, so it is six rails across the three beams, not four."

[[joint]]
id = "z-rail-to-carriage"
what = "Z rails to the X carriage plate"
size = 5
count = 14
per = "7 per rail, two rails"
length = 20
groups = [["X carriage plate", 14]]
head = "socket"
into = "tapped"
grip = ["Z_RAIL_BOLT_GRIP"]
source = "his, 2026-10-11"
note = "TAPPED INTO THE PLATE, not a T-nut - the X carriage plate is 1/2in and carries the thread itself. 10 of engagement, and it stops 2.7 SHORT of the far face, so nothing breaks through to the back of the plate. FLAG: A DIFFERENT KIT from the beam rails: 7 holes on a 400 rail against 17 at 60 on the metre rails, and the repo warns against quoting one kit's figures for the other."

[[joint]]
id = "front-strip"
what = "Front joining strips to the beams - his INSIDE JOINER PLATES"
size = 8
count = 42
per = "14 per strip, three strips"
length = 10
groups = [["X inside joiner plate", 14], ["Y1 inside joiner plate", 14], ["Y2 inside joiner plate", 14]]
head = "flange, low profile"
into = "t-nut"
grip = ["T_FRONT_STRIP"]
source = "assembly.md: 'The buy: 42 x M8 x 10 A4 / 316 (front strips)'"
note = "A4/316. OPEN: THE LENGTH WANTS RE-PICKING AND THE OLD REASON FOR IT WAS WRONG - his catch 2026-10-14. This read 'an M8 x 12 reaches 8.0 past the plate against a 7.2 limit', which double-counted TSLOT_LIP_T: a bolt crosses the 2.3 lip before it meets any thread, so the ceiling past a plate is the slot floor at 9.3 and full engagement starts at 8.3. On the measured 3 strip the M8 x 10 engages only STRIP_BOLT_ENGAGE's 4.7 of the 6 available and sits 2.3 clear of the floor; an M8 x 12 takes the full 6 and still clears by 0.3. FLAG: ONE PART, TWO NAMES: the model and this file call it the FRONT STRIP, he calls it the INSIDE JOINER PLATE - and it is inside, on the Y beams' inboard faces and the X beam's front face. His function groups were first read as the BACK joining plates and that was wrong, his correction 2026-10-11."

[[joint]]
id = "y-back-plate"
what = "Y back joining plates to the beams"
size = 8
count = 56
length = 10
head = "flange"
into = "t-nut"
source = "assembly.md: '56 x M8 x 10 plain + 56 washers (Y backs)'"
note = "Plain, plus a washer each."

[[joint]]
id = "x-back-plate"
what = "X back joining plate to the beam"
size = 8
count = 28
length = 14
head = "flange"
into = "t-nut"
grip = ["T_BACK_JOIN_PLATE"]
source = "his, 2026-10-11 - 14, not the 12 assembly.md gave"
note = "FLAG: IT WAS 12 UNTIL HE CORRECTED IT, from assembly.md's '28 x M8 x 12 (X back)'. The 2 buys thread in the T-nut and the plate is the same, so nothing else moves."

[[joint]]
id = "x-interposer-to-beam"
what = "X interposer bar DOWN into the X beam's top T-slots"
size = 8
count = 4
per = "2 rows x 2 slots, one bar"
length = 20
groups = [["Interposer/stepper assembly/BF12 for X", 4]]
head = "flange"
into = "t-nut"
grip = ["T_INTERPOSER"]
source = "his, 2026-10-11"
note = "FLAG: THIS BAR SITS ON TOP OF THE X BEAM, so these drive DOWNWARD into the TOP slots and the heads stand up - his, 2026-10-11, and tools/make-3d.py already draws it that way. They were in one entry with the Y bars' eight, whose note said everything below the beam is in tension, and that reads exactly backwards here: the bar is in COMPRESSION under the casting, and these bolts locate it rather than hang it. SETTLED: 20 LONG TAKES ALL 6 OF THE T-NUT'S THREAD - see TNUT_THREAD_M8 - with 10 left after the interposer. NOTE: IT IS THE SAME BAR AS Y - Sheet 6 makes three."

[[joint]]
id = "y-interposer-to-beam"
what = "Y1 and Y2 interposer bars UP into the beams' underside T-slots, AT THE REAR"
size = 8
count = 8
per = "4 per bar, two bars"
length = 20
groups = [["Interposer/stepper assembly/BF12 for Y1", 4], ["Interposer/stepper assembly/BF12 for Y2", 4]]
head = "flange"
into = "t-nut"
grip = ["T_INTERPOSER"]
source = "his, 2026-10-11; the 3D model independently draws 4 per bar"
note = "EVERYTHING BELOW THE BEAM IS IN TENSION HERE - these bars HANG under the beams, so these hold the bar UP against the underside and the heads are below. FLAG: COUNT CORRECTED FROM 18: assembly.md said six per bar in three rows, but make-3d draws TWO rows x TWO slots = four, and he says four. The model and he agree; the prose was the odd one out. SETTLED: 20 LONG TAKES ALL 6 OF THE T-NUT'S THREAD - see TNUT_THREAD_M8 - with 10 left after the interposer."

[[joint]]
id = "stepper-to-frame"
what = "Stepper motors to the cast stepper frame"
size = 4
count = 16
per = "4 per motor"
length = 16
groups = [["Interposer/stepper assembly/BF12 for X", 4], ["Interposer/stepper assembly/BF12 for Y1", 4], ["Interposer/stepper assembly/BF12 for Y2", 4]]
head = "socket"
into = "tapped"
source = "his, 2026-10-11"
note = "FLAG: THIS JOINT WAS MISSING FROM THE SCHEDULE ENTIRELY until he listed it - every motor on the machine hangs on these and not one was counted. NO GRIP RECORDED: the frame's thickness at the motor face is not a figure in the registry, so engagement is left blank rather than approximated."

[[joint]]
id = "casting-rails"
what = "Cast stepper frame, through its rails into the interposer"
size = 5
count = 6
per = "2 per casting, three castings"
length = 35
groups = [["Interposer/stepper assembly/BF12 for X", 2], ["Interposer/stepper assembly/BF12 for Y1", 2], ["Interposer/stepper assembly/BF12 for Y2", 2]]
head = "socket"
into = "tapped"
grip = ["CASTING_RAIL_H"]   # the interposer is TAPPED, so it is thread, not grip
source = "his, 2026-10-11 - 35, corrected down from 40 the same day"
note = "OPEN: THE 35 LEAVES 5 OF ENGAGEMENT in the interposer, EXACTLY 1 x D on an M5, where the 40 gave 10. His call. It sits right on the threshold: the under-one-diameter check is strictly less-than, so this passes without a flag - it is the thinnest engagement on the machine that the tool will not warn about."

[[joint]]
id = "casting-block"
what = "Cast stepper frame, either side of the bearing block, into the interposer"
size = 5
count = 12
per = "4 per casting, three castings"
length = 45
groups = [["Interposer/stepper assembly/BF12 for X", 4], ["Interposer/stepper assembly/BF12 for Y1", 4], ["Interposer/stepper assembly/BF12 for Y2", 4]]
head = "socket"
into = "tapped"
grip = ["CASTING_T_AT_BLOCK"]   # ditto - tapped, not grip
source = "his, 2026-10-11"

[[joint]]
id = "bf12-to-rear-plate"
what = "BF12 face-mounted into the front fin, Y1 and Y2"
size = 5
count = 8
per = "4 per BF12, two BF12"
length = 30
groups = [["Interposer/stepper assembly/BF12 for Y1", 4], ["Interposer/stepper assembly/BF12 for Y2", 4]]
head = "socket"
into = "tapped"
grip = ["BF12_BODY_AT_BOLT"]
extras = []
source = "his, 2026-10-13 - the same fastener as X's"
note = "M5 x 30, THE SAME BOLT AS THE X TONGUE'S - his call on the flip, 2026-10-13, and it makes one length serve all twelve BF12 bolts on the machine. FLAG: IT ENDS FLUSH RATHER THAN STOPPING SHORT. BF12_BODY_AT_BOLT is 20, so a 30 engages 10, and T_FIN is 10 - a tapped-through hole finishing level with the fin's outboard face. That is 2 x D in aluminium, against the 1 x D in steel the old arrangement had. FLAG: THE ID STILL SAYS REAR-PLATE. It is the joint's key, quoted by tools/make-3d.py, so renaming it is a two-file change and it is kept until the sheets are redrawn. Superseded: M5 x 25 into the 6.35 rear plate, which was chosen so nothing protruded at the back - the joint is at the FRONT now and the question does not arise."

[[joint]]
id = "bf12-to-x-tongue"
what = "BF12 face-mounted into the X end plate's tongue"
size = 5
count = 4
per = "4 per BF12, one BF12"
length = 30
groups = [["Interposer/stepper assembly/BF12 for X", 4]]
head = "socket"
into = "tapped"
grip = ["BF12_BODY_AT_BOLT"]
source = "his, 2026-10-11"
note = "M5 x 30 into 1/2in plate: 10 of engagement, 2 x D, stopping 2.19 short of the far face. SETTLED: TWELVE IN TOTAL, SPLIT 8 PLUS 4 - his confirmation 2026-10-11. The eight are the rear plate's two BF12 at M5 x 25, these four are X's at 30, and the two lengths differ only because the plates do."

[[joint]]
id = "rear-plate-to-beam-ends"
what = "Rear plate into the ends of the Y1 and Y2 beams"
size = 8
count = 16
per = "8 per beam"
length = 35
groups = [["Backplate", 16]]
head = "flange"
into = "bore"
grip = ["T_REAR_PLATE"]
source = "his, 2026-10-11; assembly.md: '8 x M8 into each beam's corner bores - 16 bolts total'"
note = "FLAG: THIS JOINT WAS MISSING FROM THE SCHEDULE ENTIRELY until he listed it - it is in assembly.md and was simply not transcribed. LENGTH STILL UNKNOWN: it wants T_REAR_PLATE of grip plus whatever engagement into the o6.65 corner bore, and the beam-to-endplate joint's M8 x 35 is the obvious comparison."

[[joint]]
id = "fin-to-beam-end"
what = "Front fin onto the end of each Y beam"
size = 8
count = 16
per = "8 per fin, two fins"
length = 35
groups = [["Y1 Front fin", 8], ["Y2 Front fin", 8]]
head = "flange"
into = "bore"
source = "his, 2026-10-11; assembly.md: '8 x M8 x 35 flange bolts into the o6.65 lengthwise corner bores'"
note = "Flange head. M8 x 35 leaves 22.3 in the extrusion. FLAG: THIS WAS ENTERED AS 'Y beams into the end plates' - MY MISLABEL. The section it came from is the FRONT FIN's, which is why its M8 columns are at 35 and 65 from the factory edge. Same bolts, wrong name, and a wrong name is how a joint gets counted twice or missed."

[[joint]]
id = "xep-to-xbeam"
what = "X end plates to the X beam's top extrusion corner bores"
size = 8
count = 8
per = "4 per plate"
length = 35
groups = [["Left X endplate", 4], ["Right X endplate", 4]]
head = "flange"
into = "bore"
grip = ["T_X_ENDPLATE"]
source = "his, 2026-10-11; assembly.md: '4 x M8 into the top extrusion's corner bores, 9 mm clearance'"
note = "Flange head, same 35 as the other two bore joints."

[[joint]]
id = "shelf-bar-horizontal"
what = "Shelf bar horizontally into the X end plate"
size = 8
count = 4
length = 35
groups = [["Left X endplate", 2], ["Right X endplate", 2]]
head = "flange, low profile"
into = "tapped"
grip = ["SHELF_BAR_W"]
source = "assembly.md: 'M8 x 35 into the end plate' and 'M8 x 35, not x 40'"
note = "Through 25.4 of bar into 12.7 of plate gives ~9.6 of engagement. AN M8 x 40 PROTRUDES ~1.6 ONTO THE Y BEARING BLOCK. THE BAR'S HOLE IS SHELF_HORIZ_CLEARANCE, the close fit, NOT the 9 used into extrusion - the bar is the platform the roll shim bears against. Drill the bar first and spot the plate's blind taps off it."

[[joint]]
id = "shelf-bar-vertical"
what = "Shelf bar up into the bottom extrusion's underside slots"
size = 8
count = 4
length = 50
groups = [["Left X endplate", 2], ["Right X endplate", 2]]
head = "socket, counterbored"
into = "t-nut"
grip = ["SHELF_VERT_GRIP"]
source = "his, 2026-10-11"
note = "FLAG: SOCKET HEAD AND COUNTERBORED, not flange - the only joint on the machine that is. SETTLED: THE GRIP IS THE BAR'S HEIGHT LESS THE COUNTERBORE, 42.8 - these run UP through the 50.8 height, counterbored from below, where it is the HORIZONTAL pair that cross the 25.4 width. FLAG: THIS ENTRY HAD THE WIDTH, which made the M8 x 50 look 26.6 too long when it is right: 7.2 past the bar, and nothing bottoms - the floor is 9.3 past. OPEN: THE BREAKDOWN HERE WAS WRONG AND THE BOLT IS SHORT, same correction as the front strip, 2026-10-14: it said the T-nut takes TNUT_THREAD_M8 of the 7.2 and 1.2 stands into the slot, which forgot the 2.3 of lip the bolt crosses first. The real engagement is 4.9 of the 6 available. Full engagement wants 42.8 + BOLT_FULL_ENGAGE, about an M8 x 52. THE BAR'S HOLE IS SHELF_VERT_CLEARANCE, the close fit: these get SLACKENED to slide the roll shim in, and a free-fit hole would let the bar shift in Y on re-torque and walk off the T-nuts."

[[joint]]
id = "rear-plate-to-tongue"
what = "Rear plate through the back tongue"
size = 8
count = 8
length = 45
groups = [["Backplate", 8]]
head = "flange"
into = "acorn"
grip = ["T_BOX_TONGUE", "T_REAR_PLATE", "FENDER_WASHER_T", "FENDER_WASHER_T", "FENDER_WASHER_T"]
extras = ["M8 fender washer", "M8 fender washer", "M8 fender washer", "M8 acorn nut"]
source = "his, 2026-10-11 - M8 x 45 on TWO fender washers"
note = "From outboard: fender washer, tongue, plate, then a SECOND FENDER WASHER UNDER THE ACORN NUT - his, 2026-10-11. SETTLED: THREE WASHERS, AND THE M8 x 45 IS KEPT - his call, 2026-10-12. He calipered the fender washers at 1.1 against the catalogue 2 this joint was designed on, which took two washers from lifting the nut 4 to lifting it 2.2 and put the same 45 at 11.45 protruding against an ACORN_NUT_DEPTH of 11 - make-fasteners.py called it 0.45 too long, bottoming on the dome. The third washer lifts the stack to 3.3, so it protrudes 10.35: inside the 11 with 0.65 spare, and engagement caps at ACORN_NUT_THREAD so it now engages the FULL 10 against the 9.65 this joint was originally designed for. Better than it was. The buy list goes 30 to 38 fender washers. FLAG: GOING BACK TO A 40 WAS NOT AN OPTION - that was the original fault here, engaging 6.65, under one diameter, and the whole reason the 45 and the second washer were chosen. FLAG: THAT IS TWO WASHERS STACKED UNDER THE NUT with one outboard. Fine in compression against steel plate; a single 2.2 spacer under the nut would do the same job with one fewer interface if that is ever preferred."

[[joint]]
id = "side-plate-to-tongue"
what = "Side plates through the side tongues"
size = 8
count = 14
per = "7 per beam"
length = 40
groups = [["Y1 Side Plate", 7], ["Y2 Side Plate", 7]]
head = "flange"
into = "acorn"
grip = ["T_BOX_TONGUE", "T_SIDE_PLATE", "FENDER_WASHER_T"]
extras = ["M8 fender washer", "M8 acorn nut"]
source = "assembly.md: 'M8 at 150 mm, first at 50 - seven per beam, at Y 30'"

