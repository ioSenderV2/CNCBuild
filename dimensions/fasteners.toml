head = "socket"
into = "tapped"
grip = ["T_SIDE_PLATE", "TT_BED_SPACER_PART"]
source = "his, 2026-10-11"
note = "The panel ends were drilled 4.2 and tapped M5, 15 deep."

[[joint]]
id = "spindle-clamp"
what = "Spindle clamps to the Z plate"
size = 8
count = 4
length = 90
groups = [["Z plate", 4]]
head = "socket"
into = "tapped"
source = "registry BOLT_SPINDLE_CLAMP = 90"

[[joint]]
id = "y-nut-to-sole"
what = "Y ball nut up into the sole bracket"
size = 5
count = 8
per = "4 per nut"
length = 16
head = "socket"
into = "tapped"
grip = ["T_SOLE_BRACKET"]
source = "registry BOLT_Z_NUT = 16"
note = "THREADED INTO THE NUT BODY. FLAG: THE LENGTH WAS IN THE REGISTRY ALL ALONG as BOLT_Z_NUT and was simply not linked here - the schedule reported it as a gap when the figure existed. SETTLED: THE SAME M5 x 16 SERVES ALL FOUR NUTS, which was chosen over an M5 x 12 on Y precisely so one length and one tap setting cover the build. OPEN: THE HOUSING MUST BE TAPPED DEEPER FIRST - see NUT_TAP_DEPTH, and note that his recollection of the as-supplied thread (6, tapped to 11) does not match the file (8, tapped to 12 working). It changes nothing: 9.65 of engagement fits under either."

[[joint]]
id = "post-tenon-screw"
what = "One angled screw into the side of each post tenon"
count = 3
into = "wood"
source = "assembly.md: 'Drive one screw at an angle into the side of each tenon, from inside the cavity'"
note = "BEFORE THE TOP SKIN IS GLUED - there is no access afterwards. Size and length never stated."
